# MountainHR Frontend - Production Docker Compose
# This configuration sets up a production-ready deployment with load balancing,
# monitoring, and proper security configurations

version: '3.8'

services:
  # Frontend Application (Multiple instances for load balancing)
  frontend-1:
    build:
      context: .
      target: runtime
      dockerfile: Dockerfile
    image: mountainhr-frontend:latest
    container_name: mountainhr-frontend-1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
    ports:
      - "3001:3000"
    networks:
      - mountainhr-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  frontend-2:
    build:
      context: .
      target: runtime
      dockerfile: Dockerfile
    image: mountainhr-frontend:latest
    container_name: mountainhr-frontend-2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
    ports:
      - "3002:3000"
    networks:
      - mountainhr-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  # Nginx Load Balancer
  nginx:
    image: nginx:1.24-alpine
    container_name: mountainhr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      frontend-1:
        condition: service_healthy
      frontend-2:
        condition: service_healthy
    networks:
      - mountainhr-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Redis for Session Storage and Caching
  redis:
    image: redis:7.2-alpine
    container_name: mountainhr-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - mountainhr-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"

  # Monitoring and Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: mountainhr-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - mountainhr-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Grafana for Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: mountainhr-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - mountainhr-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: mountainhr-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - mountainhr-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Log Shipping
  promtail:
    image: grafana/promtail:latest
    container_name: mountainhr-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - mountainhr-network

  # Health Check Service
  healthcheck:
    image: alpine/curl:latest
    container_name: mountainhr-healthcheck
    restart: unless-stopped
    command: >
      sh -c "
      while true; do
        curl -f http://nginx/health || exit 1
        sleep 30
      done"
    depends_on:
      - nginx
    networks:
      - mountainhr-network

volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

networks:
  mountainhr-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16