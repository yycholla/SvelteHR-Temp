version: 2
updates:
  # Frontend dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group ALL minor and patch updates into a single PR
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Major updates get separate PRs (need review)
      # No group defined - creates individual PRs for major updates

  # Rust backend dependencies (Cargo)
  - package-ecosystem: "cargo"
    directory: "/graphql-rust-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "rust"
      - "backend"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group all minor and patch updates together
      rust-minor-patches:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Major updates get separate PRs (need review)

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github-actions"
      - "ci/cd"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      # Group ALL Actions updates into a single PR
      all-actions:
        patterns:
          - "*"

  # Docker dependencies (frontend)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    groups:
      all-docker:
        patterns:
          - "*"

  # Docker dependencies (Rust backend)
  - package-ecosystem: "docker"
    directory: "/graphql-rust-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
      - "backend"
      - "automated"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    groups:
      all-docker-backend:
        patterns:
          - "*"
