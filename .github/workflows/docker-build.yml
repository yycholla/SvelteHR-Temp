name: Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths:
      - 'graphql-rust-server/**'
      - 'src/**'
      - 'Dockerfile'
      - 'package*.json'
      - '.github/workflows/docker-build.yml'

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  # Docker registry names must be lowercase
  REPO_LOWERCASE: ${{ github.repository }}

jobs:
  # Detect which services have changed
  detect-changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'graphql-rust-server/**'
              - '.github/workflows/docker-build.yml'
            frontend:
              - 'src/**'
              - 'Dockerfile'
              - 'package*.json'
              - '.github/workflows/docker-build.yml'

  # Build Rust backend images (3 targets in parallel)
  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Convert repository name to lowercase
        id: repo
        run: echo "lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Clean BuildKit cache if corrupted
        continue-on-error: true
        run: |
          echo "Checking BuildKit cache health..."
          # Test if buildx is working
          docker buildx inspect || {
            echo "BuildKit unhealthy, cleaning cache..."
            docker buildx prune --all --force || true
            sudo rm -rf /var/lib/buildkit/*.db 2>/dev/null || true
          }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lowercase }}/backend-server
          tags: |
            # Semantic version tags from git tags (e.g., 1.2.3)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Latest tag for main branch (when no version tag)
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - name: Record build start time
        id: build-start
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build and push backend (server with all binaries)
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./graphql-rust-server
          file: ./graphql-rust-server/Dockerfile.prod
          target: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Calculate build time
        id: build-time
        run: |
          end_time=$(date +%s)
          start_time=${{ steps.build-start.outputs.start_time }}
          duration=$((end_time - start_time))
          echo "duration=$duration" >> $GITHUB_OUTPUT
          echo "⏱️ Backend ${{ matrix.target }} build took ${duration}s"

      - name: Save build metrics
        run: |
          mkdir -p build-metrics
          cat > build-metrics/backend-${{ matrix.target }}.json <<EOF
          [{
            "name": "Backend ${{ matrix.target }} Build Time",
            "unit": "seconds",
            "value": ${{ steps.build-time.outputs.duration }}
          }]
          EOF

      - name: Upload build metrics
        uses: actions/upload-artifact@v5
        with:
          name: build-metrics-backend-${{ matrix.target }}
          path: build-metrics/
          retention-days: 30

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}

  # Build frontend image
  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Convert repository name to lowercase
        id: repo
        run: echo "lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate package-lock.json if missing
        run: |
          if [ ! -f package-lock.json ]; then
            echo "⚠️ package-lock.json not found, generating..."
            npm install --package-lock-only
            echo "✅ package-lock.json generated"
          else
            echo "✅ package-lock.json exists"
          fi

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Clean BuildKit cache if corrupted
        continue-on-error: true
        run: |
          echo "Checking BuildKit cache health..."
          # Test if buildx is working
          docker buildx inspect || {
            echo "BuildKit unhealthy, cleaning cache..."
            docker buildx prune --all --force || true
            sudo rm -rf /var/lib/buildkit/*.db 2>/dev/null || true
          }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lowercase }}/frontend
          tags: |
            # Semantic version tags from git tags (e.g., 1.2.3)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Latest tag for main branch (when no version tag)
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - name: Record build start time
        id: build-start
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build and push frontend
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            NODE_ENV=production

      - name: Calculate build time
        id: build-time
        run: |
          end_time=$(date +%s)
          start_time=${{ steps.build-start.outputs.start_time }}
          duration=$((end_time - start_time))
          echo "duration=$duration" >> $GITHUB_OUTPUT
          echo "⏱️ Frontend build took ${duration}s"

      - name: Save build metrics
        run: |
          mkdir -p build-metrics
          cat > build-metrics/frontend.json <<EOF
          [{
            "name": "Frontend Build Time",
            "unit": "seconds",
            "value": ${{ steps.build-time.outputs.duration }}
          }]
          EOF

      - name: Upload build metrics
        uses: actions/upload-artifact@v5
        with:
          name: build-metrics-frontend
          path: build-metrics/
          retention-days: 30

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}

  # Helm chart validation and linting
  helm-lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Update Helm dependencies
        run: |
          cd k8s/helm-charts/sveltehr
          helm dependency update

      - name: Lint Helm chart
        run: |
          cd k8s/helm-charts/sveltehr
          helm lint . -f values-dev.yaml
          helm lint . -f values.yaml -f values-prod.yaml

      - name: Template validation (dev)
        run: |
          helm template sveltehr ./k8s/helm-charts/sveltehr \
            -f k8s/helm-charts/sveltehr/values-dev.yaml \
            --namespace sveltehr-dev \
            --debug > /tmp/helm-dev-template.yaml
          echo "✓ Dev template validation passed"

      - name: Template validation (prod)
        run: |
          helm template sveltehr ./k8s/helm-charts/sveltehr \
            -f k8s/helm-charts/sveltehr/values.yaml \
            -f k8s/helm-charts/sveltehr/values-prod.yaml \
            --namespace sveltehr-prod \
            --debug > /tmp/helm-prod-template.yaml
          echo "✓ Prod template validation passed"

      - name: Upload Helm templates
        uses: actions/upload-artifact@v5
        with:
          name: helm-templates
          path: /tmp/helm-*.yaml
          retention-days: 7

  # Summary job
  build-summary:
    needs: [detect-changes, build-backend, build-frontend, helm-lint]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.detect-changes.outputs.backend }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.detect-changes.outputs.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.build-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.build-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Helm Chart: ${{ needs.helm-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "### Images Built" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${REPO_LOWER}/backend-server:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${REPO_LOWER}/backend-migration:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${REPO_LOWER}/backend-seed:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${REPO_LOWER}/frontend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Helm Chart" >> $GITHUB_STEP_SUMMARY
          echo "- Version: 2.0.0" >> $GITHUB_STEP_SUMMARY
          echo "- Chart validated for dev and prod environments" >> $GITHUB_STEP_SUMMARY
          echo "- Templates available as workflow artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cache Benefits" >> $GITHUB_STEP_SUMMARY
          echo "- Rust builds: cargo-chef + BuildKit target cache" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend builds: npm cache + Vite cache mounts" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Actions cache: Layer caching between runs" >> $GITHUB_STEP_SUMMARY
