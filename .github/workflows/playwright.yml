name: Playwright Tests (with Docker backend)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs when a new workflow with the same group name is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build backend image once and cache it for all test shards
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Go backend
        uses: docker/build-push-action@v5
        with:
          context: ./MountainHR
          file: ./MountainHR/Dockerfile
          push: false
          tags: mountainhr-backend:test
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test
          outputs: type=docker,dest=/tmp/backend-image.tar

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/backend-image.tar
          retention-days: 1

  # Run Playwright tests in parallel across 4 shards
  test:
    name: E2E Tests (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Load backend image
        run: docker load --input /tmp/backend-image.tar

      - name: Start backend services
        run: |
          docker compose -f MountainHR/docker-compose.yml up -d db
          docker run -d -p 8080:8080 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=mountainhr \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            --network=host \
            mountainhr-backend:test

          echo "Waiting for backend on :8080..."
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
              echo "✅ Backend is up"
              break
            fi
            sleep 2
          done

      - name: Run Playwright tests (Shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots-${{ matrix.shard }}
          path: test-results/
          retention-days: 30

  # Merge Playwright reports from all shards
  merge-reports:
    name: Merge Test Reports
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-*
          path: all-reports/

      - name: Merge reports
        run: |
          npm install -g @playwright/test
          npx playwright merge-reports ./all-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 30

  # Performance tests run separately (not sharded)
  performance-test:
    name: Performance Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Load and start backend
        run: |
          docker load --input /tmp/backend-image.tar
          docker compose -f MountainHR/docker-compose.yml up -d db
          docker run -d -p 8080:8080 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=mountainhr \
            --network=host \
            mountainhr-backend:test

          for i in {1..60}; do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then break; fi
            sleep 2
          done

      - name: Run Performance tests
        run: npm run test:performance
        env:
          CI: true

      - name: Upload Performance Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: playwright-results.json
          retention-days: 30
