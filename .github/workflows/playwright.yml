name: Playwright Tests (with Docker backend)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SvelteHR

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies (frontend)
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start Go backend (docker-compose)
        run: |
          docker compose -f MountainHR/docker-compose.yml build go-backend
          docker compose -f MountainHR/docker-compose.yml up -d db go-backend
          echo "Waiting for backend on :8080..."
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then echo "Backend is up"; break; fi
            sleep 2
          done
        working-directory: .
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mountainhr
          DB_PORT: 5432

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: e2e/screenshots/
          retention-days: 30

  performance-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: SvelteHR

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies (frontend)
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Performance tests
        run: npm run test:performance
        env:
          CI: true

      - name: Upload Performance Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: playwright-results.json
          retention-days: 30
