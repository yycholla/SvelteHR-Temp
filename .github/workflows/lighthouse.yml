name: Lighthouse CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'static/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'svelte.config.js'
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip Lighthouse on Dependabot PRs (expensive)
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start preview server
        run: |
          npm run preview &
          echo "Waiting for server..."
          for i in {1..30}; do
            if curl -fsS http://localhost:4173/ >/dev/null 2>&1; then
              echo "✅ Server is ready"
              break
            fi
            sleep 2
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173
            http://localhost:4173/dashboard
            http://localhost:4173/employees
            http://localhost:4173/hr/time-off
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload Lighthouse Reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const resultsPath = '.lighthouseci/manifest.json';

            if (fs.existsSync(resultsPath)) {
              const manifest = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));

              let comment = '## ⚡ Lighthouse Performance Report\\n\\n';
              comment += '| URL | Performance | Accessibility | Best Practices | SEO |\\n';
              comment += '|-----|-------------|---------------|----------------|-----|\\n';

              for (const result of manifest) {
                const url = result.url.replace('http://localhost:4173', '');
                const perf = Math.round(result.summary.performance * 100);
                const a11y = Math.round(result.summary.accessibility * 100);
                const bp = Math.round(result.summary['best-practices'] * 100);
                const seo = Math.round(result.summary.seo * 100);

                comment += `| ${url || '/'} | ${perf} | ${a11y} | ${bp} | ${seo} |\\n`;
              }

              comment += '\\n[View full report](' + manifest[0].htmlPath + ')\\n';

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
