name: Benchmark (Rust Backend)

on:
  push:
    branches: [main]
    paths:
      - 'graphql-rust-server/**'
      - '.github/workflows/rust-benchmark.yml'
  pull_request:
    branches: [main]
    paths:
      - 'graphql-rust-server/**'
      - '.github/workflows/rust-benchmark.yml'
  workflow_dispatch:  # Allow manual triggering

# Cancel in-progress runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    # Skip benchmarks on Dependabot PRs
    if: github.actor != 'dependabot[bot]'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: benchmark_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            graphql-rust-server/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      - name: Run benchmarks
        working-directory: ./graphql-rust-server
        run: cargo bench --bench resolver_benchmarks -- --output-format bencher | tee benchmark_output.txt

      - name: Store benchmark result (GitHub Pages)
        uses: benchmark-action/github-action-benchmark@v1
        if: github.ref == 'refs/heads/main'
        with:
          name: Rust Resolver Benchmarks
          tool: 'cargo'
          output-file-path: ./graphql-rust-server/benchmark_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Publish to gh-pages branch
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks
          # Show alert with commit comment on detecting possible performance regression
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          # Comment always on main branch commits
          comment-always: true
          summary-always: true

      - name: Generate benchmark summary
        run: |
          echo "## 📊 Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Detailed benchmark results have been stored in GitHub Pages." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View full results:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/benchmarks/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parse benchmark output for summary
          if [ -f benchmark_output.txt ]; then
            echo "### Top 5 Benchmarks" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Benchmark | Time (ns/iter) |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|----------------|" >> $GITHUB_STEP_SUMMARY
            head -5 benchmark_output.txt | while read line; do
              echo "| $line |" >> $GITHUB_STEP_SUMMARY
            done
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: graphql-rust-server/target/criterion/
          retention-days: 30

  benchmark-comparison:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: benchmark_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v5

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            graphql-rust-server/target
          key: ${{ runner.os }}-cargo-bench-pr-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      - name: Run PR benchmarks
        working-directory: ./graphql-rust-server
        run: cargo bench --bench resolver_benchmarks -- --save-baseline pr

      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Run main benchmarks
        working-directory: ./graphql-rust-server
        run: cargo bench --bench resolver_benchmarks -- --save-baseline main

      - name: Compare benchmarks
        working-directory: ./graphql-rust-server
        run: cargo bench --bench resolver_benchmarks -- --baseline main --load-baseline pr

      - name: Store PR benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rust Resolver Benchmarks (PR)
          tool: 'cargo'
          output-file-path: ./graphql-rust-server/benchmark_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          save-data-file: true
          comment-on-alert: true
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Comment PR with benchmark comparison
        uses: actions/github-script@v8
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let comment = `## ⚡ Performance Benchmark Comparison\n\n`;
            comment += `Benchmarks have been run comparing this PR against the main branch.\n\n`;

            // Try to read criterion output
            const criterionPath = './graphql-rust-server/target/criterion';
            if (fs.existsSync(criterionPath)) {
              comment += `### Benchmark Results\n\n`;
              comment += `Detailed HTML reports are available in the workflow artifacts.\n\n`;
              comment += `**View full results:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/benchmarks/\n\n`;
            }

            comment += `✅ Check the Actions summary for detailed performance metrics.\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
