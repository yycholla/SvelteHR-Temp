name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true
        type: string
      bump:
        description: 'Auto-bump version type'
        required: false
        type: choice
        options:
          - ''
          - patch
          - minor
          - major

jobs:
  create-release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest tag
        id: get-latest-tag
        run: |
          # Get latest tag or default to 0.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "📌 Latest tag: $LATEST_TAG"

      - name: Calculate next version
        id: calc-version
        run: |
          LATEST="${{ steps.get-latest-tag.outputs.latest_tag }}"
          BUMP="${{ github.event.inputs.bump }}"
          MANUAL="${{ github.event.inputs.version }}"

          # If manual version provided, use it
          if [ -n "$MANUAL" ]; then
            NEW_VERSION="$MANUAL"
          elif [ -n "$BUMP" ]; then
            # Parse semver
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"

            case "$BUMP" in
              major)
                NEW_VERSION="$((MAJOR + 1)).0.0"
                ;;
              minor)
                NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
                ;;
              patch)
                NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                ;;
            esac
          else
            echo "❌ Either version or bump must be provided"
            exit 1
          fi

          # Validate semver format
          if ! echo "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid semantic version: $NEW_VERSION"
            exit 1
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✨ New version: $NEW_VERSION"

      - name: Check if tag exists
        id: check-tag
        run: |
          VERSION="${{ steps.calc-version.outputs.new_version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "❌ Tag $VERSION already exists"
            exit 1
          fi
          echo "✅ Tag $VERSION is available"

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.calc-version.outputs.new_version }}"
          LATEST="${{ steps.get-latest-tag.outputs.latest_tag }}"

          echo "## Release $VERSION" > CHANGELOG.tmp
          echo "" >> CHANGELOG.tmp
          echo "### Changes since $LATEST" >> CHANGELOG.tmp
          echo "" >> CHANGELOG.tmp

          # Get commits since last tag
          if [ "$LATEST" != "0.0.0" ]; then
            git log --pretty=format:"- %s (%h)" "$LATEST"..HEAD >> CHANGELOG.tmp
          else
            git log --pretty=format:"- %s (%h)" HEAD >> CHANGELOG.tmp
          fi

          cat CHANGELOG.tmp

          # Escape for GitHub output
          {
            echo 'changelog<<EOF'
            cat CHANGELOG.tmp
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          VERSION="${{ steps.calc-version.outputs.new_version }}"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "✅ Created and pushed tag $VERSION"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.calc-version.outputs.new_version }}';
            const changelog = `${{ steps.changelog.outputs.changelog }}`;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Release ${version}`,
              body: changelog,
              draft: false,
              prerelease: false
            });

            core.info(`✅ Created GitHub Release for ${version}`);

      - name: Summary
        run: |
          VERSION="${{ steps.calc-version.outputs.new_version }}"
          echo "## 🚀 Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Docker images will be built automatically" >> $GITHUB_STEP_SUMMARY
          echo "2. ArgoCD will detect the new version" >> $GITHUB_STEP_SUMMARY
          echo "3. Images will be available at:" >> $GITHUB_STEP_SUMMARY
          echo "   - \`ghcr.io/${{ github.repository }}/backend-server:$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "   - \`ghcr.io/${{ github.repository }}/frontend:$VERSION\`" >> $GITHUB_STEP_SUMMARY
