name: CI (Full Stack)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs when a new workflow with the same group name is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run check

  rust-build:
    name: Build Rust Backend (Artifact)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    defaults:
      run:
        working-directory: graphql-rust-server

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true  # Built-in Swatinem/rust-cache
          cache-workspaces: graphql-rust-server

      - name: Build release binary
        run: cargo build --release

      - name: Verify binary exists
        run: |
          if [ ! -f target/release/hr-graphql-server ]; then
            echo "Error: Binary not found after build!"
            exit 1
          fi
          echo "Binary built successfully"

      - name: Upload binary artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: rust-backend-binary
          path: target/release/hr-graphql-server
          retention-days: 1  # Only need it for this workflow run

  backend-test:
    name: Backend Tests (Rust)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hr_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        working-directory: graphql-rust-server
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_system_test
          RUST_BACKTRACE: 1
        run: |
          cd graphql-rust-server
          cargo test --verbose
      # Note: Cargo test output is captured in GitHub Actions logs.
      # No need to upload 500MB+ debug directory as artifact.

  unit-tests:
    name: Unit Tests (Frontend)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unit
          name: unit-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          retention-days: 1  # Reduced from 7 to save storage

  contract-tests:
    name: Contract Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: [backend-test, rust-build]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hr_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust (for migrations only)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Download backend binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-backend-binary
          path: ./backend-binary

      - name: Start backend server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_system_test
        run: |
          # Make binary executable
          chmod +x ./backend-binary/hr-graphql-server

          # Run migrations (allow warnings)
          cd graphql-rust-server
          cargo run --bin migration up || echo "Migration completed with warnings"
          cd ..

          # Start backend server in background using downloaded binary
          nohup ./backend-binary/hr-graphql-server > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

          # Wait for server to be ready
          echo "Waiting for backend server to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:4000/health; do sleep 2; done' || (echo "Backend failed to start:" && cat /tmp/backend.log && exit 1)
          echo "Backend server is ready!"

      - name: Run contract tests
        env:
          GRAPHQL_ENDPOINT: http://localhost:4000/graphql
        run: npm run test:contract -- --run --reporter=verbose

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) || true
          fi

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-backend-logs
          path: /tmp/backend.log
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-test-results
          path: test-results/
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: [backend-test, rust-build]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hr_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust (for migrations only)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Download backend binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-backend-binary
          path: ./backend-binary

      - name: Start backend server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_system_test
        run: |
          # Make binary executable
          chmod +x ./backend-binary/hr-graphql-server

          # Run migrations (allow warnings)
          cd graphql-rust-server
          cargo run --bin migration up || echo "Migration completed with warnings"
          cd ..

          # Start backend server in background using downloaded binary
          nohup ./backend-binary/hr-graphql-server > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

          # Wait for server to be ready
          echo "Waiting for backend server to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:4000/health; do sleep 2; done' || (echo "Backend failed to start:" && cat /tmp/backend.log && exit 1)
          echo "Backend server is ready!"

      - name: Run integration tests
        env:
          GRAPHQL_ENDPOINT: http://localhost:4000/graphql
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_system_test
        run: npm run test:integration -- --run --reporter=verbose

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) || true
          fi

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-backend-logs
          path: /tmp/backend.log
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 7

  graphql-tests:
    name: GraphQL Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: [backend-test, rust-build]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hr_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust (for migrations only)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Download backend binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-backend-binary
          path: ./backend-binary

      - name: Start backend server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_system_test
        run: |
          # Make binary executable
          chmod +x ./backend-binary/hr-graphql-server

          # Run migrations (allow warnings)
          cd graphql-rust-server
          cargo run --bin migration up || echo "Migration completed with warnings"
          cd ..

          # Start backend server in background using downloaded binary
          nohup ./backend-binary/hr-graphql-server > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

          # Wait for server to be ready
          echo "Waiting for backend server to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:4000/health; do sleep 2; done' || (echo "Backend failed to start:" && cat /tmp/backend.log && exit 1)
          echo "Backend server is ready!"

      - name: Run GraphQL tests
        env:
          GRAPHQL_ENDPOINT: http://localhost:4000/graphql
        run: npm run test:graphql -- --run --reporter=verbose

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) || true
          fi

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graphql-backend-logs
          path: /tmp/backend.log
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graphql-test-results
          path: test-results/
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 25
    needs: [backend-test, unit-tests, rust-build]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hr_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust (for migrations only)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Download backend binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-backend-binary
          path: ./backend-binary

      - name: Start backend server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_system_test
        run: |
          # Make binary executable
          chmod +x ./backend-binary/hr-graphql-server

          # Run migrations (allow warnings)
          cd graphql-rust-server
          cargo run --bin migration up || echo "Migration completed with warnings"
          cd ..

          # Start backend server in background using downloaded binary
          nohup ./backend-binary/hr-graphql-server > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

          # Wait for server to be ready
          echo "Waiting for backend server to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:4000/health; do sleep 2; done' || (echo "Backend failed to start:" && cat /tmp/backend.log && exit 1)
          echo "Backend server is ready!"

      - name: Start frontend dev server
        env:
          PUBLIC_API_URL: http://localhost:4000
          GRAPHQL_ENDPOINT: http://localhost:4000/graphql
        run: |
          nohup npm run dev:local > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

          # Wait for frontend to be ready
          echo "Waiting for frontend server to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:5173; do sleep 2; done' || (echo "Frontend failed to start:" && cat /tmp/frontend.log && exit 1)
          echo "Frontend server is ready!"

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Stop servers
        if: always()
        run: |
          if [ -f /tmp/frontend.pid ]; then
            kill $(cat /tmp/frontend.pid) || true
          fi
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) || true
          fi

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7  # Reduced from 30 to save storage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  build:
    name: Production Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: sveltehr-build
          path: build
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    if: always()
    needs: [lint, backend-test, unit-tests, contract-tests, integration-tests, graphql-tests, e2e-tests, build]
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Critical tests (must pass)
          echo "### Critical Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Tests: ${{ needs.backend-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Integration tests (important but can be flaky)
          echo "### Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Contract Tests: ${{ needs.contract-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- GraphQL Tests: ${{ needs.graphql-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY

          # Check for failures in critical tests
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.backend-test.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Critical tests failed!**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Warn about integration test failures but don't fail the workflow
          if [[ "${{ needs.contract-tests.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests.result }}" != "success" ]] || \
             [[ "${{ needs.graphql-tests.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️  **Some integration tests failed. Please review.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          fi
