name: Nightly Tests (Rust Backend)

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mountain-care-rx/sveltehr/backend-server:latest

jobs:
  comprehensive-tests:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Use pre-built container from GHCR
    container:
      image: ${{ env.IMAGE_NAME }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run all unit tests
        working-directory: ./graphql-rust-server
        run: cargo test --lib --verbose --all-features

      - name: Run all integration tests
        working-directory: ./graphql-rust-server
        run: cargo test --test integration_tests --verbose

      - name: Run load tests (basic only)
        working-directory: ./graphql-rust-server
        run: cargo test --test basic_queries_load -- --ignored --test-threads=1
        timeout-minutes: 10
        continue-on-error: true

      - name: Run benchmarks
        working-directory: ./graphql-rust-server
        run: cargo bench --bench resolver_benchmarks
        timeout-minutes: 15

      - name: Check for dependency updates
        working-directory: ./graphql-rust-server
        run: |
          cargo install cargo-outdated || true
          cargo outdated || true

  security-full-audit:
    name: Full Security Audit
    runs-on: ubuntu-latest

    # Use pre-built container from GHCR
    container:
      image: ${{ env.IMAGE_NAME }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install audit tools
        run: |
          cargo install cargo-audit
          cargo install cargo-deny

      - name: Run cargo audit
        working-directory: ./graphql-rust-server
        run: cargo audit

      - name: Run cargo deny
        working-directory: ./graphql-rust-server
        run: cargo deny check

      - name: Check licenses
        working-directory: ./graphql-rust-server
        run: cargo deny check licenses

  rustdoc-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    # Use pre-built container from GHCR
    container:
      image: ${{ env.IMAGE_NAME }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build documentation
        working-directory: ./graphql-rust-server
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: graphql-rust-server/target/doc/
          retention-days: 7

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [comprehensive-tests, security-full-audit, rustdoc-check]
    if: failure()

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly Test Failure - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Nightly Tests Failed

            The nightly test suite has failed. Please investigate:

            - Check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            - Review failed jobs and error messages
            - Ensure all dependencies are up to date
            - Check for any security vulnerabilities

            **Run ID**: ${context.runId}
            **Triggered by**: ${context.eventName}`;

            // Search for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-failure'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['nightly-failure', 'automated']
              });
            }
