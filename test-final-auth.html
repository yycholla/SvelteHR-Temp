<!DOCTYPE html>
<html>
<head>
    <title>Final Auth Test via Caddy</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 15px; margin: 5px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🔐 MountainHR Authentication Test via Caddy HTTPS Proxy</h1>
    <p><strong>Testing:</strong> Frontend (HTTPS) → Caddy (HTTPS) → Backend (HTTP)</p>
    
    <div class="test-section info">
        <h3>Configuration</h3>
        <p><strong>Frontend:</strong> https://localhost:5173 (or Tailscale)</p>
        <p><strong>Caddy Proxy:</strong> https://100.71.207.7:8443</p>
        <p><strong>Backend:</strong> http://localhost:8080</p>
    </div>

    <button onclick="testDirectBackend()">1. Test Direct Backend (HTTP)</button>
    <button onclick="testCaddyConnection()">2. Test Caddy Proxy (HTTPS)</button>
    <button onclick="testFullAuth()">3. Test Full Auth Flow</button>
    <button onclick="clearResults()">Clear Results</button>

    <div id="results"></div>

    <script>
        async function testDirectBackend() {
            addResult('🔍 Testing direct backend connection...', 'info');
            
            try {
                const response = await fetch('http://localhost:8080/health');
                const data = await response.json();
                
                if (response.ok) {
                    addResult(`✅ Direct Backend: ${data.status} (${data.database})`, 'success');
                } else {
                    addResult(`❌ Direct Backend Failed: ${response.status}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Direct Backend Error: ${error.message}`, 'error');
            }
        }

        async function testCaddyConnection() {
            addResult('🔍 Testing Caddy HTTPS proxy...', 'info');
            
            try {
                const response = await fetch('https://100.71.207.7:8443/health');
                const data = await response.json();
                
                if (response.ok) {
                    addResult(`✅ Caddy Proxy: ${data.status} (${data.database})`, 'success');
                    addResult('🎉 HTTPS Proxy Working! Tailscale compatible!', 'success');
                } else {
                    addResult(`❌ Caddy Proxy Failed: ${response.status}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Caddy Proxy Error: ${error.message}`, 'error');
                addResult('💡 This may be expected if accessing from localhost instead of Tailscale', 'info');
            }
        }

        async function testFullAuth() {
            addResult('🔍 Testing complete authentication flow...', 'info');
            
            try {
                // Test login
                const loginResponse = await fetch('https://100.71.207.7:8443/api/v2/auth/rbac/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                if (loginResponse.ok) {
                    const loginData = await loginResponse.json();
                    addResult(`✅ RBAC Login: Success (Token: ${loginData.token ? 'Received' : 'Missing'})`, 'success');
                    
                    if (loginData.token) {
                        // Test token refresh
                        const refreshResponse = await fetch('https://100.71.207.7:8443/api/v2/auth/rbac/refresh', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${loginData.token}`,
                                'Content-Type': 'application/json'
                            }
                        });
                        
                        if (refreshResponse.ok) {
                            const refreshData = await refreshResponse.json();
                            addResult(`✅ Token Refresh: Success (New Token: ${refreshData.token ? 'Received' : 'Missing'})`, 'success');
                            addResult('🎉 COMPLETE AUTH FLOW WORKING!', 'success');
                        } else {
                            addResult(`❌ Token Refresh Failed: ${refreshResponse.status}`, 'error');
                        }
                    }
                } else {
                    const errorData = await loginResponse.text();
                    addResult(`❌ Login Failed: ${loginResponse.status} - ${errorData}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Auth Flow Error: ${error.message}`, 'error');
            }
        }

        function addResult(message, type) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-section ${type}`;
            div.innerHTML = `<p>${message}</p>`;
            results.appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        // Auto-test on page load
        window.onload = function() {
            addResult('🚀 Authentication Test Suite Loaded', 'info');
            addResult('Click buttons above to test each component', 'info');
        };
    </script>
</body>
</html>
