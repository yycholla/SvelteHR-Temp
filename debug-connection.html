<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Debug API Connection</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 20px;
			}
			.test {
				margin: 10px 0;
				padding: 10px;
				border: 1px solid #ccc;
			}
			.success {
				background-color: #d4edda;
				border-color: #c3e6cb;
			}
			.error {
				background-color: #f8d7da;
				border-color: #f5c6cb;
			}
			.info {
				background-color: #d1ecf1;
				border-color: #bee5eb;
			}
			button {
				padding: 10px 20px;
				margin: 5px;
			}
			pre {
				background: #f8f9fa;
				padding: 10px;
				overflow-x: auto;
			}
		</style>
	</head>
	<body>
		<h1>🔍 Debug API Connection</h1>

		<div class="test info">
			<h3>Current Environment</h3>
			<p><strong>Page URL:</strong> <span id="pageUrl"></span></p>
			<p><strong>User Agent:</strong> <span id="userAgent"></span></p>
			<p><strong>Frontend Origin:</strong> <span id="origin"></span></p>
		</div>

		<div class="test">
			<h3>1. Test Backend Health (Direct)</h3>
			<button onclick="testHealth()">Test Health Endpoint</button>
			<div id="healthResult"></div>
		</div>

		<div class="test">
			<h3>2. Test CORS Preflight</h3>
			<button onclick="testCORS()">Test CORS</button>
			<div id="corsResult"></div>
		</div>

		<div class="test">
			<h3>3. Test Login Endpoint</h3>
			<button onclick="testLogin()">Test Login</button>
			<div id="loginResult"></div>
		</div>

		<div class="test">
			<h3>4. Test All API URLs</h3>
			<button onclick="testAllUrls()">Test Multiple URLs</button>
			<div id="urlResult"></div>
		</div>

		<script>
			// Set environment info
			document.getElementById('pageUrl').textContent = window.location.href;
			document.getElementById('userAgent').textContent = navigator.userAgent;
			document.getElementById('origin').textContent = window.location.origin;

			// API URLs to test
			const apiUrls = [
				'http://localhost:8080/api/v2',
				'http://100.71.207.7:8080/api/v2',
				'http://mcp-0085.dropbear-elnath.ts.net:8080/api/v2'
			];

			async function testHealth() {
				const result = document.getElementById('healthResult');
				result.innerHTML = '<p>Testing...</p>';

				for (const baseUrl of apiUrls) {
					try {
						const response = await fetch(`${baseUrl.replace('/api/v2', '')}/health`);
						const data = await response.json();

						result.innerHTML += `
                        <div class="success">
                            <strong>${baseUrl}:</strong> ✅ ${data.status}
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
					} catch (error) {
						result.innerHTML += `
                        <div class="error">
                            <strong>${baseUrl}:</strong> ❌ ${error.message}
                        </div>
                    `;
					}
				}
			}

			async function testCORS() {
				const result = document.getElementById('corsResult');
				result.innerHTML = '<p>Testing CORS...</p>';

				for (const baseUrl of apiUrls) {
					try {
						const response = await fetch(`${baseUrl}/auth/rbac/login`, {
							method: 'OPTIONS',
							headers: {
								Origin: window.location.origin,
								'Access-Control-Request-Method': 'POST',
								'Access-Control-Request-Headers': 'Content-Type'
							}
						});

						const allowOrigin = response.headers.get('Access-Control-Allow-Origin');
						const allowMethods = response.headers.get('Access-Control-Allow-Methods');

						result.innerHTML += `
                        <div class="success">
                            <strong>${baseUrl}:</strong> ✅ Status: ${response.status}<br>
                            Allow-Origin: ${allowOrigin}<br>
                            Allow-Methods: ${allowMethods}
                        </div>
                    `;
					} catch (error) {
						result.innerHTML += `
                        <div class="error">
                            <strong>${baseUrl}:</strong> ❌ ${error.message}
                        </div>
                    `;
					}
				}
			}

			async function testLogin() {
				const result = document.getElementById('loginResult');
				result.innerHTML = '<p>Testing login...</p>';

				for (const baseUrl of apiUrls) {
					try {
						const response = await fetch(`${baseUrl}/auth/rbac/login`, {
							method: 'POST',
							headers: {
								'Content-Type': 'application/json',
								Origin: window.location.origin
							},
							body: JSON.stringify({
								username: 'admin',
								password: 'admin123'
							})
						});

						const data = await response.json();

						if (response.ok) {
							result.innerHTML += `
                            <div class="success">
                                <strong>${baseUrl}:</strong> ✅ Login successful!
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </div>
                        `;
						} else {
							result.innerHTML += `
                            <div class="error">
                                <strong>${baseUrl}:</strong> ❌ Status: ${response.status}
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </div>
                        `;
						}
					} catch (error) {
						result.innerHTML += `
                        <div class="error">
                            <strong>${baseUrl}:</strong> ❌ ${error.message}
                        </div>
                    `;
					}
				}
			}

			async function testAllUrls() {
				const result = document.getElementById('urlResult');
				result.innerHTML = '<p>Testing all endpoints...</p>';

				await testHealth();
				await testCORS();
				await testLogin();

				result.innerHTML = '<p>✅ All tests completed! Check results above.</p>';
			}
		</script>
	</body>
</html>
