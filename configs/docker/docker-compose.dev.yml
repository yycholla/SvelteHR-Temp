# SvelteHR Monorepo - Development Services
version: '3.8'

services:
  # GelDB - Primary database with GraphQL, Auth extension, and Admin UI
  geldb:
    image: geldata/gel
    environment:
      # Development mode with automatic schema application
      - GEL_SERVER_SECURITY=insecure_dev_mode
      - GEL_DOCKER_APPLY_MIGRATIONS=always
      - GEL_SERVER_ADMIN_UI=enabled  
      - GEL_SERVER_AUTH_UI=enabled
      - GEL_AUTH_UI_ENABLED=true
      - GEL_EXT_AUTH_UI_ENABLED=true
      - GEL_SERVER_AI_UI=enabled
      - GEL_SERVER_HTTP_ENDPOINT_SECURITY=optional
      # Admin credentials for development
      - GEL_SERVER_USER=admin
      - GEL_SERVER_PASSWORD=admin
      # Development optimizations
      - GEL_SERVER_COMPILER_POOL_SIZE=1
      - GEL_SERVER_ECHO_RUNTIME_INFO=true
    ports:
      - "5656:5656"  # Admin UI at :5656/ui, GraphQL at :5656/db/main/ext/graphql
    volumes:
      - gel_data:/var/lib/gel/data
      - ../../apps/database/dbschema:/dbschema
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5656/ui >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Optional: Redis for caching and session storage
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  gel_data:
  redis_data:

networks:
  default:
    name: svelteHR-dev