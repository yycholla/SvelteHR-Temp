# SvelteHR Development - Database Services
# Docker Compose configuration for development database services
# with CORS enabled for frontend development

version: '3.8'

services:
  # GelDB - Graph Database with CORS enabled for development
  geldb:
    image: geldata/gel:nightly
    container_name: svelteHR-geldb
    restart: unless-stopped
    ports:
      - "5657:5656"
    environment:
      # Enable CORS for development
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5175
      - CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - CORS_ALLOWED_HEADERS=Content-Type,Authorization,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
      # GelDB configuration - Trust mode for development with Auth extension
      - GEL_SERVER_SECURITY=insecure_dev_mode
      - GEL_SERVER_DEFAULT_AUTH_METHOD=Trust
      - GEL_SERVER_ADMIN_UI=enabled
      - GEL_DATABASE=main
      - GEL_USER=gel
      # Temporarily disable Auth extension to test GraphQL in isolation
      # - GEL_AUTH_ENABLED=true
      # - GEL_AUTH_UI_ENABLED=true
      # - GEL_AUTH_APP_NAME=MountainHR
      # - GEL_AUTH_SECRET_KEY=dev-secret-key-6e0dda4f623fabf1db71f3c3b8045f66
    volumes:
      - gel_data:/var/lib/gel
      - ../../dbschema:/app/dbschema:ro
    networks:
      - svelteHR-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5656/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis - Caching and Session Storage
  redis:
    image: redis:7-alpine
    container_name: svelteHR-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - svelteHR-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  gel_data:
    driver: local
  redis_data:
    driver: local

networks:
  svelteHR-network:
    driver: bridge
    name: svelteHR-network