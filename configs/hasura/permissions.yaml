# System Administrator Role (Full System Access)
admin_permissions:
  # Inherits all hr_admin permissions plus:
  auth_sessions:
    select:
      columns: "*"
    update:
      columns: [is_active]
      filter: {}
    delete:
      filter: {}

  user_roles:
    select:
      columns: "*"
    insert:
      columns: "*"
      check: {}
    update:
      columns: "*"
      filter: {}
    delete:
      filter: {}

  audit_log:
    select:
      columns: "*"

# Finance Role Permissions (Limited to Compensation)
finance_permissions:
  users:
    select:
      columns: [id, email, display_name, job_title, is_active]

  compensation:
    select:
      columns: "*"
    update:
      columns: [pay_rate, pay_type, currency, bonus_eligible, overtime_eligible, bank_account_number, bank_routing_number, bank_name, direct_deposit_enabled]
      filter: {}

  job_information:
    select:
      columns: [id, employee_id, job_title, hire_date, employment_type, department_id]

# Anonymous Role (Public Access - Very Limited)
anonymous_permissions:
  # No table access for anonymous users in HR system
  # All operations must go through authentication

# Role Hierarchy and Inheritance
role_hierarchy:
  - role: anonymous
    level: 0
    inherits: []
    
  - role: user  
    level: 10
    inherits: [anonymous]
    
  - role: hr_manager
    level: 50
    inherits: [user]
    
  - role: finance
    level: 60
    inherits: [user]
    
  - role: hr_admin
    level: 80
    inherits: [hr_manager, finance]
    
  - role: admin
    level: 100
    inherits: [hr_admin]

# Security Notes:
# 1. All permissions work with Row-Level Security policies
# 2. JWT tokens must include proper role claims
# 3. Sensitive fields are excluded from lower privilege roles
# 4. Audit trails are admin-only for security
# 5. Anonymous role has no data access for security