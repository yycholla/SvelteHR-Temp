      columns: [email, password_hash, display_name, job_title, onboarding_status, is_active]
      check: {}
    update:
      columns: "*"
      filter: {}
    delete:
      filter: {}

  job_information:
    select:
      columns: "*"
    insert:
      columns: "*"
      check: {}
    update:
      columns: "*"
      filter: {}
    delete:
      filter: {}

  compensation:
    select:
      columns: "*"
    insert:
      columns: "*"
      check: {}
    update:
      columns: "*"
      filter: {}
    delete:
      filter: {}

  contact_information:
    select:
      columns: "*"
    insert:
      columns: "*"
      check: {}
    update:
      columns: "*"
      filter: {}
    delete:
      filter: {}

  personal_information:
    select:
      columns: "*"
    insert:
      columns: "*"
      check: {}
    update:
      columns: "*"
      filter: {}
    delete:
      filter: {}

  departments:
    select:
      columns: "*"
    insert:
      columns: "*"
      check: {}
    update:
