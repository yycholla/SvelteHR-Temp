# PostgreSQL Configuration for Hasura HR System
# Optimized for sub-200ms response times with 1000+ concurrent users

# Connection Settings
max_connections = 400                    # 4 × CPU cores recommended
shared_buffers = 2GB                     # 25% of system RAM
effective_cache_size = 6GB               # 75% of system RAM
work_mem = 8MB                           # Conservative for high concurrency
maintenance_work_mem = 256MB

# Query Planning
random_page_cost = 1.1                   # SSD storage
effective_io_concurrency = 200           # SSD concurrent I/O
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# Write Performance
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 256MB

# Query Performance & Monitoring
shared_preload_libraries = 'pg_stat_statements'
track_activities = on
track_counts = on
track_functions = all
track_io_timing = on
log_min_duration_statement = 200         # Log queries over 200ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Statistics Collection
pg_stat_statements.max = 1000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.save = on

# Memory Configuration
temp_buffers = 32MB
max_prepared_transactions = 100

# Background Writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# Autovacuum
autovacuum = on
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_scale_factor = 0.1
autovacuum_work_mem = 256MB

# Replication (for future scaling)
wal_level = replica
max_wal_senders = 3
wal_keep_segments = 8

# Error Reporting
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'mod'                    # Log all data-modifying statements