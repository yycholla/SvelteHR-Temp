version: 3
sources:
- name: default
  kind: postgres
  tables:
  - "!include databases/default/tables/public_users.yaml"
  - "!include databases/default/tables/public_departments.yaml"
  - "!include databases/default/tables/public_user_roles.yaml"
  - "!include databases/default/tables/public_user_role_assignments.yaml"
  - "!include databases/default/tables/public_job_information.yaml"
  - "!include databases/default/tables/public_compensation.yaml"
  - "!include databases/default/tables/public_contact_information.yaml"
  - "!include databases/default/tables/public_personal_information.yaml"
  - "!include databases/default/tables/public_auth_sessions.yaml"
  - "!include databases/default/tables/public_audit_log.yaml"
  - "!include databases/default/tables/public_notifications.yaml"
  configuration:
    connection_info:
      use_prepared_statements: true
      database_url:
        from_env: HASURA_GRAPHQL_DATABASE_URL
      isolation_level: read-committed
      pool_settings:
        connection_lifetime: 600
        retries: 1
        idle_timeout: 180
        max_connections: 50
actions: []
custom_types:
  enums: []
  input_objects: []
  objects: []
  scalars: []
allowlist: []
query_collections: []
remote_schemas: []
inherited_roles: []
api_limits: {}
metrics_config: {}
graphql_schema_introspection:
  disabled_for_roles: []
network:
  tls_allowlist: []
backend_configs:
  dataconnector:
    athena:
      uri: "http://data-connector-agent:8081/api/v1/athena"
    mariadb:
      uri: "http://data-connector-agent:8081/api/v1/mariadb"
    mysql8:
      uri: "http://data-connector-agent:8081/api/v1/mysql"
    oracle:
      uri: "http://data-connector-agent:8081/api/v1/oracle"
    snowflake:
      uri: "http://data-connector-agent:8081/api/v1/snowflake"