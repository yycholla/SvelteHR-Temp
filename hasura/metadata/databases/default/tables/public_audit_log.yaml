table:
  name: audit_log
  schema: public
configuration:
  custom_root_fields:
    select: audit_logs
    select_by_pk: audit_log_entry
    select_aggregate: audit_logs_aggregate
  custom_column_names: {}
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships: []
select_permissions:
  - role: admin
    permission:
      columns:
        - id
        - user_id
        - action
        - table_name
        - record_id
        - old_values
        - new_values
        - timestamp
        - ip_address
        - user_agent
        - session_id
      filter: {}
      allow_aggregations: true
    comment: Only admins can view audit logs for security and compliance
insert_permissions:
  - role: admin
    permission:
      columns:
        - user_id
        - action
        - table_name
        - record_id
        - old_values
        - new_values
        - ip_address
        - user_agent
        - session_id
      check: {}
    comment: System/admin can create audit log entries
update_permissions: []
delete_permissions:
  - role: admin
    permission:
      filter:
        timestamp: {_lt: "now() - interval '7 years'"}  # Comply with data retention policies
    comment: Admins can delete old audit logs per retention policy