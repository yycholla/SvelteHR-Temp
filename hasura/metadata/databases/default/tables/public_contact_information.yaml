table:
  name: contact_information
  schema: public
configuration:
  custom_root_fields:
    select: contact_information
    select_by_pk: contact_info
    select_aggregate: contact_information_aggregate
  custom_column_names: {}
object_relationships:
  - name: employee
    using:
      foreign_key_constraint_on: employee_id
array_relationships: []
select_permissions:
  - role: employee
    permission:
      columns:
        - id
        - employee_id
        - personal_email
        - personal_phone
        - address_line1
        - address_line2
        - city
        - state_province
        - postal_code
        - country
      filter:
        employee_id: {_eq: "X-Hasura-User-Id"}
      allow_aggregations: false
    comment: Employees can see their own contact information
  - role: manager
    permission:
      columns:
        - id
        - employee_id
        - personal_phone
        - emergency_contact_name
        - emergency_contact_phone
        - emergency_contact_relationship
      filter:
        _or:
          - employee_id: {_eq: "X-Hasura-User-Id"}
          - employee:
              job_information:
                department:
                  manager_id: {_eq: "X-Hasura-User-Id"}
      allow_aggregations: false
    comment: Managers can see limited contact info for their team (emergency contacts)
  - role: hr_admin
    permission:
      columns:
        - id
        - employee_id
        - personal_email
        - personal_phone
        - address_line1
        - address_line2
        - city
        - state_province
        - postal_code
        - country
        - emergency_contact_name
        - emergency_contact_phone
        - emergency_contact_relationship
        - emergency_contact_email
        - notes
      filter: {}
      allow_aggregations: true
    comment: HR admins have full access to contact information
  - role: admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
    comment: Full access for administrators
insert_permissions:
  - role: employee
    permission:
      columns:
        - personal_email
        - personal_phone
        - address_line1
        - address_line2
        - city
        - state_province
        - postal_code
        - country
        - emergency_contact_name
        - emergency_contact_phone
        - emergency_contact_relationship
        - emergency_contact_email
      check:
        employee_id: {_eq: "X-Hasura-User-Id"}
    comment: Employees can create their own contact information
  - role: hr_admin
    permission:
      columns:
        - employee_id
        - personal_email
        - personal_phone
        - address_line1
        - address_line2
        - city
        - state_province
        - postal_code
        - country
        - emergency_contact_name
        - emergency_contact_phone
        - emergency_contact_relationship
        - emergency_contact_email
        - notes
      check: {}
    comment: HR admins can create contact information for any employee
  - role: admin
    permission:
      columns:
        - employee_id
        - personal_email
        - personal_phone
        - address_line1
        - address_line2
        - city
        - state_province
        - postal_code
        - country
        - emergency_contact_name
        - emergency_contact_phone
        - emergency_contact_relationship
        - emergency_contact_email
        - notes
      check: {}
    comment: Admins can create any contact information record
update_permissions:
  - role: employee
    permission:
      columns:
        - personal_email
        - personal_phone
        - address_line1
        - address_line2
        - city
        - state_province
        - postal_code
        - country
        - emergency_contact_name
        - emergency_contact_phone
        - emergency_contact_relationship
        - emergency_contact_email
      filter:
        employee_id: {_eq: "X-Hasura-User-Id"}
      check:
        employee_id: {_eq: "X-Hasura-User-Id"}
    comment: Employees can update their own contact information
  - role: hr_admin
    permission:
      columns:
        - personal_email
        - personal_phone
        - address_line1
        - address_line2
        - city
        - state_province
        - postal_code
        - country
        - emergency_contact_name
        - emergency_contact_phone
        - emergency_contact_relationship
        - emergency_contact_email
        - notes
      filter: {}
      check: {}
    comment: HR admins can update any contact information
  - role: admin
    permission:
      columns:
        - employee_id
        - personal_email
        - personal_phone
        - address_line1
        - address_line2
        - city
        - state_province
        - postal_code
        - country
        - emergency_contact_name
        - emergency_contact_phone
        - emergency_contact_relationship
        - emergency_contact_email
        - notes
      filter: {}
      check: {}
    comment: Admins have full update access
delete_permissions:
  - role: admin
    permission:
      filter: {}
    comment: Only admins can delete contact information records