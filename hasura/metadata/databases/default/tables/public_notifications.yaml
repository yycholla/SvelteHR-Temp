table:
  name: notifications
  schema: public
configuration:
  custom_root_fields:
    select: notifications
    select_by_pk: notification
    select_aggregate: notifications_aggregate
  custom_column_names: {}
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships: []
select_permissions:
  - role: employee
    permission:
      columns:
        - id
        - user_id
        - title
        - message
        - type
        - priority
        - is_read
        - read_at
        - created_at
        - expires_at
      filter:
        user_id: {_eq: "X-Hasura-User-Id"}
      allow_aggregations: true
    comment: Users can see their own notifications
  - role: manager
    permission:
      columns:
        - id
        - user_id
        - title
        - message
        - type
        - priority
        - is_read
        - read_at
        - created_at
        - expires_at
      filter:
        user_id: {_eq: "X-Hasura-User-Id"}
      allow_aggregations: true
    comment: Managers can see their own notifications
  - role: hr_admin
    permission:
      columns:
        - id
        - user_id
        - title
        - message
        - type
        - priority
        - is_read
        - read_at
        - created_at
        - expires_at
      filter:
        user_id: {_eq: "X-Hasura-User-Id"}
      allow_aggregations: true
    comment: HR admins can see their own notifications
  - role: admin
    permission:
      columns:
        - id
        - user_id
        - title
        - message
        - type
        - priority
        - is_read
        - read_at
        - created_at
        - expires_at
        - created_by
        - metadata
      filter: {}
      allow_aggregations: true
    comment: Admins can see all notifications for system monitoring
insert_permissions:
  - role: hr_admin
    permission:
      columns:
        - user_id
        - title
        - message
        - type
        - priority
        - expires_at
        - metadata
      check: {}
    comment: HR admins can send notifications to users
  - role: admin
    permission:
      columns:
        - user_id
        - title
        - message
        - type
        - priority
        - expires_at
        - created_by
        - metadata
      check: {}
    comment: Admins can send any notification
update_permissions:
  - role: employee
    permission:
      columns:
        - is_read
        - read_at
      filter:
        _and:
          - user_id: {_eq: "X-Hasura-User-Id"}
          - is_read: {_eq: false}
      check:
        _and:
          - user_id: {_eq: "X-Hasura-User-Id"}
          - is_read: {_eq: true}
    comment: Users can mark their own notifications as read
  - role: admin
    permission:
      columns:
        - title
        - message
        - type
        - priority
        - is_read
        - read_at
        - expires_at
        - metadata
      filter: {}
      check: {}
    comment: Admins can update any notification
delete_permissions:
  - role: employee
    permission:
      filter:
        user_id: {_eq: "X-Hasura-User-Id"}
    comment: Users can delete their own notifications
  - role: admin
    permission:
      filter: {}
    comment: Admins can delete any notification