table:
  name: job_information
  schema: public
configuration:
  custom_root_fields:
    select: job_information
    select_by_pk: job_info
    select_aggregate: job_information_aggregate
  custom_column_names: {}
object_relationships:
  - name: employee
    using:
      foreign_key_constraint_on: employee_id
  - name: department
    using:
      foreign_key_constraint_on: department_id
  - name: reports_to_user
    using:
      foreign_key_constraint_on: reports_to
array_relationships: []
select_permissions:
  - role: employee
    permission:
      columns:
        - id
        - employee_id
        - job_title
        - department_id
        - employment_type
        - start_date
        - work_location
        - work_schedule
      filter:
        employee_id: {_eq: "X-Hasura-User-Id"}
      allow_aggregations: false
    comment: Employees can see their own job information
  - role: manager
    permission:
      columns:
        - id
        - employee_id
        - job_title
        - department_id
        - employment_type
        - start_date
        - end_date
        - reports_to
        - work_location
        - work_schedule
        - job_level
      filter:
        _or:
          - employee_id: {_eq: "X-Hasura-User-Id"}
          - department:
              manager_id: {_eq: "X-Hasura-User-Id"}
      allow_aggregations: true
    comment: Managers can see job info for themselves and their department employees
  - role: hr_admin
    permission:
      columns:
        - id
        - employee_id
        - job_title
        - department_id
        - employment_type
        - start_date
        - end_date
        - reports_to
        - work_location
        - work_schedule
        - job_level
        - is_manager
        - probation_end_date
        - notes
      filter: {}
      allow_aggregations: true
    comment: HR admins can see all job information
  - role: admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
    comment: Full access for administrators
insert_permissions:
  - role: hr_admin
    permission:
      columns:
        - employee_id
        - job_title
        - department_id
        - employment_type
        - start_date
        - reports_to
        - work_location
        - work_schedule
        - job_level
        - is_manager
        - probation_end_date
        - notes
      check: {}
    comment: HR admins can create job information records
  - role: admin
    permission:
      columns:
        - employee_id
        - job_title
        - department_id
        - employment_type
        - start_date
        - end_date
        - reports_to
        - work_location
        - work_schedule
        - job_level
        - is_manager
        - probation_end_date
        - notes
      check: {}
    comment: Admins can create any job information record
update_permissions:
  - role: manager
    permission:
      columns:
        - reports_to
        - work_schedule
        - notes
      filter:
        department:
          manager_id: {_eq: "X-Hasura-User-Id"}
      check:
        department:
          manager_id: {_eq: "X-Hasura-User-Id"}
    comment: Managers can update limited job info for their department employees
  - role: hr_admin
    permission:
      columns:
        - job_title
        - department_id
        - employment_type
        - start_date
        - end_date
        - reports_to
        - work_location
        - work_schedule
        - job_level
        - is_manager
        - probation_end_date
        - notes
      filter: {}
      check: {}
    comment: HR admins can update all job information
  - role: admin
    permission:
      columns:
        - employee_id
        - job_title
        - department_id
        - employment_type
        - start_date
        - end_date
        - reports_to
        - work_location
        - work_schedule
        - job_level
        - is_manager
        - probation_end_date
        - notes
      filter: {}
      check: {}
    comment: Admins have full update access
delete_permissions:
  - role: admin
    permission:
      filter: {}
    comment: Only admins can delete job information records