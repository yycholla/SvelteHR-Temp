        - salary_amount
        - salary_currency
        - pay_frequency
        - effective_date
        - bonus_eligible
        - bonus_target_percent
        - benefits_eligible
        - overtime_eligible
        - commission_eligible
        - commission_rate
      check: {}
    comment: Finance can create compensation records for payroll setup
  - role: admin
    permission:
      columns:
        - employee_id
        - salary_amount
        - salary_currency
        - pay_frequency
        - effective_date
        - end_date
        - bonus_eligible
        - bonus_target_percent
        - equity_eligible
        - equity_shares
        - benefits_eligible
        - overtime_eligible
        - commission_eligible
        - commission_rate
        - review_date
        - notes
      check: {}
    comment: Admins can create any compensation record
