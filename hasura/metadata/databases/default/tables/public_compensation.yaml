table:
  name: compensation
  schema: public
configuration:
  custom_root_fields:
    select: compensation
    select_by_pk: compensation_record
    select_aggregate: compensation_aggregate
  custom_column_names: {}
object_relationships:
  - name: employee
    using:
      foreign_key_constraint_on: employee_id
array_relationships: []
select_permissions:
  - role: employee
    permission:
      columns:
        - id
        - employee_id
        - salary_amount
        - salary_currency
        - pay_frequency
        - effective_date
      filter:
        employee_id: {_eq: "X-Hasura-User-Id"}
      allow_aggregations: false
    comment: Employees can see their own compensation information
  - role: manager
    permission:
      columns:
        - id
        - employee_id
        - salary_amount
        - salary_currency
        - pay_frequency
        - effective_date
        - bonus_eligible
        - equity_eligible
      filter:
        _or:
          - employee_id: {_eq: "X-Hasura-User-Id"}
          - employee:
              job_information:
                department:
                  manager_id: {_eq: "X-Hasura-User-Id"}
      allow_aggregations: true
    comment: Managers can see compensation for themselves and direct reports (limited fields)
  - role: hr_admin
    permission:
      columns:
        - id
        - employee_id
        - salary_amount
        - salary_currency
        - pay_frequency
        - effective_date
        - end_date
        - bonus_eligible
        - bonus_target_percent
        - equity_eligible
        - equity_shares
        - benefits_eligible
        - overtime_eligible
        - commission_eligible
        - commission_rate
        - review_date
        - notes
      filter: {}
      allow_aggregations: true
    comment: HR admins have full access to compensation data
  - role: finance
    permission:
      columns:
        - id
        - employee_id
        - salary_amount
        - salary_currency
        - pay_frequency
        - effective_date
        - end_date
        - bonus_eligible
        - bonus_target_percent
        - equity_eligible
        - equity_shares
        - benefits_eligible
        - overtime_eligible
        - commission_eligible
        - commission_rate
        - review_date
      filter: {}
      allow_aggregations: true
    comment: Finance team has access to compensation data for payroll and budgeting
  - role: admin
    permission:
      columns: "*"
      filter: {}
      allow_aggregations: true
    comment: Full access for administrators
insert_permissions:
  - role: hr_admin
    permission:
      columns:
        - employee_id
        - salary_amount
        - salary_currency
        - pay_frequency
        - effective_date
        - bonus_eligible
        - bonus_target_percent
        - equity_eligible
        - equity_shares
        - benefits_eligible
        - overtime_eligible
        - commission_eligible
        - commission_rate
        - review_date
        - notes
      check: {}
    comment: HR admins can create compensation records
  - role: finance
    permission:
      columns:
