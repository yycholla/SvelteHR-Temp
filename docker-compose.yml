# =============================================================================
# SvelteHR Production Docker Compose Configuration
# =============================================================================
# This file orchestrates the production deployment of the SvelteHR application
# with PostgreSQL, Redis, Rust GraphQL backend, SvelteKit frontend, and Caddy.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - .env file with all required variables (see .env.example)
#   - Docker Compose v2.20+
#   - Domain DNS configured (for Let's Encrypt mode)
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database Service
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: sveltehr-postgres-prod
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8'

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/backups:/var/backups/postgresql

    networks:
      - sveltehr-network

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Resource limits (commented - monitor first, then uncomment and adjust)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1G
    #       cpus: '0.5'
    #     reservations:
    #       memory: 512M
    #       cpus: '0.25'

  # ===========================================================================
  # Redis Cache Service
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: sveltehr-redis-prod
    restart: unless-stopped

    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    networks:
      - sveltehr-network

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

    # Resource limits (commented - monitor first, then uncomment and adjust)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256M
    #       cpus: '0.25'
    #     reservations:
    #       memory: 128M
    #       cpus: '0.1'

  # ===========================================================================
  # Rust GraphQL Backend Service
  # ===========================================================================
  hr-graphql-rust:
    image: ${GITLAB_REGISTRY:-registry.gitlab.com}/${GITLAB_PROJECT}/backend:${IMAGE_TAG:-latest}
    container_name: sveltehr-graphql-rust-prod
    restart: unless-stopped
    user: rust

    build:
      context: ./graphql-rust-server
      dockerfile: Dockerfile.prod
      target: production

    environment:
      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Redis Configuration
      REDIS_URL: redis://redis:6379

      # Authentication Secrets
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-${JWT_SECRET}}
      SERVICE_AUTH_KEY: ${SERVICE_AUTH_KEY}

      # Server Configuration
      HOST: 0.0.0.0
      PORT: 4000

      # CORS Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${DOMAIN}}

      # Logging Configuration
      RUST_LOG: ${RUST_LOG:-info,hr_graphql_server=debug}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-0}

      # Environment
      ENVIRONMENT: production

      # Admin User Seeding (set to 'true' for first deployment only)
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-false}

    networks:
      - sveltehr-network

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Resource limits (commented - monitor first, then uncomment and adjust)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #       cpus: '0.5'
    #     reservations:
    #       memory: 256M
    #       cpus: '0.25'

  # ===========================================================================
  # SvelteKit Frontend Service
  # ===========================================================================
  frontend:
    image: ${GITLAB_REGISTRY:-registry.gitlab.com}/${GITLAB_PROJECT}/frontend:${IMAGE_TAG:-latest}
    container_name: sveltehr-frontend-prod
    restart: unless-stopped
    user: svelte

    build:
      context: .
      dockerfile: Dockerfile
      target: production

    environment:
      # Node Environment
      NODE_ENV: production

      # API Configuration
      PUBLIC_API_URL: http://hr-graphql-rust:4000

      # Server Configuration
      HOST: 0.0.0.0
      PORT: 3000

      # Database Configuration (for direct queries)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # Service Authentication
      SERVICE_AUTH_KEY: ${SERVICE_AUTH_KEY}

      # Logging Configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-console}

    networks:
      - sveltehr-network

    depends_on:
      postgres:
        condition: service_healthy
      hr-graphql-rust:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Resource limits (commented - monitor first, then uncomment and adjust)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256M
    #       cpus: '0.25'
    #     reservations:
    #       memory: 128M
    #       cpus: '0.1'

  # ===========================================================================
  # Caddy Reverse Proxy Service
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: sveltehr-caddy-prod
    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS_EMAIL: ${TLS_EMAIL:-}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    ports:
      - '80:80'
      - '443:443'
      - '2019:2019' # Admin API (optional, for debugging)

    networks:
      - sveltehr-network

    depends_on:
      frontend:
        condition: service_healthy
      hr-graphql-rust:
        condition: service_healthy

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://localhost:2019/config/ || exit 1'
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Resource limits (commented - monitor first, then uncomment and adjust)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 128M
    #       cpus: '0.1'
    #     reservations:
    #       memory: 64M
    #       cpus: '0.05'

# =============================================================================
# Named Volumes (Persistent Data Storage)
# =============================================================================
volumes:
  postgres_data:
    driver: local
    name: sveltehr_postgres_prod_data

  redis_data:
    driver: local
    name: sveltehr_redis_prod_data

  caddy_data:
    driver: local
    name: sveltehr_caddy_prod_data

  caddy_config:
    driver: local
    name: sveltehr_caddy_prod_config

# =============================================================================
# Network Configuration (Bridge Network with Service Discovery)
# =============================================================================
networks:
  sveltehr-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
