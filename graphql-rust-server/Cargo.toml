[package]
name = "hr-graphql-server"
edition = "2021"
version = "0.0.1"

[dependencies]
anyhow = "1.0"
async-graphql-axum = "7.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
axum-login = "0.18"
base64 = "0.22"
bcrypt = "0.15"
bytes = "1.0"
csv = "1.3"
password-hash = "0.5"
dotenv = "0.15"
envy = "0.4"
futures = "0.3"
url = "2.5"
http-body-util = "0.1"
jsonwebtoken = "9.0"
regex = "1.0"
rust_decimal = "1.35"
serde_json = "1.0"
sqlx = { version = "0.7", features = [
  "postgres",
  "runtime-tokio-rustls",
  "macros",
  "uuid",
  "chrono",
  "json",
] }
thiserror = "1.0"
tower-sessions = "0.14"
time = "0.3"
tracing = "0.1"

# Intuit QuickBooks Integration
oauth2 = "4.4"
reqwest-middleware = "0.2"
reqwest-retry = "0.3"
percent-encoding = "2.3.2"

# Webhook signature verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Email sending
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "tokio1-rustls-tls",
  "smtp-transport",
] }
handlebars = "6.2"
croner = "3.0.1"
urlencoding = "2.1.3"

# Swagger gen
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "reqwest"] }
[dependencies.async-graphql]
version = "7.0"
features = ["chrono", "uuid", "dataloader", "boxed-trait"]

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.chrono-tz]
version = "0.10"
features = ["serde"]

[dependencies.tokio-cron-scheduler]
version = "0.14"

[dependencies.sea-orm]
version = "0.12"
features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-uuid",
  "with-chrono",
  "postgres-array",
]

[dependencies.sea-orm-migration]
version = "0.12"
features = ["runtime-tokio-rustls", "sqlx-postgres"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.sentry]
version = "0.45"
features = ["tracing", "tower", "tower-http"]
default-features = false

[dependencies.sentry-tower]
version = "0.45"

[dependencies.sentry-tracing]
version = "0.45"

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.tower]
version = "=0.4.13"
features = ["util"]

[dependencies.tower-http]
version = "0.5"
features = ["cors", "trace", "fs"]

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter", "json"]

[dependencies.tracing-loki]
version = "0.2"
optional = true

[dependencies.uuid]
version = "1.0"
features = ["serde", "v4"]

[dependencies.fake]
version = "2.9"
features = ["derive", "chrono", "uuid"]

[dependencies.testcontainers]
version = "0.25"
optional = true

[dependencies.testcontainers-modules]
version = "0.13"
features = ["postgres"]
optional = true

[dependencies.reqwest]
version = "0.12"
features = ["json", "rustls-tls"]

[dependencies.quickbooks-types]
version = "0.1"

[dependencies.hdrhistogram]
version = "7.5"
optional = true

[dependencies.rand]
version = "0.8"
optional = true


[features]
# Feature for enabling test utilities in integration tests
test-utils = [
  "dep:testcontainers",
  "dep:testcontainers-modules",
  "dep:hdrhistogram",
  "dep:rand",
]

# Loki logging integration
loki = ["dep:tracing-loki"]

# Default features - includes test-utils for development
# Production builds can use --no-default-features to exclude testing dependencies
default = ["test-utils"]


[build-dependencies]
sea-orm-codegen = "1.1.17"

[[bench]]
name = "resolver_benchmarks"
path = "benches/resolver_benchmarks.rs"
harness = false

[lib]
path = "src/lib.rs"
name = "hr_graphql_server"
crate-type = ["lib"]
