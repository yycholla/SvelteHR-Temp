[package]
name = "hr-graphql-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# GraphQL framework
async-graphql = { version = "7.0", features = [
  "chrono",
  "uuid",
  "dataloader",
  "boxed-trait",
] }
async-graphql-axum = "7.0"
dataloader = "0.17"

# Web framework
axum = "0.8" # Updated to 0.8 for async-graphql-axum compatibility
tokio = { version = "1", features = ["full"] }
tower = { version = "=0.4.13", features = [
  "util",
] } # Pin to avoid 0.5 conflicts
tower-http = { version = "0.5", features = ["cors", "trace"] }
http-body-util = "0.1"

# Database
sqlx = { version = "0.7", features = [
  "runtime-tokio-rustls",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
  "rust_decimal",
] }
rust_decimal = "1.35"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
jsonwebtoken = "9.0"
bcrypt = "0.15"
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
sea-orm = { version = "0.12", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenv = "0.15"
envy = "0.4"

[build-dependencies]
sea-orm-codegen = "1.1.17"
