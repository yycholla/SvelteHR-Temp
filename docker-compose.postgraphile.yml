# Docker Compose version is implicit in Compose v2+

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: svelteHR-postgres-postgraphile
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      # Create application user automatically
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-clean.sql:/docker-entrypoint-initdb.d/001-init.sql
      - ./migrations/:/migrations/:ro
    ports:
      - "5432:5432"
    command: |
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=4MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c temp_file_limit=2GB
      -c log_min_duration_statement=200ms
      -c log_connections=on
      -c log_disconnections=on
      -c log_statement=mod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: svelteHR-redis-postgraphile
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostGraphile GraphQL API
  postgraphile:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: svelteHR-postgraphile
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database Configuration
      DATABASE_URL: postgres://postgraphile_user:postgraphile_password@postgres:5432/hr_system
      OWNER_DATABASE_URL: postgres://postgres:postgres123@postgres:5432/hr_system
      
      # JWT Configuration
      JWT_SECRET: your-super-secure-jwt-secret-key-here-minimum-32-characters-required
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 30d
      
      # Redis Configuration
      REDIS_URL: redis://redis:6379
      
      # Server Configuration
      NODE_ENV: development
      PORT: 4000
      HOST: 0.0.0.0
      
      # PostGraphile Configuration
      POSTGRAPHILE_SCHEMAS: hr_public
      DEFAULT_ROLE: hr_guest
      GRAPHIQL_ENABLED: true
      WATCH_PG: true
      ENABLE_QUERY_BATCHING: true
      APPEND_PLUGINS: "@graphile/postgraphile-cache,@graphile/operation-hooks"
      
      # Security Configuration
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      
      # Logging Configuration
      LOG_LEVEL: info
      LOG_FORMAT: json
      
      # Database Pool Configuration
      DB_POOL_MIN: 2
      DB_POOL_MAX: 10
      DB_POOL_IDLE_TIMEOUT: 30000

    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/package.json:/app/package.json:ro
      - ./backend/tsconfig.json:/app/tsconfig.json:ro
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL Admin (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: svelteHR-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@svelteHR.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  default:
    name: svelteHR-postgraphile-network