<!DOCTYPE html>
<html>
<head>
    <title>Test Caddy Connection</title>
</head>
<body>
    <h1>Test Caddy HTTPS Proxy Connection</h1>
    <button onclick="testCaddy()">Test Caddy Connection</button>
    <div id="result"></div>

    <script>
        async function testCaddy() {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing Caddy connection...';
            
            try {
                // Test basic connectivity to Caddy proxy
                const response = await fetch('https://100.71.207.7:8443/api/v2/auth/rbac/login', {
                    method: 'GET'
                });
                
                result.innerHTML = `
                    <div style="color: green; border: 2px solid green; padding: 10px; margin: 10px 0;">
                        ✅ Caddy HTTPS Proxy Connected!<br>
                        Status: ${response.status}<br>
                        Response: ${response.statusText}<br>
                        <strong>🎉 HTTPS Proxy Working!</strong>
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `
                    <div style="color: red; border: 2px solid red; padding: 10px; margin: 10px 0;">
                        ❌ Caddy Connection Failed<br>
                        Error: ${error.message}<br>
                        Details: ${error.toString()}
                    </div>
                `;
            }
        }
        
        // Auto-test on page load
        window.onload = testCaddy;
    </script>
</body>
</html>
