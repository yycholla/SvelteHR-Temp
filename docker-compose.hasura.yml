version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: svelteHR-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: svelteHR
      POSTGRES_USER: hasura
      POSTGRES_PASSWORD: hasura123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./hasura/config/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hasura -d svelteHR"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgBouncer Connection Pooler
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: svelteHR-pgbouncer
    restart: unless-stopped
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_USER: hasura
      DATABASES_PASSWORD: hasura123
      DATABASES_DBNAME: svelteHR
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 100
      MAX_CLIENT_CONN: 1000
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 600
    volumes:
      - ./backend/docker/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: svelteHR-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Hasura GraphQL Engine
  hasura:
    image: hasura/graphql-engine:v2.36.0
    container_name: svelteHR-hasura
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database Configuration
      HASURA_GRAPHQL_DATABASE_URL: postgresql://hasura:hasura123@pgbouncer:6432/svelteHR
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgresql://hasura:hasura123@postgres:5432/svelteHR
      
      # Admin Configuration
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-your-admin-secret-here}
      HASURA_GRAPHQL_ENABLE_CONSOLE: true
      
      # JWT Authentication
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"your-256-bit-secret-key-change-this-in-production"}'
      
      # Performance Optimization
      HASURA_GRAPHQL_API_LIMITS_ENABLED: true
      HASURA_GRAPHQL_API_LIMITS_DEPTH: 10
      HASURA_GRAPHQL_API_LIMITS_NODE_LIMIT: 1000
      HASURA_GRAPHQL_API_LIMITS_RATE_LIMIT: 1000
      HASURA_GRAPHQL_API_LIMITS_TIME_WINDOW: 60
      
      # Connection Pooling
      HASURA_GRAPHQL_CONNECTIONS_PER_READ_REPLICA: 50
      HASURA_GRAPHQL_POOL_TIMEOUT: 360
      HASURA_GRAPHQL_CONN_LIFETIME: 600
      
      # Redis Caching (Enterprise Edition)
      HASURA_GRAPHQL_REDIS_URL: redis://redis:6379
      HASURA_GRAPHQL_CACHE_MAX_ENTRY_TTL: 300
      
      # Subscription Optimization
      HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_INTERVAL: 1000
      HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_BATCH_SIZE: 100
      HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_DELAY: 20
      
      # WebSocket Configuration
      HASURA_GRAPHQL_WEBSOCKET_KEEPALIVE: 5
      HASURA_GRAPHQL_WEBSOCKET_CONNECTION_INIT_TIMEOUT: 3
      
      # Logging
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log
      HASURA_GRAPHQL_LOG_LEVEL: warn
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: svelteHR-hasura-network