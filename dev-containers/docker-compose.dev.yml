version: '3.8'

services:
  # PostgreSQL Database
  postgres-dev:
    image: postgres:15-alpine
    container_name: sveltehr-postgres-dev
    environment:
      POSTGRES_DB: hr_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      POSTGRES_INIT_MAX_TIME: 30
      POSTGRES_LOG_STATEMENT: "all"
      POSTGRES_LOG_MIN_MESSAGES: "info"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"  # Use different port to avoid conflicts
    networks:
      - sveltehr-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_system"]
      interval: 5s
      timeout: 10s
      retries: 6
      start_period: 30s

  # Redis Cache
  redis-dev:
    image: redis:7-alpine
    container_name: sveltehr-redis-dev
    ports:
      - "6380:6379"  # Use different port to avoid conflicts
    networks:
      - sveltehr-dev
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes

  # Backend Development Container
  backend-dev:
    build:
      context: ../
      dockerfile: dev-containers/backend/Dockerfile
    container_name: sveltehr-backend-dev
    volumes:
      # Mount host nvim config
      - ~/.config/nvim:/host-nvim-config:ro
      # Mount backend source for live editing
      - ../backend:/home/dev/backend
      # SSH keys (optional)
      - ~/.ssh/id_rsa.pub:/home/dev/.ssh/authorized_keys:ro
    ports:
      - "2222:22"    # SSH access
      - "4000:4000"  # Backend API
      - "5000:5000"  # GraphiQL interface
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres123@postgres-dev:5432/hr_system
      REDIS_URL: redis://redis-dev:6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      SESSION_SECRET: dev-session-secret-change-in-production
      PORT: 4000
      GRAPHIQL_PORT: 5000
    networks:
      - sveltehr-dev
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_started
    restart: unless-stopped
    stdin_open: true
    tty: true

  # Frontend Development Container
  frontend-dev:
    build:
      context: ../
      dockerfile: dev-containers/frontend/Dockerfile
    container_name: sveltehr-frontend-dev
    volumes:
      # Mount host nvim config
      - ~/.config/nvim:/host-nvim-config:ro
      # Mount frontend source for live editing
      - ../src:/home/dev/frontend/src
      - ../static:/home/dev/frontend/static
      - ../package.json:/home/dev/frontend/package.json:ro
      - ../package-lock.json:/home/dev/frontend/package-lock.json:ro
      - ../svelte.config.js:/home/dev/frontend/svelte.config.js:ro
      - ../vite.config.ts:/home/dev/frontend/vite.config.ts:ro
      - ../tailwind.config.js:/home/dev/frontend/tailwind.config.js:ro
      - ../tsconfig.json:/home/dev/frontend/tsconfig.json:ro
      - ../eslint.config.js:/home/dev/frontend/eslint.config.js:ro
      - ../.env.development:/home/dev/frontend/.env.development:ro
      # SSH keys (optional)
      - ~/.ssh/id_rsa.pub:/home/dev/.ssh/authorized_keys:ro
    ports:
      - "2223:22"    # SSH access
      - "5173:5173"  # Vite dev server
      - "4173:4173"  # Vite preview server
    environment:
      NODE_ENV: development
      PUBLIC_API_URL: http://localhost:4000
      VITE_API_URL: http://backend-dev:4000
    networks:
      - sveltehr-dev
    depends_on:
      - backend-dev
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  postgres_dev_data:
    name: sveltehr_postgres_dev_data
  redis_dev_data:
    name: sveltehr_redis_dev_data

networks:
  sveltehr-dev:
    name: sveltehr-dev-network
    driver: bridge