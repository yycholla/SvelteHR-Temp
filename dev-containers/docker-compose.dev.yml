version: '3.8'

services:
  # PostgreSQL Database
  postgres-dev:
    build:
      context: ../
      dockerfile: dev-containers/postgres/Dockerfile
    container_name: sveltehr-postgres-dev
    environment:
      POSTGRES_DB: hr_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8'
      POSTGRES_INIT_MAX_TIME: 30
      POSTGRES_LOG_STATEMENT: 'all'
      POSTGRES_LOG_MIN_MESSAGES: 'info'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      # Note: Database schema now managed by SeaORM Rust migrations
      # Old SQL init scripts disabled - migrations run from GraphQL server
      # - ../db/init:/docker-entrypoint-initdb.d:ro
      # - ../db/migrations:/migrations:ro
      - ../db/scripts:/usr/local/bin/db-scripts:ro
    ports:
      - '5433:5432' # Use different port to avoid conflicts
    networks:
      - sveltehr-dev
    healthcheck:
      test: ['CMD-SHELL', '/usr/local/bin/healthcheck.sh']
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 45s

  # Redis Cache
  redis-dev:
    image: redis:7-alpine
    container_name: sveltehr-redis-dev
    ports:
      - '6380:6379' # Use different port to avoid conflicts
    networks:
      - sveltehr-dev
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes

  # Rust GraphQL Server (Development with Hot-Reloading)
  hr-graphql-rust:
    build:
      context: ../graphql-rust-server
      dockerfile: Dockerfile.dev # Use development Dockerfile with cargo-watch for hot-reload
    container_name: sveltehr-graphql-rust
    volumes:
      # Mount source code for hot-reloading
      - ../graphql-rust-server/src:/app/src:ro
      - ../graphql-rust-server/tests:/app/tests:ro
      - ../graphql-rust-server/models:/app/models
      - ../graphql-rust-server/migration:/app/migration:ro
      - ../graphql-rust-server/Cargo.toml:/app/Cargo.toml
      - ../graphql-rust-server/Cargo.lock:/app/Cargo.lock
      - ../graphql-rust-server/.cargo:/app/.cargo:ro
      # CRITICAL: Use Docker volume for target directory (NOT bind-mounted)
      # This avoids I/O overhead and significantly speeds up compilation
      - rust_target_cache:/app/target
      # Cache cargo registry and git to speed up dependency downloads
      - rust_cargo_registry:/usr/local/cargo/registry
      - rust_cargo_git:/usr/local/cargo/git
    ports:
      - '4000:4000' # GraphQL API
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres-dev:5432/hr_system
      HOST: 0.0.0.0
      PORT: 4000
      RUST_LOG: info,hr_graphql_server=debug,sea_orm=warn,sqlx=warn
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      JWT_SECRET: dev-jwt-secret-change-in-production
      SERVICE_AUTH_KEY: dev-service-key-change-in-production-use-strong-random-key
      # Enable backtrace for better debugging
      RUST_BACKTRACE: 1
      # SeaORM-specific environment variables for development
      # Set to 'true' and change RUST_LOG sea_orm=info for detailed SQL debugging
      SEA_ORM_LOG_QUERIES: false
      SEA_ORM_LOG_LEVEL: warn
      # Seed Data Configuration - automatically populates development database
      ENABLE_SEED_DATA: ${ENABLE_SEED_DATA:-true}
      SEED_VOLUME_TARGET: small
      SEED_ENABLE_AUDIT: true
      ENVIRONMENT: development
      # Intuit QuickBooks Integration
      INTUIT_CLIENT_ID: ABtBLG39mgu3uUM3AQEtppTBXmT6SLvr42ahiouGRz8cOJJyYM
      INTUIT_CLIENT_SECRET: OUN6pvfsN5uToTcsjZt6K0FBUdiOZFNswrzPDtvq
      INTUIT_REDIRECT_URI: http://localhost:5173/api/intuit/callback
      INTUIT_ENVIRONMENT: sandbox
      INTUIT_SCOPES: com.intuit.quickbooks.accounting com.intuit.quickbooks.payment
      INTUIT_WEBHOOK_URL: https://your-domain.com/api/intuit/webhook
      INTUIT_WEBHOOK_VERIFIER_TOKEN: ef64f0f4-9508-45b4-9fab-f2a98e5f2bc2
      # SMTP2go Email Configuration
      SMTP_HOST: mail.smtp2go.com
      SMTP_PORT: 2525
      SMTP_USERNAME: mtncarerx.com
      SMTP_PASSWORD: 6sf4p24RcHy8BEKC
      SMTP_FROM_EMAIL: noreply@mtncarerx.com
      SMTP_FROM_NAME: SvelteHR System
      APP_BASE_URL: http://localhost:5173
    networks:
      - sveltehr-dev
    depends_on:
      postgres-dev:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true

  # Frontend Development Container
  frontend-dev:
    build:
      context: ../
      dockerfile: dev-containers/frontend/Dockerfile
    container_name: sveltehr-frontend-dev
    volumes:
      # Mount host nvim config
      - ~/.config/nvim:/host-nvim-config:ro
      # Mount entire frontend directory with proper permissions
      - ../:/home/dev/frontend
      # Use named volumes for build artifacts and node_modules to avoid permission issues
      - frontend_node_modules:/home/dev/frontend/node_modules
      - frontend_svelte_kit:/home/dev/frontend/.svelte-kit
      # SSH keys (optional)
      - ~/.ssh/id_rsa.pub:/home/dev/.ssh/authorized_keys:ro
    ports:
      - '2223:22' # SSH access
      - '5173:5173' # Vite dev server
      - '4173:4173' # Vite preview server
    environment:
      NODE_ENV: development
      PUBLIC_API_URL: http://hr-graphql-rust:4000
      VITE_API_URL: http://hr-graphql-rust:4000
      SERVICE_AUTH_KEY: dev-service-key-change-in-production-use-strong-random-key
      # Database connection for server-side API routes
      DB_HOST: postgres-dev
      DB_PORT: 5432
      DB_NAME: hr_system
      DB_USER: postgres
      DB_PASSWORD: postgres123
    networks:
      - sveltehr-dev
    depends_on:
      - hr-graphql-rust
      - postgres-dev
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  postgres_dev_data:
    name: sveltehr_postgres_dev_data
  redis_dev_data:
    name: sveltehr_redis_dev_data
  frontend_node_modules:
    name: sveltehr_frontend_node_modules
  frontend_svelte_kit:
    name: sveltehr_frontend_svelte_kit
  # Rust GraphQL Server volumes for optimal compilation performance
  rust_target_cache:
    name: sveltehr_rust_target_cache
  rust_cargo_registry:
    name: sveltehr_rust_cargo_registry
  rust_cargo_git:
    name: sveltehr_rust_cargo_git

networks:
  sveltehr-dev:
    name: sveltehr-dev-network
    driver: bridge
