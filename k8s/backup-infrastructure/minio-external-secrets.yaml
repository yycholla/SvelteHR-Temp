# External Secrets for MinIO credentials from Doppler
---
apiVersion: v1
kind: Namespace
metadata:
  name: backup-system

---
# MinIO root credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-external-secret
  namespace: backup-system
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: minio-secret
    creationPolicy: Owner
    template:
      data:
        rootUser: '{{ .MINIO_ROOT_USER }}'
        rootPassword: '{{ .MINIO_ROOT_PASSWORD }}'
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: MINIO_ROOT_USER
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: MINIO_ROOT_PASSWORD

---
# Velero MinIO access credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-minio-external-secret
  namespace: backup-system
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: velero-minio-secret
    creationPolicy: Owner
  data:
    - secretKey: VELERO_MINIO_SECRET_KEY
      remoteRef:
        key: VELERO_MINIO_SECRET_KEY

---
# ClusterSecretStore (if not already created)
# This allows External Secrets to be used across namespaces
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler-secret-store
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token-secret
            namespace: sveltehr-prod # Reference existing token
            key: dopplerToken
      project: sveltehr
      config: prod
