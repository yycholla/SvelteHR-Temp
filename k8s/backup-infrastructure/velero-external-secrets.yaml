# External Secrets for Velero S3/MinIO credentials from Doppler
---
# Velero credentials for MinIO access
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-credentials-external-secret
  namespace: backup-system
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: velero-credentials
    creationPolicy: Owner
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .VELERO_MINIO_ACCESS_KEY }}
          aws_secret_access_key={{ .VELERO_MINIO_SECRET_KEY }}
  data:
    - secretKey: VELERO_MINIO_ACCESS_KEY
      remoteRef:
        key: VELERO_MINIO_ACCESS_KEY
    - secretKey: VELERO_MINIO_SECRET_KEY
      remoteRef:
        key: VELERO_MINIO_SECRET_KEY
