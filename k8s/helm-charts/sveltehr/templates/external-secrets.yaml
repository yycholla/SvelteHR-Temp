{{- if .Values.externalSecrets.enabled }}
---
# Doppler Service Token Secret (only hardcoded secret needed)
apiVersion: v1
kind: Secret
metadata:
  name: doppler-token-secret
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  dopplerToken: {{ .Values.externalSecrets.doppler.serviceToken | required "externalSecrets.doppler.serviceToken is required when externalSecrets.enabled=true" | quote }}

---
# SecretStore that connects to Doppler
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: doppler-secret-store
  namespace: {{ .Values.global.namespace }}
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token-secret
            key: dopplerToken
      project: {{ .Values.externalSecrets.doppler.project | required "externalSecrets.doppler.project is required" | quote }}
      config: {{ .Values.externalSecrets.doppler.config | required "externalSecrets.doppler.config is required" | quote }}

---
# ExternalSecret that pulls secrets from Doppler
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sveltehr-external-secrets
  namespace: {{ .Values.global.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: doppler-secret-store
    kind: SecretStore
  target:
    name: {{ include "sveltehr.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    # Remap Doppler keys to match deployment expectations
    - secretKey: username
      remoteRef:
        key: POSTGRES_USER
    - secretKey: password
      remoteRef:
        key: POSTGRES_PASSWORD
    - secretKey: postgres-password
      remoteRef:
        key: POSTGRES_PASSWORD
    - secretKey: jwt-secret
      remoteRef:
        key: JWT_SECRET
    - secretKey: jwt-refresh-secret
      remoteRef:
        key: JWT_REFRESH_SECRET
    - secretKey: service-auth-key
      remoteRef:
        key: SERVICE_AUTH_KEY
    # Intuit QuickBooks OAuth secrets
    - secretKey: intuit-client-id
      remoteRef:
        key: INTUIT_CLIENT_ID
    - secretKey: intuit-client-secret
      remoteRef:
        key: INTUIT_CLIENT_SECRET
    - secretKey: intuit-webhook-verifier-token
      remoteRef:
        key: INTUIT_WEBHOOK_VERIFIER_TOKEN

---
{{- if and .Values.pgadmin .Values.pgadmin.enabled }}
# ExternalSecret for pgAdmin password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-external-secret
  namespace: {{ .Values.global.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: doppler-secret-store
    kind: SecretStore
  target:
    name: pgadmin-secret
    creationPolicy: Owner
  data:
    - secretKey: pgadmin-password
      remoteRef:
        key: PGADMIN_PASSWORD
{{- end }}
{{- end }}
