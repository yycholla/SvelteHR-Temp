# =============================================================================
# SvelteHR Helm Chart - Development Values
# =============================================================================
# Complete configuration for development environment
# Optimized for local Kubernetes (k3s/minikube) with minimal resources
# =============================================================================

# -----------------------------------------------------------------------------
# Global Configuration
# -----------------------------------------------------------------------------
global:
  namespace: sveltehr-dev
  environment: development

# -----------------------------------------------------------------------------
# PostgreSQL Configuration (CloudNativePG)
# -----------------------------------------------------------------------------
postgresql:
  enabled: true

  # Development: Single instance (no HA)
  instances: 1

  # PostgreSQL image
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: '15.6'

  # Database configuration
  database: hr_system
  username: hr_user
  password: 'dev_password_change_me' # Override with secret in production
  superuserPassword: 'dev_superuser_change_me'

  # Storage configuration
  storage:
    size: 5Gi
    storageClass: local-path # k3s default
    pvcTemplate: {}

  # PostgreSQL server parameters
  config:
    maxConnections: '100'
    sharedBuffers: '256MB'
    workMem: '4MB'
    maintenanceWorkMem: '64MB'
    maxWalSenders: '10'
    maxReplicationSlots: '10'
    additionalParameters: {}

  # Service configuration
  service:
    name: '' # Will default to sveltehr-postgres-rw
    port: 5432

  # Backup configuration (disabled for dev)
  backup:
    enabled: false
    destinationPath: ''
    endpointURL: ''
    retentionPolicy: '7d'
    schedule: ''
    s3Credentials: {}

  # Monitoring
  monitoring:
    enabled: true
    podMonitorLabels: {}

  # Resources
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  # Node scheduling
  nodeSelector: {}
  affinity: {}
  tolerations: []

# -----------------------------------------------------------------------------
# Redis Configuration (Bitnami Redis)
# -----------------------------------------------------------------------------
redis:
  enabled: true

  # Standalone mode for development (no replication)
  architecture: standalone

  # Authentication disabled for dev convenience
  auth:
    enabled: false
    password: ''

  # Master configuration
  master:
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m

  # Replica configuration (disabled in standalone)
  replica:
    replicaCount: 0

  # Sentinel (disabled for standalone)
  sentinel:
    enabled: false

  # Service configuration
  url: '' # Will default to redis://sveltehr-redis-master:6379

# -----------------------------------------------------------------------------
# Backend Configuration (Rust GraphQL Server)
# -----------------------------------------------------------------------------
backend:
  enabled: true
  replicaCount: 1

  # Image configuration (multi-target build - server)
  image:
    repository: ghcr.io/mountain-care-rx/sveltehr/backend-server
    tag: latest
    pullPolicy: Always

  imagePullSecrets: []

  # Service configuration
  service:
    type: ClusterIP
    port: 4000
    targetPort: 4000
    annotations: {}

  # Server configuration
  host: '0.0.0.0'
  rustLog: 'info,hr_graphql_server=debug'

  # Environment variables
  extraEnv: []
  envFrom: []

  # Resources
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

  # Probes
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  startupProbe: {}

  # Security context
  securityContext:
    runAsUser: 1001
    runAsNonRoot: true

  podSecurityContext:
    fsGroup: 1001

  # Deployment strategy
  strategy: {}

  # Node scheduling
  nodeSelector: {}
  affinity: {}
  tolerations: []

  # Volumes
  volumes: []
  volumeMounts: []

  # Annotations
  annotations: {}
  podAnnotations: {}
  podLabels: {}

# -----------------------------------------------------------------------------
# Frontend Configuration (SvelteKit)
# -----------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 1

  # Image configuration
  image:
    repository: ghcr.io/mountain-care-rx/sveltehr/frontend
    tag: latest
    pullPolicy: Always

  imagePullSecrets: []

  # Service configuration
  service:
    type: ClusterIP
    port: 5173 # Vite dev server
    targetPort: 5173
    annotations: {}

  # Backend URL configuration
  backendUrl: '' # Will default to http://sveltehr-backend:4000
  waitForBackend: true # Enable init container

  # Server configuration
  host: '0.0.0.0'

  # Environment variables
  extraEnv: []
  envFrom: []

  # Resources
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

  # Probes
  livenessProbe:
    path: /
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  startupProbe: {}

  # Security context (allow root for dev convenience)
  securityContext:
    runAsUser: 1001
    runAsNonRoot: false # Dev mode: allow root for npm operations

  podSecurityContext:
    fsGroup: 1001

  # Deployment strategy
  strategy: {}

  # Node scheduling
  nodeSelector: {}
  affinity: {}
  tolerations: []

  # Volumes
  volumes: []
  volumeMounts: []

  # Annotations
  annotations: {}
  podAnnotations: {}
  podLabels: {}

# -----------------------------------------------------------------------------
# Migration Job Configuration (Helm pre-install/pre-upgrade hook)
# -----------------------------------------------------------------------------
migration:
  enabled: true

  # Image configuration (multi-target build - migration)
  image:
    repository: ghcr.io/mountain-care-rx/sveltehr/backend-migration
    tag: latest
    pullPolicy: Always

  # Job configuration
  ttlSecondsAfterFinished: 300 # Cleanup after 5 minutes
  backoffLimit: 3 # Retry up to 3 times

  # Logging
  rustLog: 'info,migration=debug'

  # Environment variables
  extraEnv: []

  # Resources
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

  # Security context
  securityContext: {}

  # Node scheduling
  nodeSelector: {}
  affinity: {}
  tolerations: []

  # Annotations
  annotations: {}
  podAnnotations: {}

# -----------------------------------------------------------------------------
# Seed Job Configuration (Helm test hook - manual execution)
# -----------------------------------------------------------------------------
seed:
  enabled: false # Manual execution only in dev

  # Image configuration (multi-target build - seed)
  image:
    repository: ghcr.io/mountain-care-rx/sveltehr/backend-seed
    tag: latest
    pullPolicy: Always

  # Job configuration
  ttlSecondsAfterFinished: 300
  backoffLimit: 1 # Only retry once

  # Admin credentials (optional - will use defaults if not provided)
  adminEmail: 'admin@sveltehr.dev'
  adminPassword: 'admin' # Change in production!

  # Logging
  rustLog: 'info,seed_data=debug'

  # Environment variables
  extraEnv: []

  # Resources
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

  # Security context
  securityContext: {}

  # Node scheduling
  nodeSelector: {}
  affinity: {}
  tolerations: []

  # Annotations
  annotations: {}
  podAnnotations: {}

# -----------------------------------------------------------------------------
# Service Account Configuration
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  # Name suffix will be added: sveltehr-backend-sa, sveltehr-frontend-sa

# -----------------------------------------------------------------------------
# RBAC Configuration
# -----------------------------------------------------------------------------
rbac:
  enabled: false # Optional RBAC template (not critical for dev)

# -----------------------------------------------------------------------------
# External Secrets Operator (Doppler Integration)
# -----------------------------------------------------------------------------
externalSecrets:
  enabled: false # Disabled for dev (use hardcoded secrets)
  refreshInterval: 1h

  doppler:
    serviceToken: ''
    project: ''
    config: ''

# -----------------------------------------------------------------------------
# Intuit QuickBooks Integration (Development)
# -----------------------------------------------------------------------------
intuit:
  environment: sandbox
  redirectUri: 'https://dev.sveltehr.com/api/intuit/callback'
  webhookUrl: 'https://dev.sveltehr.com/api/intuit/webhook'

# -----------------------------------------------------------------------------
# Ingress Configuration
# -----------------------------------------------------------------------------
ingress:
  enabled: false # Use port-forwarding for dev
  className: traefik
  annotations: {}
  host: localhost
  tls:
    enabled: false

# -----------------------------------------------------------------------------
# Pod Disruption Budgets
# -----------------------------------------------------------------------------
podDisruptionBudget:
  enabled: false # Not needed for single-replica dev

# -----------------------------------------------------------------------------
# Monitoring Configuration
# -----------------------------------------------------------------------------
monitoring:
  enabled: true
  scrapeInterval: 30s
  scrapeTimeout: 10s

# -----------------------------------------------------------------------------
# pgAdmin Configuration
# -----------------------------------------------------------------------------
pgadmin:
  enabled: false # Optional for dev
  email: 'admin@sveltehr.dev'
  password: 'admin'

  image:
    repository: dpage/pgadmin4
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  tailscale:
    enabled: false
    hostname: 'pgadmin-dev'

# -----------------------------------------------------------------------------
# Tailscale Configuration
# -----------------------------------------------------------------------------
tailscale:
  enabled: false # Disabled by default for dev


# =============================================================================
# Development Notes
# =============================================================================
#
# Quick Start:
#   helm install sveltehr . -f values-dev.yaml -n sveltehr-dev --create-namespace
#
# Update:
#   helm upgrade sveltehr . -f values-dev.yaml -n sveltehr-dev
#
# Test migration:
#   helm test sveltehr -n sveltehr-dev --filter name=seed
#
# Port-forward to access services:
#   kubectl port-forward -n sveltehr-dev svc/sveltehr-frontend 5173:5173
#   kubectl port-forward -n sveltehr-dev svc/sveltehr-backend 4000:4000
#
# View logs:
#   kubectl logs -n sveltehr-dev -l app.kubernetes.io/component=backend -f
#   kubectl logs -n sveltehr-dev -l app.kubernetes.io/component=frontend -f
#
# Check migration job:
#   kubectl get jobs -n sveltehr-dev -l helm.sh/hook=pre-install
#
# =============================================================================
