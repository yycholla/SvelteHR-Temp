# Default values for sveltehr (development)
# This is a YAML-formatted file.

global:
  namespace: sveltehr-dev
  environment: development

# Frontend configuration
frontend:
  enabled: true
  name: sveltehr-frontend
  replicaCount: 1

  image:
    repository: localhost:5000/sveltehr-frontend
    pullPolicy: Always
    tag: "1.0.0"  # Must match production tag for ArgoCD Image Updater
    target: development  # Use development Dockerfile target

  service:
    type: ClusterIP
    port: 5173  # Development uses Vite dev server
    targetPort: 5173
    annotations: {}

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

  env:
    PUBLIC_API_URL: "http://sveltehr-backend:4000"
    DB_HOST: "sveltehr-postgres-rw"
    DB_PORT: "5432"

  # Tailscale configuration (disabled by default)
  tailscale:
    enabled: false
    hostname: "sveltehr-frontend-dev"

# Backend configuration
backend:
  enabled: true
  name: sveltehr-backend
  replicaCount: 1

  image:
    repository: localhost:5000/sveltehr-backend
    pullPolicy: Always
    tag: "1.0.0"  # Must match production tag for ArgoCD Image Updater
    target: development

  service:
    type: ClusterIP
    port: 4000
    targetPort: 4000
    annotations: {}

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  env:
    DB_HOST: "sveltehr-postgres-rw"
    DB_PORT: "5432"
    DB_NAME: "hr_system"
    DB_USER: "hr_user"
    REDIS_URL: "redis://redis:6379"

# ConfigMap data
config:
  POSTGRES_DB: "hr_system"
  POSTGRES_USER: "hr_user"
  NODE_ENV: "development"
  LOG_LEVEL: "debug"

# Secrets (these should be overridden or created separately)
# DEPRECATED: Use externalSecrets with Doppler instead
secrets:
  postgresPassword: "changeme"
  jwtSecret: "changeme"
  jwtRefreshSecret: "changeme"
  serviceAuthKey: "changeme"

# External Secrets Operator integration with Doppler
externalSecrets:
  enabled: false  # Disabled by default for dev (use hardcoded secrets)
  refreshInterval: 1h  # How often to sync from Doppler

  doppler:
    # Get service token from: https://dashboard.doppler.com/
    # Create a read-only service token for the project/config
    serviceToken: ""  # REQUIRED when enabled: Doppler service token (dp.st.xxxx)
    project: ""       # REQUIRED when enabled: Doppler project name (e.g., "sveltehr")
    config: ""        # REQUIRED when enabled: Doppler config name (e.g., "dev", "prod")

# Pod Disruption Budgets for high availability
podDisruptionBudget:
  enabled: false  # Disabled by default for dev

  frontend:
    # Use minAvailable OR maxUnavailable (not both)
    minAvailable: 1      # Minimum pods that must be available during disruptions
    # maxUnavailable: 1  # Maximum pods that can be unavailable during disruptions

  backend:
    minAvailable: 2      # Keep at least 2 backend pods during disruptions
    # maxUnavailable: 1

# Ingress configuration (Traefik)
ingress:
  enabled: false  # Disabled for dev by default
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  host: localhost
  tls:
    enabled: false

# Service Account
serviceAccount:
  create: true
  annotations: {}

# Monitoring configuration (Prometheus/Grafana)
monitoring:
  enabled: true
  scrapeInterval: 30s
  scrapeTimeout: 10s

# pgAdmin configuration
pgadmin:
  enabled: false  # Disabled by default for dev
  email: "admin@sveltehr.dev"
  password: "admin"

  image:
    repository: dpage/pgadmin4
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  tailscale:
    enabled: false
    hostname: "pgadmin-dev"
