# ArgoCD Helm values for SvelteHR deployment
# Exposes ArgoCD UI via Tailscale for remote access

server:
  service:
    type: ClusterIP
    annotations:
      # Expose ArgoCD UI via Tailscale
      tailscale.com/expose: 'true'
      tailscale.com/hostname: 'argocd'

  # Enable insecure mode for Tailscale (no TLS required)
  extraArgs:
    - --insecure

  # Resource limits for production stability
  resources:
    requests:
      memory: '256Mi'
      cpu: '100m'
    limits:
      memory: '512Mi'
      cpu: '500m'

# Controller manages application sync
controller:
  resources:
    requests:
      memory: '512Mi'
      cpu: '250m'
    limits:
      memory: '1Gi'
      cpu: '500m'

# Repo server pulls Git repos and Helm charts
repoServer:
  resources:
    requests:
      memory: '256Mi'
      cpu: '100m'
    limits:
      memory: '512Mi'
      cpu: '200m'

# ApplicationSet controller for multi-cluster management (future)
applicationSet:
  enabled: true
  resources:
    requests:
      memory: '128Mi'
      cpu: '50m'
    limits:
      memory: '256Mi'
      cpu: '100m'

# Notifications controller for webhooks/alerts
notifications:
  enabled: true
  resources:
    requests:
      memory: '128Mi'
      cpu: '50m'
    limits:
      memory: '256Mi'
      cpu: '100m'

# Global configuration
global:
  # Domain for ArgoCD (optional, using Tailscale hostname)
  domain: argocd.dropbear-elnath.ts.net
