# Let's Encrypt ClusterIssuers for cert-manager
# These are cluster-wide issuers for TLS certificate generation
# Apply this after cert-manager is installed

---
# Let's Encrypt Staging Issuer (for testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Let's Encrypt staging server (higher rate limits for testing)
    server: https://acme-staging-v02.api.letsencrypt.org/directory

    # Email for certificate expiration notifications
    email: admin@sveltehr.dev

    # Secret to store ACME account private key
    privateKeySecretRef:
      name: letsencrypt-staging-account-key

    # HTTP-01 challenge with Traefik ingress
    solvers:
      - http01:
          ingress:
            class: traefik

---
# Let's Encrypt Production Issuer (for real certificates)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production server (strict rate limits)
    server: https://acme-v02.api.letsencrypt.org/directory

    # Email for certificate expiration notifications
    email: admin@sveltehr.dev

    # Secret to store ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod-account-key

    # HTTP-01 challenge with Traefik ingress
    solvers:
      - http01:
          ingress:
            class: traefik
