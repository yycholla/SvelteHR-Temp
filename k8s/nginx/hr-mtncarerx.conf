# hr.mtncarerx.com - SvelteHR Application
# Routes to k8s cluster via Traefik NodePorts
#
# Deployment Instructions:
# 1. Replace <K8S_NODE_IP> with your actual Kubernetes node IP address
# 2. Update SSL certificate paths to point to your actual certificate files
# 3. Copy this file to your Windows nginx configuration directory
# 4. Test: nginx -t
# 5. Reload: nginx -s reload

upstream k8s_traefik_http {
    # Replace K8S_NODE_IP with your actual k8s node IP address
    server <K8S_NODE_IP>:30080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream k8s_traefik_https {
    # HTTPS traffic to Traefik's secure port
    server <K8S_NODE_IP>:30443 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP server - ACME challenges and redirect to HTTPS
server {
    listen 80;
    server_name hr.mtncarerx.com;

    access_log /var/log/nginx/hr-mtncarerx-access.log;
    error_log /var/log/nginx/hr-mtncarerx-error.log;

    # CRITICAL: Allow ACME challenges to reach cert-manager in k8s
    # This is required for Let's Encrypt certificate validation
    location /.well-known/acme-challenge/ {
        proxy_pass http://k8s_traefik_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server - proxy to Traefik's HTTPS port
server {
    listen 443 ssl http2;
    server_name hr.mtncarerx.com;

    # SSL certificate paths (update these to your actual cert locations)
    ssl_certificate /path/to/ssl/hr.mtncarerx.com.crt;
    ssl_certificate_key /path/to/ssl/hr.mtncarerx.com.key;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/hr-mtncarerx-ssl-access.log;
    error_log /var/log/nginx/hr-mtncarerx-ssl-error.log;

    client_max_body_size 50M;

    location / {
        # Proxy to Traefik's HTTPS NodePort
        proxy_pass https://k8s_traefik_https;
        proxy_ssl_verify off;  # Disable SSL verification to backend

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # WebSocket support (for real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Disable request buffering for uploads
        proxy_request_buffering off;
    }

    # Health check endpoint (optional)
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# =============================================================================
# Architecture Notes
# =============================================================================
#
# Traffic Flow:
#   Internet → Windows VM Nginx (SSL termination) → k8s Traefik (NodePort 30443) → SvelteHR Frontend
#
# This configuration:
#   - Terminates SSL at the Windows nginx level
#   - Proxies HTTPS traffic to Traefik's secure NodePort (30443)
#   - Maintains WebSocket connections for real-time features
#   - Supports large file uploads (50MB limit)
#   - Provides proper headers for backend to identify original client
#
# Coexistence with portal.mtncarerx.com:
#   - Both nginx configs can run on the same Windows VM
#   - Different server_name directives ensure proper routing
#   - Shared upstream to k8s cluster if both use the same Traefik instance
#
# =============================================================================
