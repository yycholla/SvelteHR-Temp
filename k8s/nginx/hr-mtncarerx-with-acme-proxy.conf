# hr.mtncarerx.com - SvelteHR Application with ACME Challenge Proxy
# This config proxies ACME challenges to k8s cert-manager for automatic SSL renewal
# Traefik handles SSL termination, nginx just forwards traffic

upstream k8s_traefik_http {
    # Replace K8S_NODE_IP with your actual k8s node IP address
    server <K8S_NODE_IP>:30080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream k8s_traefik_https {
    # HTTPS traffic to Traefik's secure port
    server <K8S_NODE_IP>:30443 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP server - proxy ACME challenges to k8s, redirect everything else to HTTPS
server {
    listen 80;
    server_name hr.mtncarerx.com;

    access_log /var/log/nginx/hr-mtncarerx-access.log;
    error_log /var/log/nginx/hr-mtncarerx-error.log;

    # ACME challenge - proxy to k8s for cert-manager to handle
    location /.well-known/acme-challenge/ {
        proxy_pass http://k8s_traefik_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server - Let Traefik handle SSL entirely, nginx just TCP proxies
server {
    listen 443;
    server_name hr.mtncarerx.com;

    # TCP proxy to Traefik's HTTPS port (Traefik terminates SSL)
    # This is simpler - Traefik manages the certificates via cert-manager

    # Stream module TCP proxy (add to nginx.conf main context):
    # stream {
    #     upstream k8s_traefik_https_stream {
    #         server <K8S_NODE_IP>:30443;
    #     }
    #     server {
    #         listen 443;
    #         proxy_pass k8s_traefik_https_stream;
    #         proxy_protocol on;
    #     }
    # }

    # OR: Use SNI routing with ssl_preread (requires nginx stream module)
    # See Option 3 below for pure TCP passthrough
}

