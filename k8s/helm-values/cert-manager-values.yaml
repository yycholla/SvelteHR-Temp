# cert-manager Helm Values
# https://github.com/cert-manager/cert-manager

# Global configuration
global:
  leaderElection:
    namespace: cert-manager

# Install CRDs
crds:
  enabled: true
  keep: true # Keep CRDs on uninstall

# Replica count
replicaCount: 1

# Resources
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Webhook
webhook:
  replicaCount: 1
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# CA Injector
cainjector:
  replicaCount: 1
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Prometheus monitoring (enabled with Prometheus Operator)
prometheus:
  enabled: true
  servicemonitor:
    enabled: true # Creates ServiceMonitor for Prometheus
