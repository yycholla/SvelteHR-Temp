# kube-prometheus-stack Helm Values
# https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
#
# This chart includes:
# - Prometheus Operator (with PodMonitor/ServiceMonitor CRDs)
# - Prometheus Server
# - Alertmanager
# - Grafana
# - Node Exporter
# - Kube State Metrics

# Global settings
namespaceOverride: "monitoring"

# Prometheus Operator
prometheusOperator:
  enabled: true

  # Resources
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Admission webhooks
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true

# Prometheus Server
prometheus:
  enabled: true

  prometheusSpec:
    # Retention
    retention: 7d
    retentionSize: "10GB"

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
          storageClassName: local-path  # k3s default storage class

    # Resources
    resources:
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 3Gi

    # Service monitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # Scrape configs - monitor all namespaces
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

  # Service configuration
  service:
    type: NodePort
    nodePort: 30090

# Alertmanager
alertmanager:
  enabled: true

  alertmanagerSpec:
    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
          storageClassName: local-path  # k3s default storage class

    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Service
  service:
    type: NodePort
    nodePort: 30093

# Grafana
grafana:
  enabled: true

  # Admin credentials
  adminPassword: admin  # Change in production!

  # Persistence
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: local-path  # k3s default storage class

  # Resources
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Service
  service:
    type: NodePort
    nodePort: 30300

  # Datasources - auto-configured by chart, no custom config needed
  # The chart automatically creates a Prometheus datasource
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-stack:3100
      jsonData:
        maxLines: 1000
      isDefault: false
      editable: true

  # Default dashboards
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: UTC

  # Additional dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

# Node Exporter
nodeExporter:
  enabled: true

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Kube State Metrics
kubeStateMetrics:
  enabled: true

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Default rules and alerts
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false  # Not needed for k3s/minikube
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: false  # Can be noisy in dev
    kubeApiserverAvailability: false
    kubeApiserverSlos: false
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
