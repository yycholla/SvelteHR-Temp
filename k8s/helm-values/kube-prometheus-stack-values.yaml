# kube-prometheus-stack Helm Values
# https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
#
# This chart includes:
# - Prometheus Operator (with PodMonitor/ServiceMonitor CRDs)
# - Prometheus Server
# - Alertmanager
# - Grafana
# - Node Exporter
# - Kube State Metrics

# Global settings
namespaceOverride: 'monitoring'

# Prometheus Operator
prometheusOperator:
  enabled: true

  # Resources
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Admission webhooks
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true

# Prometheus Server
prometheus:
  enabled: true

  prometheusSpec:
    # Retention
    retention: 7d
    retentionSize: '10GB'

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ['ReadWriteOnce']
          resources:
            requests:
              storage: 10Gi
          storageClassName: local-path # k3s default storage class

    # Resources
    resources:
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 3Gi

    # Service monitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # Scrape configs - monitor all namespaces
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

  # Service configuration
  service:
    type: NodePort
    nodePort: 30090

# Alertmanager
alertmanager:
  enabled: true

  alertmanagerSpec:
    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ['ReadWriteOnce']
          resources:
            requests:
              storage: 2Gi
          storageClassName: local-path # k3s default storage class

    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Service
  service:
    type: NodePort
    nodePort: 30093

# Grafana
grafana:
  enabled: true

  # Admin credentials
  adminPassword: admin # Change in production!

  # Persistence
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: local-path # k3s default storage class

  # Resources
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Service
  service:
    type: NodePort
    nodePort: 30300

  # Datasources - auto-configured by chart, no custom config needed
  # The chart automatically creates a Prometheus datasource
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-stack:3100
      jsonData:
        maxLines: 1000
      isDefault: false
      editable: true

  # Default dashboards
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: UTC

  # Additional dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  # Custom dashboards
  dashboards:
    default:
      sveltehr-pods-monitoring:
        json: |
          {
            "title": "SvelteHR Pods Monitoring",
            "tags": ["sveltehr", "kubernetes", "monitoring"],
            "timezone": "browser",
            "editable": true,
            "graphTooltip": 1,
            "time": {
              "from": "now-1h",
              "to": "now"
            },
            "refresh": "30s",
            "panels": [
              {
                "title": "Pod Status Overview",
                "type": "stat",
                "gridPos": {"h": 4, "w": 24, "x": 0, "y": 0},
                "targets": [
                  {
                    "expr": "sum(kube_pod_status_phase{namespace=~\"sveltehr-prod|backup-system\", phase=\"Running\"})",
                    "legendFormat": "Running Pods"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "color": {"mode": "thresholds"},
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {"color": "green", "value": null},
                        {"color": "red", "value": 1}
                      ]
                    }
                  }
                }
              },
              {
                "title": "Backend CPU Usage",
                "type": "timeseries",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
                "targets": [
                  {
                    "expr": "rate(container_cpu_usage_seconds_total{namespace=\"sveltehr-prod\", pod=~\"sveltehr-backend.*\"}[5m]) * 100",
                    "legendFormat": "{{pod}}"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent"
                  }
                }
              },
              {
                "title": "Backend Memory Usage",
                "type": "timeseries",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
                "targets": [
                  {
                    "expr": "container_memory_working_set_bytes{namespace=\"sveltehr-prod\", pod=~\"sveltehr-backend.*\"} / 1024 / 1024",
                    "legendFormat": "{{pod}}"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "MiB"
                  }
                }
              },
              {
                "title": "PostgreSQL CPU",
                "type": "timeseries",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
                "targets": [
                  {
                    "expr": "rate(container_cpu_usage_seconds_total{namespace=\"sveltehr-prod\", pod=~\".*postgres.*\"}[5m]) * 100",
                    "legendFormat": "{{pod}}"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent"
                  }
                }
              },
              {
                "title": "PostgreSQL Memory",
                "type": "timeseries",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
                "targets": [
                  {
                    "expr": "container_memory_working_set_bytes{namespace=\"sveltehr-prod\", pod=~\".*postgres.*\"} / 1024 / 1024",
                    "legendFormat": "{{pod}}"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "MiB"
                  }
                }
              },
              {
                "title": "PostgreSQL Connections",
                "type": "timeseries",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
                "targets": [
                  {
                    "expr": "cnpg_backends_total{namespace=\"sveltehr-prod\"}",
                    "legendFormat": "{{pod}} - {{state}}"
                  }
                ]
              },
              {
                "title": "PostgreSQL Disk Usage",
                "type": "gauge",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
                "targets": [
                  {
                    "expr": "(kubelet_volume_stats_used_bytes{namespace=\"sveltehr-prod\", persistentvolumeclaim=~\".*postgres.*\"} / kubelet_volume_stats_capacity_bytes{namespace=\"sveltehr-prod\", persistentvolumeclaim=~\".*postgres.*\"}) * 100",
                    "legendFormat": "{{persistentvolumeclaim}}"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent",
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {"color": "green", "value": null},
                        {"color": "yellow", "value": 70},
                        {"color": "red", "value": 85}
                      ]
                    }
                  }
                }
              },
              {
                "title": "Redis CPU",
                "type": "timeseries",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 28},
                "targets": [
                  {
                    "expr": "rate(container_cpu_usage_seconds_total{namespace=\"sveltehr-prod\", pod=~\".*redis.*\"}[5m]) * 100",
                    "legendFormat": "{{pod}}"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent"
                  }
                }
              },
              {
                "title": "Redis Memory",
                "type": "timeseries",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28},
                "targets": [
                  {
                    "expr": "container_memory_working_set_bytes{namespace=\"sveltehr-prod\", pod=~\".*redis.*\"} / 1024 / 1024",
                    "legendFormat": "{{pod}}"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "MiB"
                  }
                }
              },
              {
                "title": "MinIO CPU",
                "type": "timeseries",
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 36},
                "targets": [
                  {
                    "expr": "rate(container_cpu_usage_seconds_total{namespace=\"backup-system\", pod=~\"minio.*\"}[5m]) * 100",
                    "legendFormat": "{{pod}}"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent"
                  }
                }
              },
              {
                "title": "MinIO Memory",
                "type": "timeseries",
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 36},
                "targets": [
                  {
                    "expr": "container_memory_working_set_bytes{namespace=\"backup-system\", pod=~\"minio.*\"} / 1024 / 1024",
                    "legendFormat": "{{pod}}"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "MiB"
                  }
                }
              },
              {
                "title": "Backend Logs",
                "type": "logs",
                "gridPos": {"h": 12, "w": 24, "x": 0, "y": 44},
                "targets": [
                  {
                    "expr": "{namespace=\"sveltehr-prod\", pod=~\"sveltehr-backend.*\"}",
                    "refId": "A",
                    "datasource": {"type": "loki", "uid": "${DS_LOKI}"}
                  }
                ],
                "options": {
                  "showTime": true,
                  "wrapLogMessage": true,
                  "enableLogDetails": true,
                  "sortOrder": "Descending"
                }
              },
              {
                "title": "PostgreSQL Logs",
                "type": "logs",
                "gridPos": {"h": 12, "w": 24, "x": 0, "y": 56},
                "targets": [
                  {
                    "expr": "{namespace=\"sveltehr-prod\", pod=~\".*postgres.*\"}",
                    "refId": "A",
                    "datasource": {"type": "loki", "uid": "${DS_LOKI}"}
                  }
                ],
                "options": {
                  "showTime": true,
                  "wrapLogMessage": true,
                  "enableLogDetails": true,
                  "sortOrder": "Descending"
                }
              },
              {
                "title": "Redis Logs",
                "type": "logs",
                "gridPos": {"h": 12, "w": 24, "x": 0, "y": 68},
                "targets": [
                  {
                    "expr": "{namespace=\"sveltehr-prod\", pod=~\".*redis.*\"}",
                    "refId": "A",
                    "datasource": {"type": "loki", "uid": "${DS_LOKI}"}
                  }
                ],
                "options": {
                  "showTime": true,
                  "wrapLogMessage": true,
                  "enableLogDetails": true,
                  "sortOrder": "Descending"
                }
              },
              {
                "title": "Backup System Logs",
                "type": "logs",
                "gridPos": {"h": 12, "w": 24, "x": 0, "y": 80},
                "targets": [
                  {
                    "expr": "{namespace=\"backup-system\", pod=~\"(minio|velero).*\"}",
                    "refId": "A",
                    "datasource": {"type": "loki", "uid": "${DS_LOKI}"}
                  }
                ],
                "options": {
                  "showTime": true,
                  "wrapLogMessage": true,
                  "enableLogDetails": true,
                  "sortOrder": "Descending"
                }
              }
            ]
          }

# Node Exporter
nodeExporter:
  enabled: true

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Kube State Metrics
kubeStateMetrics:
  enabled: true

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Default rules and alerts
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false # Not needed for k3s/minikube
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: false # Can be noisy in dev
    kubeApiserverAvailability: false
    kubeApiserverSlos: false
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
