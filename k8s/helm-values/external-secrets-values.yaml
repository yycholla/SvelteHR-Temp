# External Secrets Operator Configuration
# Manages synchronization of secrets from external secret stores (Doppler, AWS Secrets Manager, etc.)

# Global settings
global:
  # Container image configuration
  image:
    registry: ghcr.io
    repository: external-secrets/external-secrets
    tag: ""  # Use chart default

  # Security context for all pods
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534  # nobody user
    fsGroup: 65534

# Controller settings
replicaCount: 1  # Single replica for small cluster

# Resource limits
resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

# Enable ServiceMonitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

# Webhook configuration
webhook:
  create: true
  # Use chart default port (10250) to avoid conflicts

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # ServiceMonitor for webhook
  serviceMonitor:
    enabled: true
    interval: 30s

# Cert Controller (manages TLS certificates for webhooks)
certController:
  create: true

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # ServiceMonitor for cert controller
  serviceMonitor:
    enabled: true
    interval: 30s

# CRD installation (skip - already installed in cluster)
installCRDs: false

# Concurrent reconciles (parallel secret syncs)
concurrent: 1  # Low concurrency for small cluster

# Log level
logLevel: info  # Options: debug, info, warn, error

# Metrics
metrics:
  service:
    enabled: true
    port: 8080

# Affinity (optional - uncomment for production)
# affinity:
#   podAntiAffinity:
#     preferredDuringSchedulingIgnoredDuringExecution:
#       - weight: 100
#         podAffinityTerm:
#           labelSelector:
#             matchExpressions:
#               - key: app.kubernetes.io/name
#                 operator: In
#                 values:
#                   - external-secrets
#           topologyKey: kubernetes.io/hostname

# Node selector (optional)
# nodeSelector:
#   kubernetes.io/os: linux

# Tolerations (optional)
# tolerations: []

# =============================================================================
# Usage Notes
# =============================================================================
#
# After installation, create a SecretStore or ClusterSecretStore:
#
# Example: Doppler ClusterSecretStore (for Doppler integration)
# ---
# apiVersion: external-secrets.io/v1beta1
# kind: ClusterSecretStore
# metadata:
#   name: doppler
# spec:
#   provider:
#     doppler:
#       auth:
#         secretRef:
#           dopplerToken:
#             name: doppler-token-auth
#             key: dopplerToken
#             namespace: external-secrets
#
# Example: ExternalSecret (sync from Doppler)
# ---
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: sveltehr-secrets
#   namespace: sveltehr-prod
# spec:
#   refreshInterval: 15m
#   secretStoreRef:
#     name: doppler
#     kind: ClusterSecretStore
#   target:
#     name: sveltehr-secrets
#     creationPolicy: Owner
#   dataFrom:
#     - extract:
#         key: sveltehr/prod
#
# =============================================================================
