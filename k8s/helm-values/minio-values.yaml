# MinIO Configuration for Kubernetes Backup Storage
# S3-compatible object storage for Velero backups
# Chart: minio/minio version 5.4.0

# Deployment mode
mode: standalone  # standalone or distributed

# Images use quay.io (more reliable than Docker Hub)
image:
  repository: quay.io/minio/minio
  tag: RELEASE.2024-12-18T13-15-44Z
  pullPolicy: IfNotPresent

# Root credentials from External Secrets (Doppler)
rootUser: ""  # Ignored when existingSecret is set
rootPassword: ""  # Ignored when existingSecret is set
existingSecret: minio-secret  # Created by ExternalSecret
# Secret must contain keys: rootUser, rootPassword

# Persistence
persistence:
  enabled: true
  storageClass: ""  # Use default (local-path)
  size: 100Gi

# Service configuration
service:
  type: ClusterIP
  port: 9000

consoleService:
  type: ClusterIP
  port: 9001

# Resources
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Security context
securityContext:
  enabled: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Buckets to create on startup
buckets:
  - name: velero
    policy: none
    purge: false
  - name: loki
    policy: none
    purge: false
  - name: postgres-backups
    policy: none
    purge: false

# Metrics
metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

# Ingress (disabled)
ingress:
  enabled: false

# =============================================================================
# Velero Service Account Configuration (AUTOMATED)
# =============================================================================
#
# Velero service account is automatically created via Kubernetes Job:
#   - Job: k8s/manifests/backup-system/minio-init-job.yaml
#   - Runs after MinIO deployment (ArgoCD sync wave 1)
#   - Creates service account with credentials from Doppler
#
# Prerequisites (one-time setup):
#   1. Generate secure credentials:
#      VELERO_ACCESS_KEY="velero-$(openssl rand -hex 8)"
#      VELERO_SECRET_KEY="$(openssl rand -base64 32)"
#
#   2. Add to Doppler:
#      VELERO_MINIO_ACCESS_KEY=<access-key>
#      VELERO_MINIO_SECRET_KEY=<secret-key>
#
#   3. ArgoCD will automatically:
#      - Sync ExternalSecrets (minio-init-external-secret.yaml)
#      - Run init job to create service account
#      - Velero will use credentials from velero-credentials secret
#
# Troubleshooting:
#   - Check job status: kubectl get jobs -n backup-system
#   - View job logs: kubectl logs -n backup-system job/minio-init-velero
#   - Manual creation: Access MinIO Console at http://localhost:9001
#     (Port-forward: kubectl port-forward svc/minio-console -n backup-system 9001:9001)
#
# Credential Rotation:
#   1. Generate new credentials and update Doppler
#   2. Delete existing service account in MinIO Console
#   3. Re-run job: kubectl delete job minio-init-velero -n backup-system
#   4. ArgoCD will recreate the job with new credentials
#
# =============================================================================
