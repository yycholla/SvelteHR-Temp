# MinIO Configuration for Kubernetes Backup Storage
# S3-compatible object storage for Velero backups
# Chart: minio/minio version 5.4.0

# Deployment mode
mode: standalone  # standalone or distributed

# Images use quay.io (more reliable than Docker Hub)
image:
  repository: quay.io/minio/minio
  tag: RELEASE.2024-12-18T13-15-44Z
  pullPolicy: IfNotPresent

# Root credentials from External Secrets (Doppler)
rootUser: ""  # Ignored when existingSecret is set
rootPassword: ""  # Ignored when existingSecret is set
existingSecret: minio-secret  # Created by ExternalSecret
# Secret must contain keys: rootUser, rootPassword

# Persistence
persistence:
  enabled: true
  storageClass: ""  # Use default (local-path)
  size: 100Gi

# Service configuration
service:
  type: ClusterIP
  port: 9000

consoleService:
  type: ClusterIP
  port: 9001

# Resources
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Security context
securityContext:
  enabled: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Buckets to create on startup
buckets:
  - name: velero
    policy: none
    purge: false

# Metrics
metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

# Ingress (disabled)
ingress:
  enabled: false

# =============================================================================
# Post-Installation: Velero User Configuration
# =============================================================================
#
# After MinIO is deployed, create Velero service account via MinIO Console:
#
# 1. Port-forward to MinIO Console:
#    kubectl port-forward svc/minio-console -n backup-system 9001:9001
#
# 2. Login at http://localhost:9001
#    Credentials synced from Doppler (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD)
#
# 3. Create Service Account for Velero:
#    - Navigate to: Identity > Service Accounts
#    - Create service account with readwrite policy on velero bucket
#    - Save Access Key and Secret Key
#
# 4. Update Doppler with Velero credentials:
#    VELERO_MINIO_ACCESS_KEY=<access-key>
#    VELERO_MINIO_SECRET_KEY=<secret-key>
#
# =============================================================================
