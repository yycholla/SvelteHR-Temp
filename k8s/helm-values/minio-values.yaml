# MinIO Configuration for Kubernetes Backup Storage
# S3-compatible object storage for Velero backups
# Chart version: 17.x

# Authentication
auth:
  rootUser: admin
  rootPassword: changeme123  # CHANGE IN PRODUCTION!

# Persistence
persistence:
  enabled: true
  storageClass: ""  # Use default storage class (local-path)
  size: 100Gi
  mountPath: /bitnami/minio/data
  accessModes:
    - ReadWriteOnce

# Service configuration
service:
  type: ClusterIP
  ports:
    api: 9000
    console: 9001

# Default buckets (comma-separated list for standalone mode)
defaultBuckets: "velero"

# Deployment mode
mode: standalone  # standalone or distributed

# Resources
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# ServiceMonitor for Prometheus
metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: kube-prometheus-stack

# Security context
podSecurityContext:
  enabled: true
  fsGroup: 1001
  fsGroupChangePolicy: "OnRootMismatch"

containerSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Ingress (disabled)
ingress:
  enabled: false

# =============================================================================
# Post-Installation: Manual Velero User Configuration
# =============================================================================
#
# After MinIO is deployed, create Velero user and policy manually:
#
# 1. Port-forward to MinIO Console:
#    kubectl port-forward svc/minio -n backup-system 9001:9001
#
# 2. Login to MinIO Console at http://localhost:9001
#    Username: admin
#    Password: changeme123
#
# 3. Create Velero service account:
#    - Navigate to: Identity > Service Accounts
#    - Click "Create Service Account"
#    - Name: velero
#    - Policy: readwrite (or create custom policy for "velero" bucket only)
#    - Save Access Key and Secret Key
#
# 4. Update Velero credentials with the generated keys:
#    - Edit velero-values.yaml with the service account credentials
#    - Or create a Kubernetes secret manually
#
# Alternative: Use mc (MinIO Client) CLI:
#    kubectl run mc --image=bitnami/minio-client:latest --rm -it -- /bin/bash
#    mc alias set minio http://minio.backup-system.svc.cluster.local:9000 admin changeme123
#    mc admin user add minio velero VELERO_PASSWORD
#    mc admin policy attach minio readwrite --user velero
#
# =============================================================================
