# Grafana Loki Stack Configuration
# Chart: grafana/loki-stack
# Purpose: Log aggregation with MinIO backend storage

loki:
  enabled: true

  # Use persistent storage for better performance
  persistence:
    enabled: true
    storageClassName: ""  # Use default (local-path)
    size: 10Gi

  # Configuration for Loki
  config:
    auth_enabled: false

    # Ingester configuration
    ingester:
      chunk_idle_period: 3m
      chunk_block_size: 262144
      chunk_retain_period: 1m
      max_transfer_retries: 0
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1

    # Limits configuration
    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h  # 7 days
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20

    # Schema configuration
    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: s3
          schema: v11
          index:
            prefix: loki_index_
            period: 24h

    # Server configuration
    server:
      http_listen_port: 3100

    # Storage configuration - MinIO backend
    storage_config:
      boltdb_shipper:
        active_index_directory: /data/boltdb-shipper-active
        cache_location: /data/boltdb-shipper-cache
        cache_ttl: 24h
        shared_store: s3

      aws:
        s3: http://minio.backup-system.svc.cluster.local:9000/loki
        s3forcepathstyle: true
        bucketnames: loki
        endpoint: minio.backup-system.svc.cluster.local:9000
        access_key_id: ${MINIO_ROOT_USER}
        secret_access_key: ${MINIO_ROOT_PASSWORD}
        insecure: true

    # Table manager configuration
    table_manager:
      retention_deletes_enabled: true
      retention_period: 720h  # 30 days retention

  # Environment variables for MinIO credentials
  env:
    - name: MINIO_ROOT_USER
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: rootUser
    - name: MINIO_ROOT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: rootPassword

  # Resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # ServiceMonitor for Prometheus
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

# Promtail configuration (log shipper)
# DISABLED: Applications will push logs directly to Loki instead of file scraping
# This saves resources and avoids "too many open files" issues
promtail:
  enabled: false

  config:
    # Server configuration
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    # Promtail positions file
    positions:
      filename: /run/promtail/positions.yaml

    # Loki client configuration
    clients:
      - url: http://{{ .Release.Name }}:3100/loki/api/v1/push

    # Scrape configuration
    scrape_configs:
      # Kubernetes pods - limited to important namespaces to avoid "too many open files"
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
                - monitoring
                - backup-system
                - sveltehr-prod
        relabel_configs:
          # Add namespace label
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

          # Add pod name label
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          # Add container name label
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

          # Add app label
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

          # Add app.kubernetes.io/name label
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app_name

  # Resources (reduced CPU request due to node allocation limits)
  resources:
    requests:
      cpu: 50m   # Reduced from 100m to fit within node capacity
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # ServiceMonitor for Prometheus
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

# Grafana configuration (we already have Grafana, so disable)
grafana:
  enabled: false

# Fluent Bit (lightweight log shipper for PostgreSQL and Redis)
fluent-bit:
  enabled: true

  loki:
    serviceName: loki-stack

  config:
    service: |
      [SERVICE]
          Daemon Off
          Flush 1
          Log_Level info
          Parsers_File parsers.conf
          Parsers_File custom_parsers.conf
          HTTP_Server On
          HTTP_Listen 0.0.0.0
          HTTP_Port 2020
          Health_Check On

    inputs: |
      [INPUT]
          Name tail
          Path /var/log/containers/*_sveltehr-prod_*.log
          multiline.parser docker, cri
          Tag kube.*
          Mem_Buf_Limit 5MB
          Skip_Long_Lines On

      [INPUT]
          Name tail
          Path /var/log/containers/*_backup-system_*.log
          multiline.parser docker, cri
          Tag kube.*
          Mem_Buf_Limit 5MB
          Skip_Long_Lines On

    filters: |
      [FILTER]
          Name kubernetes
          Match kube.*
          Kube_URL https://kubernetes.default.svc:443
          Kube_CA_File /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          Kube_Token_File /var/run/secrets/kubernetes.io/serviceaccount/token
          Kube_Tag_Prefix kube.var.log.containers.
          Merge_Log On
          Keep_Log Off
          K8S-Logging.Parser On
          K8S-Logging.Exclude On
          Labels On
          Annotations Off

      [FILTER]
          Name grep
          Match kube.*
          Regex $kubernetes['namespace_name'] (sveltehr-prod|backup-system)

      [FILTER]
          Name grep
          Match kube.*
          Regex $kubernetes['pod_name'] (postgres|redis|minio|velero)

    outputs: |
      [OUTPUT]
          Name loki
          Match kube.*
          Host loki-stack
          Port 3100
          Labels job=fluent-bit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name']
          Auto_Kubernetes_Labels on

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  tolerations:
    - effect: NoSchedule
      operator: Exists

# Log Gateway (disabled for now)
loki-gateway:
  enabled: false
