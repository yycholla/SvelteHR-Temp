# ingress-nginx Helm Values
# https://github.com/kubernetes/ingress-nginx

controller:
  # Service configuration for local development
  service:
    type: NodePort  # Use NodePort for minikube/k3s
    nodePorts:
      http: 30080
      https: 30443

  # Resource limits
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Replica count
  replicaCount: 1

  # Metrics (enabled with Prometheus Operator)
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true  # Creates ServiceMonitor for Prometheus

  # Admission webhooks (optional for dev)
  admissionWebhooks:
    enabled: true
    failurePolicy: Fail

# Default backend
defaultBackend:
  enabled: true
  replicaCount: 1
