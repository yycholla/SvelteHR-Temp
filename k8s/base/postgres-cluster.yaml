---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sveltehr-postgres
  namespace: sveltehr-dev # Will be patched for prod
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:15.6
  instances: 1 # Will be patched to 3 for prod

  # PostgreSQL configuration
  postgresql:
    parameters:
      max_connections: '100'
      shared_buffers: '256MB'
      work_mem: '4MB'
      maintenance_work_mem: '64MB'
      # wal_level is a fixed parameter in CloudNativePG - cannot be overridden
      # It's automatically set to 'logical' for proper replication support
      max_wal_senders: '10'
      max_replication_slots: '10'

  # Storage configuration
  storage:
    size: '10Gi' # Will be patched for prod
    storageClass: local-path # k3s default, will be patched for prod

  # Monitoring
  monitoring:
    enablePodMonitor: true

  # Backup configuration (will be enabled for prod)
  # backup:
  #   barmanObjectStore:
  #     destinationPath: "s3://sveltehr-backups/"
  #     endpointURL: "https://s3.amazonaws.com"
  #     s3Credentials:
  #       accessKeyId:
  #         name: sveltehr-backup-secret
  #         key: ACCESS_KEY_ID
  #       secretAccessKey:
  #         name: sveltehr-backup-secret
  #         key: ACCESS_SECRET_KEY
  #   retentionPolicy: "30d"
  #   schedule: "0 2 * * *"  # Daily at 2 AM

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: hr_system
      owner: hr_user
      secret:
        name: sveltehr-postgres-app-secret

  # Superuser configuration
  superuserSecret:
    name: sveltehr-postgres-superuser-secret

  # Resources
  resources:
    requests:
      memory: '256Mi'
      cpu: '250m'
    limits:
      memory: '512Mi'
      cpu: '500m'
