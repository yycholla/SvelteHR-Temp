---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sveltehr-backend
  namespace: sveltehr-dev # Will be patched for prod
  labels:
    app: sveltehr-backend
    component: graphql-api
spec:
  replicas: 1 # Will be patched for prod
  selector:
    matchLabels:
      app: sveltehr-backend
  template:
    metadata:
      labels:
        app: sveltehr-backend
        component: graphql-api
    spec:
      serviceAccountName: sveltehr-backend-sa # Will be created
      containers:
        - name: graphql-server
          # Server image - migration runs separately as Job
          image: registry.gitlab.com/your-project/sveltehr/backend:latest # Will be patched
          ports:
            - containerPort: 4000
              name: http
          # Build DATABASE_URL and start server directly (no entrypoint needed)
          command: ['/bin/sh', '-c']
          args:
            - |
              export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
              exec ./hr-graphql-server
          env:
            # PostgreSQL connection components
            - name: DB_HOST
              value: 'sveltehr-postgres-rw'
            - name: DB_PORT
              value: '5432'
            - name: DB_NAME
              value: 'hr_system'
            - name: DB_USER
              value: 'hr_user'
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sveltehr-secrets
                  key: postgres-password
            # Legacy POSTGRES_PASSWORD for compatibility
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sveltehr-secrets
                  key: postgres-password
            # Redis connection (using Bitnami Redis service name)
            - name: REDIS_URL
              value: 'redis://redis:6379'
            # JWT and auth secrets
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sveltehr-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: sveltehr-secrets
                  key: jwt-refresh-secret
            - name: SERVICE_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: sveltehr-secrets
                  key: service-auth-key
            # Loki logging configuration
            - name: LOKI_ENABLED
              value: 'true'
            - name: LOKI_URL
              value: 'http://loki-stack.monitoring.svc.cluster.local:3100'
            - name: RUST_LOG
              value: 'info'
          envFrom:
            - configMapRef:
                name: sveltehr-config
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            # readOnlyRootFilesystem removed - Rust apps need write access to /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        fsGroup: 1000
