---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: sveltehr-backend
  namespace: sveltehr-dev # Will be patched for prod
  labels:
    app: sveltehr-backend
    component: graphql-api
spec:
  selector:
    app: sveltehr-backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
  type: ClusterIP

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: sveltehr-frontend
  namespace: sveltehr-dev # Will be patched for prod
  labels:
    app: sveltehr-frontend
    component: web-ui
spec:
  selector:
    app: sveltehr-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP

