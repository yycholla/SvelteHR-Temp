---
# NOTE: This is a template. Actual secrets should be created via:
# kubectl create secret generic sveltehr-secrets --from-literal=postgres-password=... --from-literal=jwt-secret=... etc.
#
# For production, use external secret management (AWS Secrets Manager, etc.)

apiVersion: v1
kind: Secret
metadata:
  name: sveltehr-secrets
  namespace: sveltehr-dev # Will be patched for prod
type: Opaque
data:
  # Base64 encoded values - these are placeholders
  # Generate with: echo -n "your-secret" | base64
  postgres-password: 'cGxhY2Vob2xkZXItcGFzc3dvcmQ=' # placeholder-password
  jwt-secret: 'cGxhY2Vob2xkZXItand0LXNlY3JldA==' # placeholder-jwt-secret
  jwt-refresh-secret: 'cGxhY2Vob2xkZXItand0LXJlZnJlc2g=' # placeholder-jwt-refresh
  service-auth-key: 'cGxhY2Vob2xkZXItc2VydmljZS1hdXRo' # placeholder-service-auth
