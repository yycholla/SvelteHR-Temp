---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sveltehr-frontend
  namespace: sveltehr-dev # Will be patched for prod
  labels:
    app: sveltehr-frontend
    component: web-ui
spec:
  replicas: 1 # Will be patched for prod
  selector:
    matchLabels:
      app: sveltehr-frontend
  template:
    metadata:
      labels:
        app: sveltehr-frontend
        component: web-ui
    spec:
      serviceAccountName: sveltehr-frontend-sa # Will be created
      containers:
        - name: sveltekit-app
          image: registry.gitlab.com/your-project/sveltehr/frontend:latest # Will be patched
          ports:
            - containerPort: 3000 # Production default (SvelteKit build), patched to 5173 for dev
              name: http
          env:
            - name: PUBLIC_API_URL
              value: 'http://sveltehr-backend:4000'
            - name: DB_HOST
              value: 'sveltehr-postgres-rw'
            - name: DB_PORT
              value: '5432'
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sveltehr-secrets
                  key: postgres-password
            - name: SERVICE_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: sveltehr-secrets
                  key: service-auth-key
          envFrom:
            - configMapRef:
                name: sveltehr-config
          resources:
            requests:
              memory: '64Mi'
              cpu: '50m'
            limits:
              memory: '128Mi'
              cpu: '100m'
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true # Production runs as non-root
            runAsUser: 1000
            # readOnlyRootFilesystem removed - Node.js apps need write access to /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/svelte/.npm
            - name: vite-cache
              mountPath: /app/node_modules/.vite
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: vite-cache
          emptyDir: {}
      securityContext:
        fsGroup: 1000
