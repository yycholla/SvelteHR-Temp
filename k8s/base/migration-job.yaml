---
# =============================================================================
# Database Migration Job
# =============================================================================
# Runs SeaORM migrations before backend deployment
# - Executes as Kubernetes Job with restart policy
# - Pre-upgrade/pre-install hook for Helm compatibility
# - Uses dedicated migration container image
# - Requires DATABASE_URL from secrets/config
# =============================================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: sveltehr-migration
  namespace: sveltehr-dev  # Override in overlays
  labels:
    app: sveltehr-migration
    component: database
    part-of: sveltehr
  annotations:
    # Helm hook annotations (if using Helm)
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # Keep successful jobs for debugging, but allow automatic cleanup
  ttlSecondsAfterFinished: 300  # Delete job 5 minutes after completion
  backoffLimit: 3  # Retry up to 3 times on failure

  template:
    metadata:
      labels:
        app: sveltehr-migration
        component: database
        part-of: sveltehr
    spec:
      restartPolicy: OnFailure

      # Service account for database access
      serviceAccountName: sveltehr-backend-sa

      # Init containers to wait for database availability
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h $(DB_HOST) -p $(DB_PORT) -U $(DB_USER); do
                echo "Waiting for PostgreSQL at $(DB_HOST):$(DB_PORT)..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sveltehr-secrets
                  key: DB_PASSWORD

      # Main migration container
      containers:
        - name: migration
          image: registry.gitlab.com/your-project/sveltehr/migration:latest
          imagePullPolicy: Always

          # Migration command
          command:
            - sh
            - -c
            - |
              echo "Starting database migrations..."
              echo "Database: ${DB_NAME}"
              echo "Host: ${DB_HOST}:${DB_PORT}"

              # Run migrations
              ./migration up

              MIGRATION_EXIT_CODE=$?

              if [ $MIGRATION_EXIT_CODE -eq 0 ]; then
                echo "Migrations completed successfully!"
              else
                echo "Migration failed with exit code: $MIGRATION_EXIT_CODE"
                exit $MIGRATION_EXIT_CODE
              fi

          env:
            # Database connection
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sveltehr-secrets
                  key: DB_PASSWORD

            # Construct DATABASE_URL
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"

            # Logging and environment
            - name: RUST_LOG
              value: "info,migration=debug"
            - name: ENVIRONMENT
              value: "production"

          # Resource limits
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL

---
# =============================================================================
# Database Seed Job (Optional - Run separately after initial migration)
# =============================================================================
# Creates initial admin user and seed data
# Run manually with: kubectl create -f migration-job.yaml
# =============================================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: sveltehr-seed
  namespace: sveltehr-dev  # Override in overlays
  labels:
    app: sveltehr-seed
    component: database
    part-of: sveltehr
  annotations:
    # Manual execution only - not a Helm hook
    manual-execution: "true"
spec:
  ttlSecondsAfterFinished: 300  # Delete job 5 minutes after completion
  backoffLimit: 1  # Only retry once - seed data should be idempotent

  template:
    metadata:
      labels:
        app: sveltehr-seed
        component: database
        part-of: sveltehr
    spec:
      restartPolicy: OnFailure

      serviceAccountName: sveltehr-backend-sa

      # Wait for database and migrations
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h $(DB_HOST) -p $(DB_PORT) -U $(DB_USER); do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sveltehr-secrets
                  key: DB_PASSWORD

      # Seed data container
      containers:
        - name: seed
          image: registry.gitlab.com/your-project/sveltehr/seed:latest
          imagePullPolicy: Always

          command:
            - sh
            - -c
            - |
              echo "Starting database seeding..."
              echo "Creating initial admin user and seed data..."

              ./seed-data

              SEED_EXIT_CODE=$?

              if [ $SEED_EXIT_CODE -eq 0 ]; then
                echo "Seed data created successfully!"
              else
                echo "Seed data failed with exit code: $SEED_EXIT_CODE"
                exit $SEED_EXIT_CODE
              fi

          env:
            # Database connection
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: sveltehr-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sveltehr-secrets
                  key: DB_PASSWORD

            # Construct DATABASE_URL
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"

            # Admin credentials (from secrets)
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: sveltehr-secrets
                  key: ADMIN_EMAIL
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sveltehr-secrets
                  key: ADMIN_PASSWORD
                  optional: true

            # Logging
            - name: RUST_LOG
              value: "info,seed_data=debug"
            - name: ENVIRONMENT
              value: "production"

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
