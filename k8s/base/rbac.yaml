  # Allow reading Secrets for credentials
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['get']
  # Allow reading Services for service discovery
  - apiGroups: ['']
    resources: ['services']
    verbs: ['get', 'list']

---
# Frontend RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sveltehr-frontend-rolebinding
  namespace: sveltehr-dev # Will be patched for prod
  labels:
    app: sveltehr-frontend
subjects:
