---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2' # After MinIO (depends on MinIO for S3 backend)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure

  sources:
    # Source 1: Values from Git repository (MUST be first for $values reference)
    - repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
      targetRevision: main
      ref: values

    # Source 2: Helm chart from VMware Tanzu
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 11.1.1 # Match existing installation
      helm:
        releaseName: velero # Match existing Helm release
        valueFiles:
          - $values/k8s/helm-values/velero-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: backup-system # Correct namespace

  syncPolicy:
    # Automated GitOps sync enabled
    automated:
      prune: true # Remove resources deleted from Git
      selfHeal: true # Auto-correct cluster drift
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 3m

  # Ignore Velero's automatic backup CRDs status updates
  ignoreDifferences:
    - group: velero.io
      kind: Backup
      jsonPointers:
        - /status

    - group: velero.io
      kind: Restore
      jsonPointers:
        - /status

  revisionHistoryLimit: 10
