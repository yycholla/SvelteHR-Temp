---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # After MinIO (depends on MinIO for S3 backend)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure

  sources:
    # Source 1: Helm chart from VMware Tanzu
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 7.x  # Latest stable 7.x
      helm:
        valueFiles:
          - $values/k8s/helm-values/velero-values.yaml
    # Source 2: Values from Git repository
    - repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: backup

  syncPolicy:
    # MANUAL SYNC during migration
    automated: null
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 3m

  # Ignore Velero's automatic backup CRDs status updates
  ignoreDifferences:
    - group: velero.io
      kind: Backup
      jsonPointers:
        - /status

    - group: velero.io
      kind: Restore
      jsonPointers:
        - /status

  revisionHistoryLimit: 10
