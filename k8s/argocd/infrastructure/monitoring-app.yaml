---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0' # First - provides CRDs (PodMonitor, ServiceMonitor, etc.)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default # Temporarily use default until repo is added to infrastructure project

  # Multi-source configuration (ArgoCD 2.6+)
  sources:
    # Source 1: Values from Git repository (MUST be first for $values reference)
    - repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
      targetRevision: main
      ref: values

    # Source 2: Helm chart from prometheus-community
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.x
      helm:
        releaseName: kube-prometheus-stack # CRITICAL: Match existing Helm release name
        valueFiles:
          - $values/k8s/helm-values/kube-prometheus-stack-values.yaml

    # Source 3: Additional manifests (Tailscale ingresses, etc.)
    - repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
      targetRevision: main
      path: k8s/manifests/monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    # Automated GitOps sync enabled (as requested)
    automated:
      prune: true # Remove resources deleted from Git
      selfHeal: true # Auto-correct cluster drift
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Better for CRDs and large manifests
      - Replace=false
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

    # Manage orphaned resources during migration
    managedNamespaceMetadata:
      labels:
        managed-by: argocd

  # Ignore differences for common drift scenarios
  ignoreDifferences:
    # Ignore Helm hooks that get modified
    - group: batch
      kind: Job
      jsonPointers:
        - /status

    # Ignore mutating webhook injected CA bundles
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'

    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'

  # Health assessment
  revisionHistoryLimit: 10
