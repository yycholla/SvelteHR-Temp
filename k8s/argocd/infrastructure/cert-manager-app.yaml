---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # After monitoring
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure

  sources:
    # Source 1: Helm chart from jetstack
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.19.1  # Pin specific version
      helm:
        valueFiles:
          - $values/k8s/helm-values/cert-manager-values.yaml
    # Source 2: Values from Git repository
    - repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    # Automated GitOps sync enabled
    automated:
      prune: true  # Remove resources deleted from Git
      selfHeal: true  # Auto-correct cluster drift
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=false  # Important for CRDs
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 3m

  # Ignore webhook CA bundles and injected CA data
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'

    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'

    # Ignore cert-manager injected CA into API services
    - group: apiregistration.k8s.io
      kind: APIService
      jqPathExpressions:
        - '.spec.caBundle'

  revisionHistoryLimit: 10
