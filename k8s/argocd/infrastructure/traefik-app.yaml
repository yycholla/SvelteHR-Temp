---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1' # Deploy with other core infrastructure
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure

  sources:
    # Source 1: Values from Git repository (MUST be first for $values reference)
    - repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
      targetRevision: main
      ref: values

    # Source 2: Helm chart from Traefik
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 37.2.0 # Traefik v3.5.3
      helm:
        releaseName: traefik
        valueFiles:
          - $values/k8s/helm-values/traefik-values.yaml

    # Source 3: Additional manifests (Tailscale ingress for dashboard)
    - repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
      targetRevision: main
      path: k8s/manifests/ingress-traefik

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-traefik # Dedicated namespace for Traefik

  syncPolicy:
    automated:
      prune: true # Remove resources deleted from Git
      selfHeal: true # Auto-correct cluster drift
    syncOptions:
      - CreateNamespace=true # Create ingress-traefik namespace
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 3m

  # Ignore webhook CA bundles
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'

  revisionHistoryLimit: 10
