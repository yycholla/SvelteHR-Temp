---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # After monitoring
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure

  sources:
    # Source 1: Helm chart from Tailscale
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.x  # Use latest stable 1.x
      helm:
        valueFiles:
          - $values/k8s/helm-values/tailscale-operator-values.yaml
    # Source 2: Values from Git repository
    - repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale

  syncPolicy:
    # Automated GitOps sync enabled
    automated:
      prune: true  # Remove resources deleted from Git
      selfHeal: true  # Auto-correct cluster drift
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 3m

  # Ignore webhook CA bundles
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'

    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'

  revisionHistoryLimit: 10
