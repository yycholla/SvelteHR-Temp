---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # After monitoring
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure  # Operator/platform component

  sources:
    # Source 1: Values from Git repository (MUST be first for $values reference)
    - repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
      targetRevision: main
      ref: values

    # Source 2: Helm chart from external-secrets
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.20.4  # Match existing installation version
      helm:
        releaseName: external-secrets  # Match existing Helm release
        skipCrds: false  # Install CRDs for fresh installation
        valueFiles:
          - $values/k8s/helm-values/external-secrets-values.yaml

    # Source 3: Additional manifests (Doppler ClusterSecretStore, ExternalSecrets)
    - repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
      targetRevision: main
      path: k8s/manifests/external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-system  # Existing operator namespace

  syncPolicy:
    # Automated GitOps sync enabled
    automated:
      prune: true  # Remove resources deleted from Git
      selfHeal: true  # Auto-correct cluster drift
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 3m

  # Ignore webhook CA bundles
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'

    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'

  revisionHistoryLimit: 10
