---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # After operators (used for backup storage)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure

  sources:
    # Source 1: Values from Git repository (MUST be first for $values reference)
    - repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
      targetRevision: main
      ref: values

    # Source 2: Helm chart from MinIO official repo
    - repoURL: https://charts.min.io/
      chart: minio
      targetRevision: 5.4.0  # Official MinIO chart
      helm:
        releaseName: minio
        valueFiles:
          - $values/k8s/helm-values/minio-values.yaml

    # Source 3: Additional manifests (Tailscale ingress for console)
    - repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
      targetRevision: main
      path: k8s/manifests/backup-system

  destination:
    server: https://kubernetes.default.svc
    namespace: backup-system  # Correct namespace

  syncPolicy:
    # MANUAL SYNC during migration
    automated: null
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 3m

  revisionHistoryLimit: 10
