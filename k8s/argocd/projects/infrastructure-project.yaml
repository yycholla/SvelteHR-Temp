---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform infrastructure components (operators, monitoring, ingress, backups)

  # Source repositories allowed for this project
  sourceRepos:
    - https://github.com/Mountain-Care-Rx/SvelteHR.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts  # Grafana Loki stack
    - https://cloudnative-pg.github.io/charts
    - https://traefik.github.io/charts
    - https://charts.jetstack.io
    - https://pkgs.tailscale.com/helmcharts
    - https://charts.external-secrets.io
    - https://charts.bitnami.com/bitnami
    - https://charts.min.io/
    - https://vmware-tanzu.github.io/helm-charts
    - https://argoproj.github.io/argo-helm  # ArgoCD Image Updater

  # Destination clusters and namespaces
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: cnpg-system
      server: https://kubernetes.default.svc
    - namespace: ingress-traefik
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: tailscale
      server: https://kubernetes.default.svc
    - namespace: external-secrets-system
      server: https://kubernetes.default.svc
    - namespace: backup-system
      server: https://kubernetes.default.svc
    - namespace: sveltehr-prod
      server: https://kubernetes.default.svc

  # Allow all cluster-scoped resources (operators need CRDs, ClusterRoles, etc.)
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  # Allow all namespace-scoped resources
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  # Orphaned resources settings
  orphanedResources:
    warn: true
