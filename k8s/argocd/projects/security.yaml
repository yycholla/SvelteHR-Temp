---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Security and secrets management infrastructure

  # Source repositories
  sourceRepos:
    - https://github.com/Mountain-Care-Rx/SvelteHR.git
    - https://charts.external-secrets.io

  # Allowed destinations
  destinations:
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: sveltehr-dev
      server: https://kubernetes.default.svc
    - namespace: sveltehr-prod
      server: https://kubernetes.default.svc

  # Cluster-scoped resources (External Secrets needs CRDs, webhooks, etc.)
  clusterResourceWhitelist:
    - group: '*'
      kind: '*' # Allow all cluster resources for operators

  # Namespace-scoped resources
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  # Deny destructive operations on secrets
  namespaceResourceBlacklist: []

  # Orphaned resources
  orphanedResources:
    warn: true

  # Extra security: require manual sync for production secrets
  # syncWindows:
  #   - kind: deny
  #     schedule: '* * * * *'  # Always deny auto-sync
  #     duration: 1h
  #     applications:
  #       - '*-prod'
