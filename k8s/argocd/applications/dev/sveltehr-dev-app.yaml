---
# ArgoCD Application for SvelteHR Development Deployment
# Migrated to new GitOps structure with app-of-apps pattern
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sveltehr-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"  # After infrastructure (wave 0-2)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Use applications AppProject (RBAC and resource restrictions)
  project: applications

  # Source: Git repository containing Helm chart
  source:
    repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
    targetRevision: develop  # Track develop branch for dev environment
    path: k8s/helm-charts/sveltehr
    helm:
      # Use development values
      valueFiles:
        - values.yaml
        - values-dev.yaml

      # Skip CRDs (CloudNativePG operator installed separately)
      skipCrds: true

      # Pass release name and namespace to Helm
      releaseName: sveltehr

      # Optional: Override specific values for testing
      # parameters:
      #   - name: backend.image.tag
      #     value: "develop-latest"
      #   - name: frontend.image.tag
      #     value: "develop-latest"

  # Destination: Where to deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: sveltehr-dev

  # Sync policy: MANUAL SYNC during migration (as requested)
  syncPolicy:
    # Auto-create namespace if it doesn't exist
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

    # MANUAL SYNC (no automated sync during migration)
    # Developers trigger sync manually when ready
    automated: null

    # Retry strategy for failed syncs
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m

  # Ignore differences (prevents constant out-of-sync status)
  ignoreDifferences:
    # Ignore Helm release secrets (managed by Helm)
    - group: ""
      kind: Secret
      name: sh.helm.release.*
      jsonPointers:
        - /data

    # Ignore replicas if HPA manages them
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

    # Ignore CloudNativePG cluster status updates
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /status

  revisionHistoryLimit: 10

# =============================================================================
# Development Environment Notes
# =============================================================================
#
# Deployment:
#   kubectl apply -f k8s/argocd/applications/dev/sveltehr-dev-app.yaml
#
# Manual Sync:
#   argocd app sync sveltehr-dev
#
# Watch Status:
#   argocd app get sveltehr-dev --watch
#
# Delete:
#   argocd app delete sveltehr-dev
#
# Enable Auto-Sync (optional):
#   Change 'automated: null' to:
#   automated:
#     prune: true
#     selfHeal: true
#
# =============================================================================
