---
# ArgoCD Application for SvelteHR Production Deployment
# Migrated to new GitOps structure with app-of-apps pattern
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sveltehr-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"  # After infrastructure (wave 0-2)

    # ===== ArgoCD Image Updater Configuration =====
    # Enable automated GHCR image updates with semantic versioning
    # Use plain semver tags (1.x.x) without v-prefix for compatibility with Masterminds/semver library
    # Semver constraint: ~1.0 allows any 1.x.x version (MAJOR.MINOR fixed, PATCH flexible)
    argocd-image-updater.argoproj.io/image-list: backend=ghcr.io/mountain-care-rx/sveltehr/backend-server:~1.0,frontend=ghcr.io/mountain-care-rx/sveltehr/frontend:~1.0

    # Pull secret configuration (required for private GHCR registry)
    argocd-image-updater.argoproj.io/backend.pull-secret: pullsecret:sveltehr-prod/ghcr-pull-secret
    argocd-image-updater.argoproj.io/frontend.pull-secret: pullsecret:sveltehr-prod/ghcr-pull-secret

    # Update strategies (semver for semantic versioning)
    argocd-image-updater.argoproj.io/backend.update-strategy: semver
    argocd-image-updater.argoproj.io/frontend.update-strategy: semver

    # Semantic version constraints (allow 1.x.x updates without v-prefix)
    argocd-image-updater.argoproj.io/backend.allow-tags: regexp:^1\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/frontend.allow-tags: regexp:^1\.[0-9]+\.[0-9]+$

    # Git write-back configuration
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main

    # Helm values file to update
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:k8s/helm-charts/sveltehr/values-prod.yaml

    # Helm parameter paths for image tags
    argocd-image-updater.argoproj.io/backend.helm.image-name: backend.image.repository
    argocd-image-updater.argoproj.io/backend.helm.image-tag: backend.image.tag
    argocd-image-updater.argoproj.io/frontend.helm.image-name: frontend.image.repository
    argocd-image-updater.argoproj.io/frontend.helm.image-tag: frontend.image.tag

  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Use applications AppProject (RBAC and resource restrictions)
  project: applications

  # Source: Git repository containing Helm chart
  source:
    repoURL: https://github.com/Mountain-Care-Rx/SvelteHR.git
    targetRevision: main  # Track main branch for production
    path: k8s/helm-charts/sveltehr
    helm:
      # Use production values (includes new health probe fixes)
      valueFiles:
        - values.yaml
        - values-prod.yaml

      # Skip CRDs (CloudNativePG operator installed separately)
      skipCrds: true

      # Pass release name and namespace to Helm
      releaseName: sveltehr

      # Optional: Override specific values without committing to Git
      # parameters:
      #   - name: backend.replicaCount
      #     value: "3"

  # Destination: Where to deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: sveltehr-prod

  # Sync policy: MANUAL for production deployments (Image Updater commits to Git)
  syncPolicy:
    # Sync options
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true

    # DISABLED: Automated sync requires manual approval for production
    # Image Updater will commit new tags to Git, but ArgoCD won't auto-sync
    # Operator must manually approve and sync: argocd app sync sveltehr-prod
    automated: null

    # Retry strategy for failed syncs
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore differences (prevents constant out-of-sync status)
  ignoreDifferences:
    # Ignore Helm release secrets (managed by Helm)
    - group: ""
      kind: Secret
      name: sh.helm.release.*
      jsonPointers:
        - /data

    # Ignore replicas if HPA manages them
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

    # Ignore CloudNativePG cluster operator-added defaults (not user-defined fields)
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /status
        - /spec/affinity
        - /spec/bootstrap/initdb/encoding
        - /spec/bootstrap/initdb/localeCType
        - /spec/bootstrap/initdb/localeCollate
        - /spec/enablePDB
        - /spec/enableSuperuserAccess
        - /spec/failoverDelay
        - /spec/logLevel
        - /spec/maxSyncReplicas
        - /spec/minSyncReplicas
        - /spec/postgresGID
        - /spec/postgresUID
        - /spec/monitoring/customQueriesConfigMap
        - /spec/monitoring/disableDefaultQueries
        - /spec/postgresql/syncReplicaElectionConstraint
        - /spec/postgresql/parameters/archive_mode
        - /spec/postgresql/parameters/archive_timeout
        - /spec/postgresql/parameters/dynamic_shared_memory_type
        - /spec/postgresql/parameters/full_page_writes
        - /spec/postgresql/parameters/log_destination
        - /spec/postgresql/parameters/log_directory
        - /spec/postgresql/parameters/log_filename
        - /spec/postgresql/parameters/log_rotation_age
        - /spec/postgresql/parameters/log_rotation_size
        - /spec/postgresql/parameters/log_truncate_on_rotation
        - /spec/postgresql/parameters/logging_collector
        - /spec/postgresql/parameters/max_parallel_workers
        - /spec/postgresql/parameters/max_worker_processes
        - /spec/postgresql/parameters/shared_memory_type
        - /spec/postgresql/parameters/shared_preload_libraries
        - /spec/postgresql/parameters/ssl_max_protocol_version
        - /spec/postgresql/parameters/ssl_min_protocol_version
        - /spec/postgresql/parameters/wal_keep_size
        - /spec/postgresql/parameters/wal_level
        - /spec/postgresql/parameters/wal_log_hints
        - /spec/postgresql/parameters/wal_receiver_timeout
        - /spec/postgresql/parameters/wal_sender_timeout

    # Ignore external-secrets managed secrets
    - group: ''
      kind: Secret
      jsonPointers:
        - /data
      managedFieldsManagers:
        - external-secrets

  revisionHistoryLimit: 10

# =============================================================================
# Production Environment Notes
# =============================================================================
#
# Deployment:
#   kubectl apply -f k8s/argocd/applications/prod/sveltehr-prod-app.yaml
#
# Manual Sync (if needed):
#   argocd app sync sveltehr-prod
#
# Watch Status:
#   argocd app get sveltehr-prod --watch
#
# Rollback to Previous Version:
#   argocd app rollback sveltehr-prod <revision-number>
#   argocd app history sveltehr-prod  # See revision history
#
# Delete (DANGEROUS):
#   argocd app delete sveltehr-prod
#
# Health Check Fix:
#   This deployment includes updated values-prod.yaml with health probe fixes
#   Frontend pod should now run continuously instead of completing immediately
#
# =============================================================================
