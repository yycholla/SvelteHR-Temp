---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base configuration
resources:
  - ../../base

# Namespace override
namespace: sveltehr-dev

# Development-specific patches
patches:
  # File patches
  - path: configmap-dev.yaml
  # ingress-dev.yaml - Commented out due to kernel module issue

  # Frontend Vite dev server patches
  - target:
      kind: Deployment
      name: sveltehr-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 5173
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 5173
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
        value: 90
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
        value: 10
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /health
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 5173
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
        value: 30
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
        value: 30
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/periodSeconds
        value: 10
      - op: replace
        path: /spec/template/spec/containers/0/securityContext/runAsNonRoot
        value: false
      - op: replace
        path: /spec/template/spec/containers/0/securityContext/runAsUser
        value: 0
  - target:
      kind: Service
      name: sveltehr-frontend
    patch: |-
      - op: replace
        path: /spec/ports/0/targetPort
        value: 5173

  # Inline resource limit patches
  - target:
      kind: Deployment
      name: sveltehr-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
  - target:
      kind: Deployment
      name: sveltehr-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "1Gi"  # Vite dev mode needs more memory for initial compilation
            cpu: "200m"
          limits:
            memory: "2Gi"  # Vite + HMR + first compilation can use significant memory
            cpu: "500m"
  - target:
      kind: Cluster
      name: sveltehr-postgres
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
      - op: replace
        path: /spec/storage/size
        value: "5Gi"
  - target:
      kind: RedisFailover
      name: sveltehr-redis
    patch: |-
      - op: replace
        path: /spec/redis/replicas
        value: 1
      - op: replace
        path: /spec/sentinel/replicas
        value: 1
