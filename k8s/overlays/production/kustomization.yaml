---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base configuration
resources:
  - ../../base

# Namespace override
namespace: sveltehr-prod

# Production-specific patches
patches:
  # File patches
  - path: configmap-prod.yaml
  - path: ingress-prod.yaml
  - path: postgres-prod.yaml
  - path: redis-prod.yaml

  # Inline resource limit and scaling patches
  - target:
      kind: Deployment
      name: sveltehr-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
  - target:
      kind: Deployment
      name: sveltehr-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
  - target:
      kind: Cluster
      name: sveltehr-postgres
    patch: |-
      - op: replace
        path: /spec/instances
        value: 3
      - op: replace
        path: /spec/storage/size
        value: "100Gi"
      - op: replace
        path: /spec/storage/storageClass
        value: "fast-ssd"
  - target:
      kind: RedisFailover
      name: sveltehr-redis
    patch: |-
      - op: replace
        path: /spec/redis/replicas
        value: 3
      - op: replace
        path: /spec/sentinel/replicas
        value: 3
      - op: replace
        path: /spec/redis/storage/persistentVolumeClaim/spec/storageClassName
        value: "fast-ssd"
