---
# DaemonSet to increase fs.inotify limits for Promtail
# This runs on every node to set the required kernel parameters
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail-sysctl-tuner
  namespace: monitoring
  labels:
    app: promtail-sysctl-tuner
spec:
  selector:
    matchLabels:
      app: promtail-sysctl-tuner
  template:
    metadata:
      labels:
        app: promtail-sysctl-tuner
    spec:
      hostPID: true
      hostNetwork: true
      initContainers:
        - name: sysctl-tuner
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Increase inotify limits for Promtail file watchers
              sysctl -w fs.inotify.max_user_instances=8192
              sysctl -w fs.inotify.max_user_watches=524288
              sysctl -w fs.file-max=2097152
              echo "Sysctl values set successfully:"
              sysctl fs.inotify.max_user_instances
              sysctl fs.inotify.max_user_watches
              sysctl fs.file-max
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 10m
              memory: 16Mi
      tolerations:
        - operator: Exists
          effect: NoSchedule
