# =============================================================================
# RBAC Configuration Notes
# =============================================================================
#
# Permissions Granted:
#   1. Read ArgoCD Applications (to detect image update annotations)
#   2. Read Secrets in argocd namespace (for Git credentials)
#   3. Read GHCR pull secret in sveltehr-prod namespace (for registry auth)
#   4. Create Events (for status reporting)
#
# Security Considerations:
#   - Minimal permissions following principle of least privilege
#   - Namespace-scoped roles (not ClusterRole) for better isolation
#   - Specific secret name restriction for registry access
#   - No write permissions to Applications (read-only)
#
# Deployment:
#   kubectl apply -f k8s/manifests/argocd/image-updater-rbac.yaml
#
# Verification:
#   kubectl auth can-i get applications --as=system:serviceaccount:argocd:argocd-image-updater -n argocd
#   kubectl auth can-i get secrets --as=system:serviceaccount:argocd:argocd-image-updater -n sveltehr-prod
#
# =============================================================================
