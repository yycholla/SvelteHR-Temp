---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-credentials-external-secret
  namespace: backup-system
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store

  target:
    name: velero-credentials
    creationPolicy: Owner
    template:
      data:
        # Velero expects AWS-style credentials format
        cloud: |
          [default]
          aws_access_key_id={{ .VELERO_MINIO_ACCESS_KEY }}
          aws_secret_access_key={{ .VELERO_MINIO_SECRET_KEY }}

  data:
    - secretKey: VELERO_MINIO_ACCESS_KEY
      remoteRef:
        key: VELERO_MINIO_ACCESS_KEY
    - secretKey: VELERO_MINIO_SECRET_KEY
      remoteRef:
        key: VELERO_MINIO_SECRET_KEY
