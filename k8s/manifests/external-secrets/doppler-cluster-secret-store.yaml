---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler-secret-store
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token-secret
            key: dopplerToken
            namespace: sveltehr-prod
      project: sveltehr
      config: prod
