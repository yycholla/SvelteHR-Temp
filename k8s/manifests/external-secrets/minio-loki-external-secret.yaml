---
# MinIO credentials for Loki in monitoring namespace
# Mirrors the backup-system ExternalSecret pattern
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-loki-external-secret
  namespace: monitoring
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store

  target:
    name: minio-credentials
    creationPolicy: Owner
    template:
      data:
        # Loki expects these key names for MinIO S3 backend
        rootUser: "{{ .MINIO_ROOT_USER }}"
        rootPassword: "{{ .MINIO_ROOT_PASSWORD }}"

  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: MINIO_ROOT_USER
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: MINIO_ROOT_PASSWORD
