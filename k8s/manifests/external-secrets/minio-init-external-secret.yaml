---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-init-external-secret
  namespace: backup-system
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store

  target:
    name: minio-init-secret
    creationPolicy: Owner
    template:
      data:
        # MinIO root credentials for admin operations
        MINIO_ROOT_USER: "{{ .MINIO_ROOT_USER }}"
        MINIO_ROOT_PASSWORD: "{{ .MINIO_ROOT_PASSWORD }}"

        # Velero service account credentials to create
        VELERO_MINIO_ACCESS_KEY: "{{ .VELERO_MINIO_ACCESS_KEY }}"
        VELERO_MINIO_SECRET_KEY: "{{ .VELERO_MINIO_SECRET_KEY }}"

  data:
    # Pull MinIO root credentials
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: MINIO_ROOT_USER
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: MINIO_ROOT_PASSWORD

    # Pull Velero credentials
    - secretKey: VELERO_MINIO_ACCESS_KEY
      remoteRef:
        key: VELERO_MINIO_ACCESS_KEY
    - secretKey: VELERO_MINIO_SECRET_KEY
      remoteRef:
        key: VELERO_MINIO_SECRET_KEY
