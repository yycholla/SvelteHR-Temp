---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console
  namespace: backup-system
  annotations:
    # Tailscale ingress configuration
    tailscale.com/funnel: 'false' # Private Tailnet access only
    tailscale.com/hostname: 'minio-console' # Will be minio-console.your-tailnet.ts.net
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: minio-console
      port:
        number: 9001
  tls:
    - hosts:
        - minio-console
