---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-dashboard
  namespace: ingress-traefik
  annotations:
    # Tailscale ingress configuration
    tailscale.com/funnel: 'false' # Private Tailnet access only
    tailscale.com/hostname: 'traefik' # Will be traefik.your-tailnet.ts.net
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: traefik
      port:
        number: 9000
  tls:
    - hosts:
        - traefik
