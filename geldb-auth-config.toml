[server]
port = 5657
admin-ui = true
# Enable insecure mode for development
security = "insecure_dev_mode"

[auth]
# Enable built-in authentication UI
enabled = true
providers = ["builtin_password"]

[auth.builtin_ui]
enabled = true
app_name = "MountainHR"
redirect_to = "http://localhost:5173/dashboard"
redirect_to_on_signup = "http://localhost:5173/dashboard"

[cors]
enabled = true
allowed_origins = ["http://localhost:5173", "http://localhost:5657"]
allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allowed_headers = ["Content-Type", "Authorization", "X-Requested-With"]