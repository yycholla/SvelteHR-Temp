overwrite: true
schema:
  - './specs/001-develop-mountainhr-frontend/contracts/*.graphql'
  - './specs/003-graphql-we-need/contracts/*.graphql'
  - './specs/006-switch-all-api/contracts/*.graphql'
  - 'http://localhost:5656/db/main/ext/graphql'
documents:
  - 'src/**/*.graphql'
  - 'src/**/*.ts'
  - '!src/lib/generated/**'
generates:
  src/lib/generated/graphql.ts:
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typed-document-node'
    config:
      skipTypename: false
      scalars:
        DateTime: string
        Date: string
        Time: string
        Decimal: number
        JSON: Record<string, any>
        UUID: string
        Upload: File
      namingConvention:
        typeNames: pascal-case#pascalCase
        enumValues: upper-case#upperCase
        fieldNames: camelCase
        variableNames: camelCase
        transformUnderscore: true
      avoidOptionals:
        field: true
        inputValue: false
        object: true
      maybeValue: T | null | undefined
      inputMaybeValue: T | null | undefined
      strictScalars: true
      defaultScalarType: unknown
      useTypeImports: true
  src/lib/generated/resolvers.ts:
    plugins:
      - 'typescript'
      - 'typescript-resolvers'
    config:
      scalars:
        DateTime: string
        Date: string
        Time: string
        Decimal: number
        JSON: Record<string, any>
        UUID: string
        Upload: File
      useIndexSignature: true
      contextType: ../graphql/types#RequestContext
      mappers:
        Employee: ../api/types-v2#Employee
        Department: ../api/types-v2#Department
        User: ../api/types-v2#User
hooks:
  afterOneFileWrite:
    - prettier --write
watch: false
