<!doctype html>
<html>
	<head>
		<title>Debug Remote Connection Issues</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 20px;
			}
			.result {
				margin: 10px 0;
				padding: 10px;
				border-radius: 5px;
			}
			.success {
				background-color: #d4edda;
				border: 1px solid #c3e6cb;
			}
			.error {
				background-color: #f8d7da;
				border: 1px solid #f5c6cb;
			}
			.info {
				background-color: #d1ecf1;
				border: 1px solid #bee5eb;
			}
			.warning {
				background-color: #fff3cd;
				border: 1px solid #ffeaa7;
			}
		</style>
	</head>
	<body>
		<h1>🔍 Debug Remote Connection</h1>
		<p>
			<strong>Current Issue:</strong> CORS error accessing
			https://100.71.207.7/api/v2/auth/rbac/login
		</p>
		<p><strong>Expected URL:</strong> https://100.71.207.7:8443/api/v2/auth/rbac/login</p>

		<button onclick="runDiagnostics()">Run Full Diagnostics</button>
		<button onclick="clearResults()">Clear Results</button>

		<div id="results"></div>

		<script>
			async function runDiagnostics() {
				clearResults();
				addResult('🚀 Starting connection diagnostics...', 'info');

				// Test 1: Check environment variables (frontend config)
				addResult('📋 Frontend Configuration Check:', 'info');
				const expectedUrl = 'https://100.71.207.7:8443/api/v2';
				addResult(`Expected API URL: ${expectedUrl}`, 'info');

				// Test 2: Try different endpoints
				const tests = [
					{ name: 'Direct Backend (HTTP)', url: 'http://localhost:8080/health' },
					{ name: 'Caddy Proxy Port 8443 (HTTPS)', url: 'https://100.71.207.7:8443/health' },
					{ name: 'Default HTTPS Port 443', url: 'https://100.71.207.7/health' },
					{
						name: 'Auth Endpoint (Correct Port)',
						url: 'https://100.71.207.7:8443/api/v2/auth/rbac/login'
					},
					{ name: 'Auth Endpoint (Wrong Port)', url: 'https://100.71.207.7/api/v2/auth/rbac/login' }
				];

				for (const test of tests) {
					await testConnection(test.name, test.url);
					await sleep(500); // Small delay between tests
				}

				// Test 3: Check CORS preflight
				addResult('🔄 Testing CORS Preflight...', 'info');
				await testCORSPreflight();

				addResult('✅ Diagnostics Complete', 'success');
			}

			async function testConnection(testName, url) {
				try {
					addResult(`🔍 Testing: ${testName}`, 'info');
					addResult(`   URL: ${url}`, 'info');

					const controller = new AbortController();
					const timeoutId = setTimeout(() => controller.abort(), 5000);

					const response = await fetch(url, {
						method: 'GET',
						signal: controller.signal
					});

					clearTimeout(timeoutId);

					if (response.ok) {
						const data = await response.text();
						addResult(`✅ ${testName}: SUCCESS (${response.status})`, 'success');
						if (data.length < 200) {
							addResult(`   Response: ${data}`, 'success');
						}
					} else {
						addResult(`❌ ${testName}: HTTP ${response.status} ${response.statusText}`, 'error');
					}
				} catch (error) {
					if (error.name === 'AbortError') {
						addResult(`⏰ ${testName}: TIMEOUT (>5 seconds)`, 'warning');
					} else {
						addResult(`❌ ${testName}: ${error.message}`, 'error');
					}
				}
			}

			async function testCORSPreflight() {
				try {
					const response = await fetch('https://100.71.207.7:8443/api/v2/auth/rbac/login', {
						method: 'OPTIONS',
						headers: {
							Origin: window.location.origin,
							'Access-Control-Request-Method': 'POST',
							'Access-Control-Request-Headers': 'Content-Type'
						}
					});

					if (response.ok) {
						addResult('✅ CORS Preflight: SUCCESS', 'success');
						const corsHeaders = {
							'Access-Control-Allow-Origin': response.headers.get('Access-Control-Allow-Origin'),
							'Access-Control-Allow-Methods': response.headers.get('Access-Control-Allow-Methods'),
							'Access-Control-Allow-Headers': response.headers.get('Access-Control-Allow-Headers')
						};
						addResult(`   CORS Headers: ${JSON.stringify(corsHeaders, null, 2)}`, 'info');
					} else {
						addResult(`❌ CORS Preflight: HTTP ${response.status}`, 'error');
					}
				} catch (error) {
					addResult(`❌ CORS Preflight Error: ${error.message}`, 'error');
				}
			}

			function addResult(message, type) {
				const results = document.getElementById('results');
				const div = document.createElement('div');
				div.className = `result ${type}`;
				div.textContent = message;
				results.appendChild(div);
			}

			function clearResults() {
				document.getElementById('results').innerHTML = '';
			}

			function sleep(ms) {
				return new Promise((resolve) => setTimeout(resolve, ms));
			}

			// Show current page info
			window.onload = function () {
				addResult(`🌐 Current Page: ${window.location.href}`, 'info');
				addResult(`🔧 User Agent: ${navigator.userAgent}`, 'info');
				addResult('Click "Run Full Diagnostics" to test all connections', 'info');
			};
		</script>
	</body>
</html>
