# Document Management GraphQL Operations
# Maps to Rust GraphQL backend (async-graphql + SeaORM)

# =========================================================================
# Document Queries
# =========================================================================

query GetDocuments($limit: Int, $offset: Int) {
  documents(limit: $limit, offset: $offset) {
    id
    title
    description
    categoryId
    filePath
    fileSize
    mimeType
    uploaderId
    accessLevel
    isEncrypted
    expiryDate
    versionNumber
    createdAt
    updatedAt
    deletedAt
  }
}

query GetDocument($id: UUID!) {
  document(id: $id) {
    id
    title
    description
    categoryId
    filePath
    fileSize
    mimeType
    uploaderId
    accessLevel
    isEncrypted
    expiryDate
    versionNumber
    createdAt
    updatedAt
    deletedAt
  }
}

query GetDocumentForPreview($id: UUID!) {
  document(id: $id) {
    id
    title
    description
    mimeType
    fileSize
    uploaderId
    accessLevel
    isEncrypted
    filePath
    createdAt
    encryptedFileStorage {
      id
      encryptedData
      iv
      encryptionKeyId
    }
  }
}

# =========================================================================
# Document Mutations
# =========================================================================

mutation CreateDocument($input: CreateDocumentInput!) {
  createDocument(input: $input) {
    id
    title
    description
    categoryId
    filePath
    fileSize
    mimeType
    uploaderId
    accessLevel
    isEncrypted
    expiryDate
    versionNumber
    createdAt
    updatedAt
  }
}

mutation UpdateDocument($id: UUID!, $input: UpdateDocumentInput!) {
  updateDocument(id: $id, input: $input) {
    id
    title
    description
    categoryId
    filePath
    fileSize
    mimeType
    uploaderId
    accessLevel
    isEncrypted
    expiryDate
    versionNumber
    createdAt
    updatedAt
  }
}

mutation DeleteDocument($id: UUID!) {
  deleteDocument(id: $id)
}

mutation UploadDocument($input: UploadDocumentInput!) {
  uploadDocument(input: $input) {
    id
    title
    description
    categoryId
    filePath
    fileSize
    mimeType
    uploaderId
    accessLevel
    isEncrypted
    expiryDate
    versionNumber
    createdAt
    updatedAt
  }
}

# =========================================================================
# Document Assignment Mutations
# =========================================================================

mutation CreateDocumentAssignment($input: CreateDocumentAssignmentInput!) {
  createDocumentAssignment(input: $input) {
    id
    documentId
    employeeId
    assignedBy
    accessLevel
    assignedAt
    expiresAt
  }
}

mutation DeleteDocumentAssignment($id: UUID!) {
  deleteDocumentAssignment(id: $id)
}

# =========================================================================
# Document Access Log Mutations
# =========================================================================

mutation CreateDocumentAccessLog($input: CreateDocumentAccessLogInput!) {
