# Rollback and Audit GraphQL Operations
# Maps to Rust GraphQL backend rollback mutations and queries

# =========================================================================
# Rollback Mutations
# =========================================================================

mutation ExecuteRollback($rollbackRequestId: UUID!) {
  rollback {
    executeRollback(rollbackRequestId: $rollbackRequestId) {
      success
      message
      activityLogId
      rollbackRequestId
    }
  }
}

mutation CaptureSnapshot($entityType: String!, $entityId: UUID!) {
  rollback {
    captureSnapshot(entityType: $entityType, entityId: $entityId) {
      success
      message
      activityLogId
    }
  }
}

# =========================================================================
# Snapshot Queries
# =========================================================================

query GetSnapshots($entityType: String!, $entityId: UUID!, $limit: Int) {
  rollback {
    snapshots(entityType: $entityType, entityId: $entityId, limit: $limit) {
      id
      userId
      action
      resourceType
      resourceId
      beforeSnapshot
      afterSnapshot
      isRollback
      createdAt
    }
  }
}

query CompareSnapshots($beforeId: UUID!, $afterId: UUID!) {
  rollback {
    compareSnapshots(input: { beforeId: $beforeId, afterId: $afterId }) {
      identical
      differences
    }
  }
}

# =========================================================================
# Activity Log Queries (existing, for reference)
# =========================================================================

query GetActivityLogs($userId: UUID, $limit: Int, $offset: Int) {
  activityLogs(userId: $userId, limit: $limit, offset: $offset) {
    nodes {
      id
      userId
      employeeId
      action
      resourceType
      resourceId
      details
      beforeSnapshot
      afterSnapshot
      isRollback
      rolledBackLogId
      ipAddress
      userAgent
      createdAt
    }
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}
