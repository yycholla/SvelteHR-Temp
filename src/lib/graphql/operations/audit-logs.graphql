# Audit Logs GraphQL Operations
# Feature: 020-we-need-to (Comprehensive Audit Logging with Rollback)
# Task: T044
# Created: 2025-10-02
#
# Queries and mutations for audit log management with filtering, pagination, and rollback operations.

# ===== QUERIES =====

# Query: Get paginated audit logs with advanced filtering
query GetAuditLogs(
	$first: Int
	$offset: Int
	$orderBy: [ActivityLogsOrderBy!]
	$condition: ActivityLogCondition
	$filter: ActivityLogFilter
) {
	activityLogs(
		first: $first
		offset: $offset
		orderBy: $orderBy
		condition: $condition
		filter: $filter
	) {
		nodes {
			id
			employeeId
			action
			resourceType
			resourceId
			beforeSnapshot
			afterSnapshot
			isRollback
			rolledBackLogId
			createdAt
			ipAddress
			userAgent
			employee {
				id
				fullName
				email
				department {
					id
					name
				}
			}
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
	}
}

# Query: Get single audit log by ID with full details
query GetAuditLogById($id: UUID!) {
	activityLog(id: $id) {
		id
		employeeId
		action
		resourceType
		resourceId
		beforeSnapshot
		afterSnapshot
		isRollback
		rolledBackLogId
		createdAt
		ipAddress
		userAgent
		employee {
			id
			fullName
			email
			role
			department {
				id
				name
			}
		}
		rolledBackLog {
			id
			action
			resourceType
			resourceId
			createdAt
			employee {
				id
				fullName
			}
		}
	}
}

# Query: Get audit logs by resource
query GetAuditLogsByResource($resourceType: String!, $resourceId: UUID!, $first: Int) {
	activityLogs(
		condition: { resourceType: $resourceType, resourceId: $resourceId }
		orderBy: CREATED_AT_DESC
		first: $first
	) {
		nodes {
			id
			employeeId
			action
			beforeSnapshot
			afterSnapshot
			isRollback
			rolledBackLogId
			createdAt
			employee {
				id
				fullName
			}
		}
		totalCount
	}
}

# Query: Get audit logs by employee
query GetAuditLogsByEmployee($employeeId: UUID!, $first: Int, $offset: Int) {
	activityLogs(
		condition: { employeeId: $employeeId }
		orderBy: CREATED_AT_DESC
		first: $first
		offset: $offset
	) {
		nodes {
			id
			action
			resourceType
			resourceId
			isRollback
			rolledBackLogId
			createdAt
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
		}
	}
}

# Query: Get audit logs by date range
query GetAuditLogsByDateRange(
	$startDate: Datetime!
	$endDate: Datetime!
	$first: Int
	$offset: Int
) {
	activityLogs(
		filter: { createdAt: { greaterThanOrEqualTo: $startDate, lessThanOrEqualTo: $endDate } }
		orderBy: CREATED_AT_DESC
		first: $first
		offset: $offset
	) {
		nodes {
			id
			employeeId
			action
			resourceType
			resourceId
			isRollback
			createdAt
			employee {
				id
				fullName
			}
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
		}
	}
}

# Query: Get rollback operations only
query GetRollbackLogs($first: Int, $offset: Int) {
	activityLogs(
		condition: { isRollback: true }
		orderBy: CREATED_AT_DESC
		first: $first
		offset: $offset
	) {
		nodes {
			id
			employeeId
			action
			resourceType
			resourceId
			rolledBackLogId
			createdAt
			employee {
				id
				fullName
				role
			}
			rolledBackLog {
				id
				action
				resourceType
				resourceId
				createdAt
			}
		}
		totalCount
		pageInfo {
			hasNextPage
			hasPreviousPage
		}
	}
}

# Query: Get activity log statistics
query GetAuditLogStatistics {
	activityLogsStatistics {
		totalCount
		createCount
		readCount
		updateCount
		deleteCount
		rollbackCount
		todayCount
		last7DaysCount
		last30DaysCount
		topEmployees {
			employeeId
			fullName
			activityCount
		}
		topResourceTypes {
			resourceType
			count
		}
	}
}

# ===== MUTATIONS =====

# Mutation: Execute single rollback (already defined in rollback-execution.graphql)
# This is a reference for completeness - actual mutation is in T033 service file
mutation ExecuteRollback($input: ExecuteRollbackInput!) {
	executeRollback(input: $input) {
		success
		newLogId
		conflicts {
			hasConflicts
			conflictFields
			conflicts {
				field
				currentValue
				targetValue
				conflictType
			}
		}
		error
	}
}

# Mutation: Create rollback request (for approval workflow)
mutation CreateRollbackRequest($input: CreateRollbackRequestInput!) {
	createRollbackRequest(input: $input) {
		rollbackRequest {
			id
			activityLogId
			requesterId
			reason
			status
			createdAt
		}
	}
}

# Mutation: Delete old audit logs (admin only)
mutation DeleteOldAuditLogs($input: DeleteOldAuditLogsInput!) {
	deleteOldAuditLogs(input: $input) {
		deletedCount
		success
		error
	}
}

# Mutation: Export audit logs (generates CSV)
mutation ExportAuditLogs($input: ExportAuditLogsInput!) {
	exportAuditLogs(input: $input) {
		downloadUrl
		expiresAt
		success
		error
	}
}

# ===== SUBSCRIPTIONS =====

# Subscription: Real-time audit log updates
subscription OnAuditLogCreated {
	auditLogCreated {
		id
		employeeId
		action
		resourceType
		resourceId
		isRollback
		createdAt
		employee {
			id
			fullName
		}
	}
}

# Subscription: Real-time rollback updates
subscription OnRollbackExecuted {
	rollbackExecuted {
		id
		newLogId
		success
		employeeId
		employee {
			fullName
		}
	}
}
