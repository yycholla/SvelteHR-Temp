# Department Management GraphQL Contract
# Operations for /dashboard/teams page (Admin)

# Query: Get all departments with statistics
query GetAllDepartments($first: Int, $offset: Int, $searchTerm: String) {
  departments(
    filter: {
      name: $searchTerm ? { includesInsensitive: $searchTerm } : null
    }
    orderBy: NAME_ASC
    first: $first
    offset: $offset
  ) {
    nodes {
      id
      name
      description
      departmentHead {
        id
        displayName
        email
      }
      employees {
        totalCount
      }
      activeEmployees: employees(condition: { isActive: true }) {
        totalCount
      }
      createdAt
      updatedAt
    }
    totalCount
  }
}

# Mutation: Create new department
mutation CreateDepartment($input: CreateDepartmentInput!) {
  createDepartment(input: $input) {
    department {
      id
      name
      description
      departmentHead {
        displayName
      }
    }
    clientMutationId
  }
}

input CreateDepartmentInput {
  clientMutationId: String
  department: DepartmentInput!
}

input DepartmentInput {
  name: String!
  description: String
  parentDepartmentId: UUID
  departmentHeadId: UUID
}

# Mutation: Update department
mutation UpdateDepartment($input: UpdateDepartmentInput!) {
  updateDepartment(input: $input) {
    department {
      id
      name
      description
      departmentHead {
        displayName
      }
      updatedAt
    }
    clientMutationId
  }
}

input UpdateDepartmentInput {
  clientMutationId: String
  id: UUID!
  patch: DepartmentPatch!
}

input DepartmentPatch {
  name: String
  description: String
  parentDepartmentId: UUID
  departmentHeadId: UUID
}