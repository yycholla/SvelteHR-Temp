# GraphQL Schema Contract - Performance Reviews Creation
# Feature: 023-reviews-creation-it
# Date: 2025-10-06

"""
Review type categories for different evaluation purposes
"""
enum ReviewType {
  ANNUAL_REVIEW
  MID_YEAR_REVIEW
  QUARTERLY_REVIEW
  PROBATIONARY_REVIEW
  PERFORMANCE_IMPROVEMENT_PLAN
  NINETY_DAY_REVIEW
  PROJECT_BASED_REVIEW
  PROMOTION_REVIEW
  EXIT_REVIEW
  SELF_REVIEW
}

"""
Review lifecycle status
"""
enum ReviewStatus {
  DRAFT
  IN_PROGRESS
  COMPLETED
}

"""
Goal lifecycle status
"""
enum GoalStatus {
  ACTIVE
  ACHIEVED
  MISSED
  CANCELLED
  DELETED
}

"""
Performance review entity
"""
type PerformanceReview {
  id: ID!
  employeeId: ID!
  reviewerId: ID!
  reviewType: ReviewType!
  status: ReviewStatus!
  reviewPeriodStart: Date
  reviewPeriodEnd: Date
  notes: String
  overallRating: Int
  createdAt: DateTime!
  updatedAt: DateTime!
  completedAt: DateTime

  # Relations
  employee: User!
  reviewer: User!
  goals: [Goal!]!
}

"""
Performance goal entity
"""
type Goal {
  id: ID!
  employeeId: ID!
  title: String!
  description: String!
  targetCompletionDate: Date!
  actualCompletionDate: Date
  status: GoalStatus!
  successMetrics: String!
  progressPercentage: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  deleted: Boolean!
  deletedAt: DateTime

  # Relations
  employee: User!
  reviews: [PerformanceReview!]!
}

"""
Input for creating a new goal within a review
"""
input NewGoalInput {
  title: String!
  description: String!
  targetCompletionDate: Date!
  successMetrics: String!
}

"""
Input for creating a performance review with goals
"""
input CreateReviewInput {
  employeeId: ID!
  reviewType: ReviewType!
  reviewPeriodStart: Date
  reviewPeriodEnd: Date
  goalIds: [ID!]!
  newGoals: [NewGoalInput!]!
  notes: String
}

"""
Input for updating a draft review
"""
input UpdateReviewDraftInput {
  id: ID!
  reviewType: ReviewType
  reviewPeriodStart: Date
  reviewPeriodEnd: Date
  notes: String
}

"""
Input for linking an existing goal to a review
"""
input LinkGoalToReviewInput {
  reviewId: ID!
  goalId: ID!
}

"""
Response for review creation/update operations
"""
type ReviewMutationResponse {
  success: Boolean!
  message: String
  review: PerformanceReview
}

"""
Response for goal operations
"""
type GoalMutationResponse {
  success: Boolean!
  message: String
  goal: Goal
}

"""
Filter input for querying reviews
"""
input ReviewFilter {
  employeeId: ID
  reviewerId: ID
  reviewType: ReviewType
  status: ReviewStatus
  statusIn: [ReviewStatus!]
}

"""
Filter input for querying goals
"""
input GoalFilter {
  employeeId: ID
  status: GoalStatus
  deleted: Boolean
}

type Query {
  """
  Get a single performance review by ID
  """
  performanceReview(id: ID!): PerformanceReview

  """
  List performance reviews with optional filters
  """
  performanceReviews(
    filter: ReviewFilter
    limit: Int = 20
    offset: Int = 0
  ): [PerformanceReview!]!

  """
  Get active reviews for an employee (for duplicate checking)
  """
  activeReviewsForEmployee(
    employeeId: ID!
    reviewType: ReviewType
  ): [PerformanceReview!]!

  """
  Get goals for an employee (excludes deleted by default)
  """
  employeeGoals(
    employeeId: ID!
    includeDeleted: Boolean = false
  ): [Goal!]!

  """
  Get direct reports for a manager (for RBAC validation)
  """
  directReports(managerId: ID!): [User!]!

  """
  Check if employee is a direct report of manager
  """
  isDirectReport(
    employeeId: ID!
    managerId: ID!
  ): Boolean!

  """
  Get review type metadata
  """
  reviewTypes: [ReviewTypeMetadata!]!
}

type Mutation {
  """
  Create a new performance review with associated goals
  Transaction includes:
  1. Validate manager-employee relationship (if manager role)
  2. Check for duplicate active reviews
  3. Create review record
  4. Create new goals if provided
  5. Link goals to review
  """
  createReviewWithGoals(
    input: CreateReviewInput!
  ): ReviewMutationResponse!

  """
  Update a draft review (only works if status = DRAFT)
  """
  updateReviewDraft(
    input: UpdateReviewDraftInput!
  ): ReviewMutationResponse!

  """
  Link an existing goal to a review
  """
  linkGoalToReview(
    input: LinkGoalToReviewInput!
  ): ReviewMutationResponse!

  """
  Unlink a goal from a review
  """
  unlinkGoalFromReview(
    reviewId: ID!
    goalId: ID!
  ): ReviewMutationResponse!

  """
  Create a standalone goal (not tied to review)
  """
  createGoal(
    employeeId: ID!
    title: String!
    description: String!
    targetCompletionDate: Date!
    successMetrics: String!
  ): GoalMutationResponse!

  """
  Soft delete a goal (sets deleted flag, preserves in reviews)
  """
  softDeleteGoal(id: ID!): GoalMutationResponse!

  """
  Update review status (draft → in_progress → completed)
  """
  updateReviewStatus(
    id: ID!
    status: ReviewStatus!
  ): ReviewMutationResponse!
}

"""
Review type metadata for UI dropdowns
"""
type ReviewTypeMetadata {
  value: ReviewType!
  label: String!
  description: String!
  displayOrder: Int!
}

"""
Custom scalar for Date (YYYY-MM-DD)
"""
scalar Date

"""
Custom scalar for DateTime (ISO 8601)
"""
scalar DateTime
