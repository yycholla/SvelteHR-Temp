# GraphQL Operations Contract: Audit Logging with Rollback
# Feature: 020-we-need-to
# Date: 2025-10-02

# ============================================
# Queries
# ============================================

# Query 1: Get paginated activity logs with filtering
query GetActivityLogs(
  $first: Int!
  $offset: Int!
  $employeeId: UUID
  $action: ActivityAction
  $resourceType: String
  $startDate: DateTime
  $endDate: DateTime
  $searchQuery: String
) {
  activityLogs(
    first: $first
    offset: $offset
    condition: {
      employeeId: $employeeId
      action: $action
      resourceType: $resourceType
    }
    filter: {
      createdAt: { greaterThanOrEqualTo: $startDate, lessThanOrEqualTo: $endDate }
      reason: { includesInsensitive: $searchQuery }
    }
    orderBy: CREATED_AT_DESC
  ) {
    nodes {
      id
      employeeId
      employee {
        id
        displayName
        department {
          id
          name
        }
      }
      action
      resourceType
      resourceId
      beforeSnapshot
      afterSnapshot
      ipAddress
      userAgent
      reason
      isRollback
      rolledBackLogId
      createdAt
    }
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
  }
}

# Query 2: Get single activity log with full details
query GetActivityLog($id: UUID!) {
  activityLogById(id: $id) {
    id
    employeeId
    employee {
      id
      displayName
      email
      department {
        id
        name
      }
    }
    action
    resourceType
    resourceId
    beforeSnapshot
    afterSnapshot
    ipAddress
    userAgent
    reason
    isRollback
    rolledBackLogId
    rolledBackLog {
      id
      action
      resourceType
      createdAt
    }
    createdAt
  }
}

# Query 3: Get pending rollback requests (super admin only)
query GetPendingRollbackRequests($first: Int!, $offset: Int!) {
  rollbackRequests(
    first: $first
    offset: $offset
    condition: { status: PENDING }
    orderBy: REQUESTED_AT_DESC
  ) {
    nodes {
      id
      activityLogId
      activityLog {
        id
        action
        resourceType
        resourceId
        beforeSnapshot
        createdAt
        employee {
          id
          displayName
        }
      }
      requestedBy
      requester {
        id
        displayName
        department {
          id
          name
        }
      }
      requestedAt
      reason
      status
    }
    totalCount
  }
}

# Query 4: Get user's own rollback requests (admin)
query GetMyRollbackRequests($userId: UUID!, $first: Int!, $offset: Int!) {
  rollbackRequests(
    first: $first
    offset: $offset
    condition: { requestedBy: $userId }
    orderBy: REQUESTED_AT_DESC
  ) {
    nodes {
      id
      activityLogId
      activityLog {
        id
        action
        resourceType
        resourceId
        createdAt
      }
      requestedAt
      reason
      status
      reviewedBy
      reviewer {
        id
        displayName
      }
      reviewedAt
      reviewReason
    }
    totalCount
  }
}

# Query 5: Get bulk rollback batch status
query GetBulkRollbackBatch($id: UUID!) {
  bulkRollbackBatchById(id: $id) {
    id
    initiatedBy
    initiator {
      id
      displayName
    }
    activityLogIds
    startedAt
    completedAt
    status
    totalCount
    processedCount
    successfulCount
    failedCount
    failureDetails
  }
}

# Query 6: Get activity logs for a specific resource
query GetResourceActivityLogs(
  $resourceType: String!
  $resourceId: UUID!
  $first: Int!
) {
  activityLogs(
    first: $first
    condition: { resourceType: $resourceType, resourceId: $resourceId }
    orderBy: CREATED_AT_DESC
  ) {
    nodes {
      id
      employeeId
      employee {
        id
        displayName
      }
      action
      beforeSnapshot
      afterSnapshot
      reason
      isRollback
      createdAt
    }
    totalCount
  }
}

# Query 7: Get activity log statistics
query GetActivityLogStats($startDate: DateTime!, $endDate: DateTime!) {
  activityLogs(
    filter: {
      createdAt: { greaterThanOrEqualTo: $startDate, lessThanOrEqualTo: $endDate }
    }
  ) {
    totalCount
    groupedByAction: aggregates {
      action
      count
    }
    groupedByResourceType: aggregates {
      resourceType
      count
    }
  }
}

# ============================================
# Mutations
# ============================================

# Mutation 1: Create activity log (internal - called by logging service)
mutation CreateActivityLog($input: CreateActivityLogInput!) {
  createActivityLog(input: $input) {
    activityLog {
      id
      employeeId
      action
      resourceType
      resourceId
      createdAt
    }
  }
}

# Mutation 2: Request rollback (admin)
mutation RequestRollback($input: CreateRollbackRequestInput!) {
  createRollbackRequest(input: $input) {
    rollbackRequest {
      id
      activityLogId
      requestedBy
      requestedAt
      reason
      status
    }
  }
}

# Mutation 3: Execute rollback (super admin only)
mutation ExecuteRollback($logId: UUID!, $reason: String!) {
  executeRollback(input: { logId: $logId, reason: $reason }) {
    success
    newActivityLogId
    errors
    conflictDetails {
      hasConflicts
      conflictFields
      currentState
      targetState
    }
  }
}

# Mutation 4: Approve rollback request (super admin only)
mutation ApproveRollbackRequest($requestId: UUID!, $reviewReason: String) {
  approveRollbackRequest(input: { requestId: $requestId, reviewReason: $reviewReason }) {
    rollbackRequest {
      id
      status
      reviewedBy
      reviewedAt
      reviewReason
    }
    rollbackSuccess
    newActivityLogId
    errors
  }
}

# Mutation 5: Reject rollback request (super admin only)
mutation RejectRollbackRequest($requestId: UUID!, $reviewReason: String!) {
  rejectRollbackRequest(input: { requestId: $requestId, reviewReason: $reviewReason }) {
    rollbackRequest {
      id
      status
      reviewedBy
      reviewedAt
      reviewReason
    }
  }
}

# Mutation 6: Create bulk rollback batch (super admin only)
mutation CreateBulkRollbackBatch($input: CreateBulkRollbackBatchInput!) {
  createBulkRollbackBatch(input: $input) {
    bulkRollbackBatch {
      id
      initiatedBy
      activityLogIds
      startedAt
      status
      totalCount
    }
  }
}

# Mutation 7: Cancel bulk rollback batch (super admin only)
mutation CancelBulkRollbackBatch($batchId: UUID!) {
  cancelBulkRollbackBatch(input: { batchId: $batchId }) {
    success
    message
  }
}

# ============================================
# Subscriptions (optional for real-time updates)
# ============================================

# Subscription 1: Watch bulk rollback progress
subscription WatchBulkRollbackProgress($batchId: UUID!) {
  bulkRollbackProgress(batchId: $batchId) {
    batchId
    status
    processedCount
    successfulCount
    failedCount
    currentLogId
    lastError
  }
}

# Subscription 2: Watch new rollback requests (super admin only)
subscription WatchNewRollbackRequests {
  rollbackRequestCreated {
    id
    activityLogId
    requestedBy
    requester {
      id
      displayName
    }
    requestedAt
    reason
  }
}

# ============================================
# Input Types
# ============================================

input CreateActivityLogInput {
  employeeId: UUID!
  action: ActivityAction!
  resourceType: String!
  resourceId: UUID!
  beforeSnapshot: JSON
  afterSnapshot: JSON
  ipAddress: String
  userAgent: String
  reason: String
  isRollback: Boolean
  rolledBackLogId: UUID
}

input CreateRollbackRequestInput {
  activityLogId: UUID!
  requestedBy: UUID!
  reason: String!
}

input CreateBulkRollbackBatchInput {
  initiatedBy: UUID!
  activityLogIds: [UUID!]!
  reason: String!
}

# ============================================
# Custom Scalar Types
# ============================================

scalar UUID
scalar DateTime
scalar JSON
