# Standardized GraphQL Operation Contracts
# SvelteHR GraphQL Integration Error Resolution

# Dashboard Operations Contract
# Fixes parameter mismatch issues identified in dashboard integration

"""
Get complete dashboard data with standardized error handling
Input: User ID and role for permission-based data filtering
Output: Dashboard metrics, activities, tasks, and events
Error Handling: Timeout (5s), Retries (3), Detailed error messages
"""
query GetCompleteDashboardData($userId: String!, $userRole: String!) {
  dashboardData: getDashboardData(userId: $userId, userRole: $userRole) {
    metrics {
      attendanceRate: Float!
      pendingRequests: Int!
      taskCount: Int!
      remainingVacationDays: Int!
    }
    user {
      id: String!
      displayName: String!
      role: String!
      department: String
      profileImage: String
    }
    activities {
      id: String!
      type: String!
      message: String!
      timestamp: String!
      severity: String!
    }
    tasks {
      id: String!
      title: String!
      status: String!
      dueDate: String
      priority: String!
    }
    upcomingEvents {
      id: String!
      title: String!
      type: String!
      time: String!
      location: String
    }
  }
}

# User Authentication and Session Management Contract
# Handles JWT token validation and user context

"""
Verify current user authentication status
Input: JWT token from client storage
Output: User data with roles and permissions
Error Handling: Clear auth errors, redirect instructions
"""
query VerifyUserAuthentication {
  currentUser {
    id: String!
    email: String!
    displayName: String!
    role: String!
    permissions: [String!]!
    isActive: Boolean!
    lastLogin: String
    profileImage: String
    department {
      id: String!
      name: String!
    }
  }
  authStatus {
    isAuthenticated: Boolean!
    tokenExpiry: String
    needsRefresh: Boolean!
    sessionId: String!
  }
}

# Employee Data Management Contract
# Standardized employee queries with RBAC

"""
Get employees list with pagination and filtering
Input: Pagination params, filter criteria, user permissions
Output: Paginated employee list with metadata
Error Handling: Permission checks, data validation
"""
query GetEmployees(
  $limit: Int = 20
  $offset: Int = 0
  $filter: EmployeeFilter
  $sortBy: String = "displayName"
  $sortDirection: String = "asc"
) {
  employees: getEmployees(
    limit: $limit
    offset: $offset
    filter: $filter
    sortBy: $sortBy
    sortDirection: $sortDirection
  ) {
    totalCount: Int!
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
    data: [Employee!]! {
      id: String!
      email: String!
      displayName: String!
      role: String!
      department: String!
      isActive: Boolean!
      startDate: String!
      profileImage: String
      contactInfo {
        phone: String
        address: String
      }
    }
  }
  pagination {
    currentPage: Int!
    totalPages: Int!
    totalItems: Int!
    itemsPerPage: Int!
  }
}

# Department Management Contract
# Department queries with hierarchical permissions

"""
Get department information with employee counts
Input: Department filters, user access level
Output: Department list with metadata
Error Handling: Access control, data consistency
"""
query GetDepartments($includeEmployeeCount: Boolean = true) {
  departments: getDepartments(includeEmployeeCount: $includeEmployeeCount) {
    id: String!
    name: String!
    description: String
    managerId: String
    manager {
      id: String!
      displayName: String!
      email: String!
    }
    employeeCount: Int @include(if: $includeEmployeeCount)
    isActive: Boolean!
    createdAt: String!
  }
}

# Error Handling and Retry Operations Contract
# Standardized error recovery patterns

"""
Retry failed operation with exponential backoff
Input: Original operation details, retry attempt number
Output: Success status or error details for next retry
Error Handling: Max 3 retries, user feedback, logging
"""
mutation RetryFailedOperation(
  $operationId: String!
  $operationName: String!
  $originalVariables: JSON!
  $retryAttempt: Int!
  $userId: String!
) {
  retryResult: retryOperation(
    operationId: $operationId
    operationName: $operationName
    originalVariables: $originalVariables
    retryAttempt: $retryAttempt
    userId: $userId
  ) {
    success: Boolean!
    data: JSON
    error {
      code: String!
      message: String!
      userMessage: String!
      technicalDetails: String!
      suggestedActions: [String!]!
      isRetryable: Boolean!
      retryAfter: Int
    }
    retryInfo {
      attemptsRemaining: Int!
      nextRetryDelay: Int!
      maxRetries: Int!
    }
  }
}

# Cache Invalidation Contract
# Manage 30-minute cache TTL with invalidation

"""
Invalidate cached data for specific operations
Input: Cache keys, invalidation scope, user context
Output: Invalidation status and affected operations
Error Handling: Graceful degradation if cache unavailable
"""
mutation InvalidateCache(
  $cacheKeys: [String!]!
  $scope: String! # "user", "department", "global"
  $userId: String!
  $reason: String!
) {
  cacheInvalidation: invalidateCache(
    cacheKeys: $cacheKeys
    scope: $scope
    userId: $userId
    reason: $reason
  ) {
    success: Boolean!
    invalidatedKeys: [String!]!
    affectedOperations: [String!]!
    timestamp: String!
    nextRefreshAt: String!
  }
}

# Input Types for Filtering and Parameters

input EmployeeFilter {
  department: String
  role: String
  isActive: Boolean
  startDateAfter: String
  startDateBefore: String
  searchTerm: String
}

input CachePolicy {
  ttlMinutes: Int! # Max 30 minutes
  invalidateOnChange: Boolean!
  staleWhileRevalidate: Boolean!
}

# Subscription Contract (if PostGraphile WebSocket support added)
# Real-time updates for dashboard data

"""
Subscribe to dashboard data changes
Input: User ID for permission filtering
Output: Real-time dashboard updates
Error Handling: Connection resilience, auth validation
"""
subscription DashboardDataUpdates($userId: String!) {
  dashboardUpdates: subscribeToDashboardChanges(userId: $userId) {
    type: String! # "metrics", "activities", "tasks", "events"
    data: JSON!
    timestamp: String!
    affectedUserId: String!
    operation: String! # "create", "update", "delete"
  }
}

# Error Response Types
# Standardized error structure across all operations

type GraphQLError {
  code: String! # "TIMEOUT", "NETWORK_ERROR", "AUTH_FAILED", "PERMISSION_DENIED", "VALIDATION_ERROR"
  message: String! # Technical error message
  userMessage: String! # User-friendly message
  technicalDetails: String! # Debug information
  suggestedActions: [ActionOption!]! # Recovery actions
  timestamp: String!
  severity: ErrorSeverity! # "LOW", "MEDIUM", "HIGH", "CRITICAL"
  isRetryable: Boolean!
  retryAfter: Int # Seconds to wait before retry
  operationId: String! # For tracking and debugging
}

type ActionOption {
  label: String! # "Try Again", "Contact Support", "Go Back"
  action: String! # "retry", "contact_admin", "go_back", "refresh"
  isPrimary: Boolean!
  parameters: JSON
}

enum ErrorSeverity {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}