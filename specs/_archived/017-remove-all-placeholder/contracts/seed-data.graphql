"""
Seed Data Management Schema
For generating and managing test data
"""

type Query {
  """Check if seed data exists"""
  seedDataStatus: SeedDataStatus!

  """Get seed data configuration"""
  seedDataConfig(entityType: EntityType!): SeedDataConfiguration
}

type Mutation {
  """Initialize seed data for all entities"""
  initializeSeedData(config: SeedDataInput!): SeedDataResult!

  """Clear all seed data"""
  clearSeedData(confirm: Boolean!): ClearDataResult!

  """Seed specific entity type"""
  seedEntity(
    entityType: EntityType!
    count: Int!
  ): SeedEntityResult!
}

"""Entity types that can be seeded"""
enum EntityType {
  USER
  DEPARTMENT
  EMPLOYEE
  LEAVE_REQUEST
  PERFORMANCE_REVIEW
  GOAL
  ANALYTICS
}

"""Input for seed data initialization"""
input SeedDataInput {
  users: EntityCountInput!
  departments: EntityCountInput!
  leaveRequests: EntityCountInput!
  performanceReviews: EntityCountInput!
  goals: EntityCountInput!
  generateRelationships: Boolean!
}

"""Entity count configuration"""
input EntityCountInput {
  min: Int!
  max: Int!
}

"""Seed data status response"""
type SeedDataStatus {
  isSeeded: Boolean!
  entityCounts: EntityCounts!
  lastSeededAt: DateTime
  version: String
}

"""Entity count details"""
type EntityCounts {
  users: Int!
  departments: Int!
  leaveRequests: Int!
  performanceReviews: Int!
  goals: Int!
  total: Int!
}

"""Seed data configuration"""
type SeedDataConfiguration {
  entityType: EntityType!
  minRecords: Int!
  maxRecords: Int!
  relationships: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Result of seed data initialization"""
type SeedDataResult {
  success: Boolean!
  message: String!
  entitiesCreated: EntityCounts!
  errors: [String!]
}

"""Result of clearing seed data"""
type ClearDataResult {
  success: Boolean!
  message: String!
  entitiesDeleted: EntityCounts!
}

"""Result of seeding specific entity"""
type SeedEntityResult {
  success: Boolean!
  message: String!
  entityType: EntityType!
  recordsCreated: Int!
  errors: [String!]
}