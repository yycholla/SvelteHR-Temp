openapi: 3.0.0
info:
  title: Backend Health Check API
  version: 1.0.0
  description: Health check endpoint for backend initialization monitoring

paths:
  /api/health:
    get:
      summary: Check backend health status
      operationId: getHealthStatus
      tags:
        - Health
      responses:
        '200':
          description: Backend is healthy or initializing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: Backend is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

components:
  schemas:
    HealthCheckResponse:
      type: object
      required:
        - status
        - services
        - timestamp
      properties:
        status:
          type: string
          enum:
            - healthy
            - initializing
            - error
          description: Overall health status
        services:
          type: object
          required:
            - database
            - graphql
            - auth
          properties:
            database:
              type: boolean
              description: Database connection status
            graphql:
              type: boolean
              description: GraphQL endpoint status
            auth:
              type: boolean
              description: Authentication service status
        message:
          type: string
          description: Optional status message
        timestamp:
          type: string
          format: date-time
          description: Health check timestamp
        responseTime:
          type: number
          description: Response time in milliseconds