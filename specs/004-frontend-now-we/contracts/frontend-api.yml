openapi: 3.0.3
info:
  title: SvelteHR Frontend API Contracts
  description: API contracts for role-based HR management frontend with RBAC enforcement
  version: 1.0.0
  contact:
    name: SvelteHR Development Team

servers:
  - url: http://localhost:5173
    description: SvelteKit development server
  - url: http://localhost:8080/api/v2
    description: MountainHR backend API

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserContext:
      type: object
      required:
        - id
        - email
        - full_name
        - roles
        - permissions
        - is_active
      properties:
        id:
          type: string
          description: Unique user identifier
        email:
          type: string
          format: email
          description: User email address
        full_name:
          type: string
          description: User's full name
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: User's assigned roles
        permissions:
          type: array
          items:
            type: string
          description: Computed permissions from roles
        department_id:
          type: string
          nullable: true
          description: User's assigned department
        is_active:
          type: boolean
          description: Whether user account is active
        last_login:
          type: string
          format: date-time
          description: Last login timestamp

    Role:
      type: object
      required:
        - id
        - name
        - level
        - is_active
      properties:
        id:
          type: string
        name:
          type: string
          enum: [Employee, Manager, HR_Manager, Admin]
        level:
          type: integer
          minimum: 1
          maximum: 100
          description: Role hierarchy level
        description:
          type: string
        inherits_from:
          type: array
          items:
            type: string
          description: Parent role IDs
        is_active:
          type: boolean

    EmployeeProfile:
      type: object
      required:
        - id
        - employee_id
        - full_name
        - email
        - department
        - position
        - hire_date
        - status
      properties:
        id:
          type: string
        employee_id:
          type: string
          description: Company employee identifier
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        department:
          $ref: '#/components/schemas/Department'
        position:
          type: string
        hire_date:
          type: string
          format: date
        manager_id:
          type: string
          nullable: true
        status:
          type: string
          enum: [Active, Inactive, Terminated]
        personal_info:
          $ref: '#/components/schemas/PersonalInfo'
          nullable: true
          description: RBAC restricted data
        employment_details:
          $ref: '#/components/schemas/EmploymentDetails'
          nullable: true
          description: RBAC restricted data

    Department:
      type: object
      required:
        - id
        - name
        - employee_count
        - is_active
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        manager_id:
          type: string
          nullable: true
        parent_department_id:
          type: string
          nullable: true
        employee_count:
          type: integer
          minimum: 0
        is_active:
          type: boolean

    CustomQuery:
      type: object
      required:
        - id
        - name
        - created_by
        - created_at
        - query_config
        - visualization_type
        - filters
        - is_shared
        - allowed_roles
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        created_by:
          type: string
          description: User ID who created the query
        created_at:
          type: string
          format: date-time
        query_config:
          $ref: '#/components/schemas/QueryConfiguration'
        visualization_type:
          type: string
          enum: [table, bar_chart, line_chart, pie_chart, figure]
        filters:
          type: array
          items:
            $ref: '#/components/schemas/QueryFilter'
        is_shared:
          type: boolean
        allowed_roles:
          type: array
          items:
            type: string

    QueryConfiguration:
      type: object
      required:
        - data_source
        - selected_fields
      properties:
        data_source:
          type: string
          enum: [employees, departments, analytics, reports]
        selected_fields:
          type: array
          items:
            type: string
          minItems: 1
        aggregation_type:
          type: string
          enum: [count, sum, average, min, max]
          nullable: true
        group_by_fields:
          type: array
          items:
            type: string
          nullable: true
        sort_by:
          type: object
          properties:
            field:
              type: string
            direction:
              type: string
              enum: [asc, desc]
          nullable: true
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          nullable: true

    QueryFilter:
      type: object
      required:
        - field
        - operator
        - value
        - data_type
      properties:
        field:
          type: string
        operator:
          type: string
          enum: [equals, contains, greater_than, less_than, between, in]
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
        data_type:
          type: string
          enum: [string, number, date, boolean, array]

    VisualizationData:
      type: object
      required:
        - type
        - title
        - data
        - metadata
      properties:
        type:
          type: string
          enum: [table, bar_chart, line_chart, pie_chart, figure]
        title:
          type: string
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ChartDataPoint'
            - type: array
              items:
                $ref: '#/components/schemas/TableRow'
            - $ref: '#/components/schemas/FigureData'
        metadata:
          type: object
          properties:
            total_records:
              type: integer
            query_execution_time:
              type: number
              description: Execution time in milliseconds
            last_updated:
              type: string
              format: date-time

    ChartDataPoint:
      type: object
      required:
        - label
        - value
      properties:
        label:
          type: string
        value:
          type: number
        color:
          type: string
          nullable: true

    TableRow:
      type: object
      additionalProperties: true
      description: Dynamic table row data

    FigureData:
      type: object
      required:
        - image_url
        - alt_text
      properties:
        image_url:
          type: string
          format: uri
        alt_text:
          type: string
        caption:
          type: string
          nullable: true

    PersonalInfo:
      type: object
      properties:
        date_of_birth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        emergency_contact:
          type: string
          nullable: true

    EmploymentDetails:
      type: object
      properties:
        salary:
          type: number
          nullable: true
        benefits:
          type: array
          items:
            type: string
        performance_rating:
          type: number
          minimum: 1
          maximum: 5
          nullable: true

    PaginatedResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items: {}
        pagination:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
            total:
              type: integer
              minimum: 0
            total_pages:
              type: integer
              minimum: 0

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - status_code
      properties:
        error:
          type: string
        message:
          type: string
        status_code:
          type: integer
        details:
          type: object
          nullable: true

paths:
  # Authentication & Authorization
  /api/v2/auth/verify:
    get:
      summary: Verify Bearer token and get user context
      description: Server-side authentication verification for RBAC
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Valid token, user context returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserContext'
                  permissions:
                    type: array
                    items:
                      type: string
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Employee Management (RBAC Filtered)
  /api/v2/employees:
    get:
      summary: Get employees list (RBAC filtered)
      description: Returns employees based on user's permission level
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: department_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [Active, Inactive, Terminated]
      responses:
        '200':
          description: Employees list (filtered by RBAC)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EmployeeProfile'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v2/employees/{employeeId}:
    get:
      summary: Get employee details (RBAC filtered)
      security:
        - BearerAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Employee details (filtered by RBAC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfile'
        '403':
          description: Access denied to this employee
        '404':
          description: Employee not found

  # Department Management
  /api/v2/departments:
    get:
      summary: Get departments list (RBAC filtered)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Departments list (filtered by RBAC)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'

  # Custom Queries (Core Frontend Feature)
  /api/frontend/queries:
    get:
      summary: Get user's custom queries
      security:
        - BearerAuth: []
      parameters:
        - name: shared
          in: query
          schema:
            type: boolean
          description: Include shared queries accessible to user
      responses:
        '200':
          description: User's queries and accessible shared queries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomQuery'

    post:
      summary: Create new custom query
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - query_config
                - visualization_type
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                query_config:
                  $ref: '#/components/schemas/QueryConfiguration'
                visualization_type:
                  type: string
                  enum: [table, bar_chart, line_chart, pie_chart, figure]
                filters:
                  type: array
                  items:
                    $ref: '#/components/schemas/QueryFilter'
                is_shared:
                  type: boolean
                  default: false
                allowed_roles:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Query created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomQuery'
        '400':
          description: Invalid query configuration
        '403':
          description: Insufficient permissions for data source

  /api/frontend/queries/{queryId}:
    get:
      summary: Get custom query details
      security:
        - BearerAuth: []
      parameters:
        - name: queryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Query details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomQuery'
        '403':
          description: Access denied to this query
        '404':
          description: Query not found

    put:
      summary: Update custom query
      security:
        - BearerAuth: []
      parameters:
        - name: queryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomQuery'
      responses:
        '200':
          description: Query updated successfully
        '403':
          description: Not authorized to update this query

    delete:
      summary: Delete custom query
      security:
        - BearerAuth: []
      parameters:
        - name: queryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Query deleted successfully
        '403':
          description: Not authorized to delete this query

  # Query Execution (Real-time Data)
  /api/frontend/queries/{queryId}/execute:
    post:
      summary: Execute custom query and get visualization data
      description: Execute query with RBAC filtering and return formatted data
      security:
        - BearerAuth: []
      parameters:
        - name: queryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Query execution results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisualizationData'
        '403':
          description: Access denied to query data
        '422':
          description: Query execution failed

  # Role-Based Dashboard Data
  /api/frontend/dashboard/{role}:
    get:
      summary: Get role-specific dashboard data
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [employee, manager, hr, admin]
      responses:
        '200':
          description: Dashboard data for user role
          content:
            application/json:
              schema:
                type: object
                properties:
                  widgets:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        title:
                          type: string
                        data:
                          type: object
                  recent_activities:
                    type: array
                    items:
                      type: object
                  notifications:
                    type: array
                    items:
                      type: object
        '403':
          description: Access denied for this role

  # Data Validation for Frontend Forms
  /api/frontend/validate/{entity}:
    post:
      summary: Validate form data before submission
      security:
        - BearerAuth: []
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [employee, department, query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Entity data to validate
      responses:
        '200':
          description: Validation passed
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    enum: [true]
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    enum: [false]
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string