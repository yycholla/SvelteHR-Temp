# Communications GraphQL Schema

extend type Query {
	# Get paginated messages/announcements
	communications(
		page: Int = 1
		limit: Int = 20
		type: MessageType
		unreadOnly: Boolean = false
		sortBy: CommSortField = CREATED_AT
		sortOrder: SortOrder = DESC
	): CommunicationPage! @auth

	# Get single communication
	communication(id: ID!): Communication! @auth

	# Get unread message count
	unreadCount: Int! @auth
}

extend type Mutation {
	# Send new message/announcement
	sendCommunication(input: SendCommunicationInput!): Communication!
		@hasPermission(resource: "communications", action: "write")

	# Mark message as read
	markAsRead(id: ID!): Communication! @auth

	# Mark all messages as read
	markAllAsRead: Boolean! @auth

	# Delete message (sender only)
	deleteCommunication(id: ID!): Boolean!
		@hasPermission(resource: "communications", action: "delete")
}

extend type Subscription {
	# Real-time new messages for current user
	newCommunication: Communication! @auth

	# Real-time message read status updates
	communicationUpdated: Communication! @auth
}

# Types
type Communication {
	id: ID!
	type: MessageType!
	subject: String!
	content: String!
	sender: User!
	recipients: [User!]!
	priority: Priority!
	isRead: Boolean! # For current user
	attachments: [Document!]!
	createdAt: DateTime!
	updatedAt: DateTime!
}

type CommunicationPage {
	communications: [Communication!]!
	total: Int!
	page: Int!
	limit: Int!
	hasNextPage: Boolean!
	hasPreviousPage: Boolean!
}

# Input Types
input SendCommunicationInput {
	type: MessageType!
	subject: String!
	content: String!
	recipientIds: [ID!]! # Empty array = all users (announcements)
	priority: Priority = MEDIUM
	attachmentIds: [ID!] = []
}

# Enums
enum MessageType {
	ANNOUNCEMENT
	DIRECT_MESSAGE
	NOTIFICATION
	REMINDER
}

enum Priority {
	LOW
	MEDIUM
	HIGH
	URGENT
}

enum CommSortField {
	CREATED_AT
	SUBJECT
	SENDER
	PRIORITY
}
