# Employee Management GraphQL Schema

extend type Query {
	# Get paginated employee list
	employees(
		page: Int = 1
		limit: Int = 20
		search: String
		department: ID
		status: EmployeeStatus
		sortBy: EmployeeSortField = LAST_NAME
		sortOrder: SortOrder = ASC
	): EmployeePage! @hasPermission(resource: "employees", action: "read")

	# Get single employee by ID
	employee(id: ID!): Employee @hasPermission(resource: "employees", action: "read")

	# Get employee by employee ID
	employeeByEmployeeId(employeeId: String!): Employee
		@hasPermission(resource: "employees", action: "read")

	# Get current user's employee profile
	myProfile: Employee @auth
}

extend type Mutation {
	# Create new employee
	createEmployee(input: CreateEmployeeInput!): Employee!
		@hasPermission(resource: "employees", action: "write")

	# Update employee information
	updateEmployee(id: ID!, input: UpdateEmployeeInput!): Employee!
		@hasPermission(resource: "employees", action: "write")

	# Update own profile (limited fields)
	updateMyProfile(input: UpdateMyProfileInput!): Employee! @auth

	# Deactivate employee
	deactivateEmployee(id: ID!, reason: String): Employee!
		@hasPermission(resource: "employees", action: "write")

	# Reactivate employee
	reactivateEmployee(id: ID!): Employee! @hasPermission(resource: "employees", action: "write")
}

# Types
type Employee {
	id: ID!
	employeeId: String!
	user: User!
	department: Department!
	position: String!
	manager: Employee
	directReports: [Employee!]!
	hireDate: Date!
	status: EmployeeStatus!
	salary: Float @hasPermission(resource: "employees", action: "read_salary")
	phone: String
	address: String
	leaveRequests: [LeaveRequest!]! @hasPermission(resource: "leave", action: "read")
	documents: [Document!]! @hasPermission(resource: "documents", action: "read")
	createdAt: DateTime!
	updatedAt: DateTime!
}

type EmployeePage {
	employees: [Employee!]!
	total: Int!
	page: Int!
	limit: Int!
	hasNextPage: Boolean!
	hasPreviousPage: Boolean!
}

type Department {
	id: ID!
	name: String!
	description: String
	head: Employee
	employees: [Employee!]!
	budget: Float @hasPermission(resource: "departments", action: "read_budget")
}

# Input Types
input CreateEmployeeInput {
	email: String!
	firstName: String!
	lastName: String!
	employeeId: String!
	departmentId: ID!
	position: String!
	managerId: ID
	hireDate: Date!
	salary: Float
	phone: String
	address: String
}

input UpdateEmployeeInput {
	firstName: String
	lastName: String
	departmentId: ID
	position: String
	managerId: ID
	salary: Float
	phone: String
	address: String
}

input UpdateMyProfileInput {
	phone: String
	address: String
}

# Enums
enum EmployeeStatus {
	ACTIVE
	INACTIVE
	TERMINATED
	ON_LEAVE
}

enum EmployeeSortField {
	FIRST_NAME
	LAST_NAME
	EMPLOYEE_ID
	HIRE_DATE
	DEPARTMENT
	POSITION
}

enum SortOrder {
	ASC
	DESC
}

# Scalars
scalar Date
scalar DateTime
