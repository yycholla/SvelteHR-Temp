# HR Processes GraphQL Schema

extend type Query {
	# Get paginated processes
	processes(
		page: Int = 1
		limit: Int = 20
		type: ProcessType
		status: ProcessStatus
		requesterId: ID
		approverId: ID
		sortBy: ProcessSortField = CREATED_AT
		sortOrder: SortOrder = DESC
	): ProcessPage! @hasPermission(resource: "processes", action: "read")

	# Get single process
	process(id: ID!): HRProcess! @hasPermission(resource: "processes", action: "read")

	# Get processes requiring my approval
	myApprovals(page: Int = 1, limit: Int = 20, status: ProcessStatus = PENDING): ProcessPage! @auth

	# Get my submitted processes
	myProcesses(
		page: Int = 1
		limit: Int = 20
		type: ProcessType
		status: ProcessStatus
	): ProcessPage! @auth
}

extend type Mutation {
	# Submit new process request
	submitProcess(input: SubmitProcessInput!): HRProcess! @auth

	# Approve process (managers/HR only)
	approveProcess(id: ID!, comment: String): HRProcess!
		@hasPermission(resource: "processes", action: "approve")

	# Reject process (managers/HR only)
	rejectProcess(id: ID!, reason: String!): HRProcess!
		@hasPermission(resource: "processes", action: "approve")

	# Request more information
	requestMoreInfo(id: ID!, message: String!): HRProcess!
		@hasPermission(resource: "processes", action: "approve")

	# Cancel own process
	cancelProcess(id: ID!): HRProcess! @auth

	# Add comment to process
	addProcessComment(id: ID!, comment: String!): ProcessComment! @auth
}

extend type Subscription {
	# Real-time process updates for involved users
	processUpdated: HRProcess! @auth

	# New process comments
	processCommentAdded: ProcessComment! @auth
}

# Types
type HRProcess {
	id: ID!
	type: ProcessType!
	title: String!
	status: ProcessStatus!
	requester: Employee!
	approver: Employee
	data: JSON! # Process-specific structured data
	comments: [ProcessComment!]!
	createdAt: DateTime!
	updatedAt: DateTime!
	completedAt: DateTime
}

type ProcessPage {
	processes: [HRProcess!]!
	total: Int!
	page: Int!
	limit: Int!
	hasNextPage: Boolean!
	hasPreviousPage: Boolean!
}

type ProcessComment {
	id: ID!
	process: HRProcess!
	author: User!
	comment: String!
	createdAt: DateTime!
}

# Specific Process Data Types
type LeaveRequestData {
	startDate: Date!
	endDate: Date!
	leaveType: LeaveType!
	reason: String
	totalDays: Float!
}

type ExpenseClaimData {
	amount: Float!
	currency: String!
	category: String!
	description: String!
	receiptUrl: String
	expenseDate: Date!
}

# Input Types
input SubmitProcessInput {
	type: ProcessType!
	title: String!
	data: JSON! # Process-specific data
	approverId: ID # Optional - system can auto-assign
}

# Enums
enum ProcessType {
	LEAVE_REQUEST
	EXPENSE_CLAIM
	PERFORMANCE_REVIEW
	TRANSFER_REQUEST
	DOCUMENT_APPROVAL
}

enum ProcessStatus {
	SUBMITTED
	PENDING
	MORE_INFO_NEEDED
	APPROVED
	REJECTED
	CANCELLED
}

enum ProcessSortField {
	CREATED_AT
	TITLE
	STATUS
	TYPE
	REQUESTER
}

enum LeaveType {
	ANNUAL_LEAVE
	SICK_LEAVE
	PERSONAL_LEAVE
	MATERNITY_LEAVE
	PATERNITY_LEAVE
	BEREAVEMENT_LEAVE
}

# Scalars
scalar JSON
