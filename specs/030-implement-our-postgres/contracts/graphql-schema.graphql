# GraphQL Schema Contract for HR Application
# Feature 030: Complete PostgreSQL Database API Coverage
# Date: 2025-10-10
#
# This schema defines the complete API surface for all 43 PostgreSQL tables.
# It follows GraphQL best practices with cursor-based pagination, input types,
# and proper error handling.

# =============================================================================
# SCALARS & COMMON TYPES
# =============================================================================

"""
UUID scalar type for unique identifiers
"""
scalar UUID

"""
DateTime scalar type following ISO 8601 format
"""
scalar DateTime

"""
Date scalar type (YYYY-MM-DD format)
"""
scalar Date

"""
JSON object for flexible data structures
"""
scalar JSON

"""
Pagination information following Relay cursor spec
"""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"""
Connection interface for paginated results
"""
interface Connection {
  pageInfo: PageInfo!
  totalCount: Int!
}

"""
Generic filter comparison operators
"""
input ComparisonInput {
  eq: String
  ne: String
  gt: String
  gte: String
  lt: String
  lte: String
  in: [String!]
  notIn: [String!]
  isNull: Boolean
  like: String
  ilike: String
}

# =============================================================================
# DOMAIN 1: CORE HR
# =============================================================================

enum UserStatus {
  ACTIVE
  INACTIVE
  TERMINATED
}

type User {
  id: UUID!
  email: String!
  firstName: String!
  lastName: String!
  fullName: String!
  phone: String
  department: Department
  manager: User
  directReports: [User!]!
  hireDate: Date!
  terminationDate: Date
  status: UserStatus!
  roleAssignments: [UserRoleAssignment!]!
  skills: [EmployeeSkill!]!
  certifications: [EmployeeCertification!]!
  goals: [EmployeeGoal!]!
  emergencyContacts: [EmergencyContact!]!
  vehicles: [EmployeeVehicle!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type UserConnection implements Connection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type UserEdge {
  cursor: String!
  node: User!
}

input UserFilter {
  email: ComparisonInput
  firstName: ComparisonInput
  lastName: ComparisonInput
  departmentId: ComparisonInput
  status: UserStatus
  hireDate: ComparisonInput
  includeDeleted: Boolean
}

input UserSort {
  field: UserSortField!
  direction: SortDirection!
}

enum UserSortField {
  CREATED_AT
  UPDATED_AT
  EMAIL
  FIRST_NAME
  LAST_NAME
  HIRE_DATE
}

enum SortDirection {
  ASC
  DESC
}

input CreateUserInput {
  email: String!
  firstName: String!
  lastName: String!
  phone: String
  departmentId: UUID
  managerId: UUID
  hireDate: Date!
  status: UserStatus
}

input UpdateUserInput {
  id: UUID!
  email: String
  firstName: String
  lastName: String
  phone: String
  departmentId: UUID
  managerId: UUID
  terminationDate: Date
  status: UserStatus
  updatedAt: DateTime! # Optimistic locking version check
}

type Department {
  id: UUID!
  name: String!
  description: String
  parentDepartment: Department
  childDepartments: [Department!]!
  manager: User
  employees: [User!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DepartmentConnection implements Connection {
  edges: [DepartmentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type DepartmentEdge {
  cursor: String!
  node: Department!
}

input DepartmentFilter {
  name: ComparisonInput
  parentDepartmentId: ComparisonInput
  includeDeleted: Boolean
}

input CreateDepartmentInput {
  name: String!
  description: String
  parentDepartmentId: UUID
  managerId: UUID
}

input UpdateDepartmentInput {
  id: UUID!
  name: String
  description: String
  parentDepartmentId: UUID
  managerId: UUID
  updatedAt: DateTime!
}

type UserRoleAssignment {
  id: UUID!
  user: User!
  role: Role!
  assignedAt: DateTime!
  assignedBy: User!
  createdAt: DateTime!
}

type Role {
  id: UUID!
  name: String!
  description: String
  permissions: [Permission!]!
  userAssignments: [UserRoleAssignment!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Permission {
  id: UUID!
  resource: String!
  action: String!
  description: String
}

# =============================================================================
# DOMAIN 2: EVENTS SYSTEM
# =============================================================================

type Event {
  id: UUID!
  title: String!
  description: String
  startTime: DateTime!
  endTime: DateTime!
  location: String
  capacity: Int
  allDay: Boolean!
  recurrenceRule: String
  recurrenceEndDate: Date
  creator: User!
  attendees: [EventAttendee!]!
  comments: [EventComment!]!
  history: [EventHistory!]!
  notifications: [EventNotification!]!
  waitlist: [EventWaitlist!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EventConnection implements Connection {
  edges: [EventEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type EventEdge {
  cursor: String!
  node: Event!
}

input EventFilter {
  title: ComparisonInput
  startTime: ComparisonInput
  endTime: ComparisonInput
  createdBy: UUID
  includeDeleted: Boolean
}

input CreateEventInput {
  title: String!
  description: String
  startTime: DateTime!
  endTime: DateTime!
  location: String
  capacity: Int
  allDay: Boolean
  recurrenceRule: String
  recurrenceEndDate: Date
}

input UpdateEventInput {
  id: UUID!
  title: String
  description: String
  startTime: DateTime
  endTime: DateTime
  location: String
  capacity: Int
  allDay: Boolean
  recurrenceRule: String
  recurrenceEndDate: Date
  updatedAt: DateTime!
}

enum RsvpStatus {
  PENDING
  ACCEPTED
  DECLINED
  TENTATIVE
}

enum RsvpScope {
  THIS_EVENT
  THIS_AND_FUTURE
  ALL_EVENTS
}

type EventAttendee {
  id: UUID!
  event: Event!
  employee: User!
  responseStatus: RsvpStatus!
  isRequired: Boolean!
  isOrganizer: Boolean!
  reminderTime: DateTime
  scope: RsvpScope!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input EventAttendeeFilter {
  eventId: UUID
  employeeId: UUID
  responseStatus: RsvpStatus
  isOrganizer: Boolean
}

input CreateEventAttendeeInput {
  eventId: UUID!
  employeeId: UUID!
  responseStatus: RsvpStatus
  isRequired: Boolean
  isOrganizer: Boolean
  reminderTime: DateTime
  scope: RsvpScope
}

input UpdateEventAttendeeInput {
  id: UUID!
  responseStatus: RsvpStatus
  reminderTime: DateTime
  scope: RsvpScope
  updatedAt: DateTime!
}

# Additional Events types...
type EventComment {
  id: UUID!
  event: Event!
  user: User!
  commentText: String!
  parentComment: EventComment
  replies: [EventComment!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EventHistory {
  id: UUID!
  event: Event!
  changedBy: User!
  changeType: String!
  oldValue: JSON
  newValue: JSON
  createdAt: DateTime!
}

type EventNotification {
  id: UUID!
  event: Event!
  user: User!
  notificationType: String!
  notificationTime: DateTime!
  sent: Boolean!
  createdAt: DateTime!
}

type EventWaitlist {
  id: UUID!
  event: Event!
  user: User!
  position: Int!
  promoted: Boolean!
  joinedAt: DateTime!
  promotedAt: DateTime
}

# =============================================================================
# DOMAIN 3: TASKS SYSTEM
# =============================================================================

enum TaskStatus {
  TODO
  IN_PROGRESS
  REVIEW
  DONE
  CANCELLED
}

enum TaskPriority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

type Task {
  id: UUID!
  title: String!
  description: String
  taskType: TaskType
  status: TaskStatus!
  priority: TaskPriority!
  dueDate: DateTime
  creator: User!
  assignees: [TaskAssignee!]!
  dependencies: [TaskDependency!]!
  auditEntries: [TaskAuditEntry!]!
  linkedResources: [LinkedResource!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type TaskConnection implements Connection {
  edges: [TaskEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type TaskEdge {
  cursor: String!
  node: Task!
}

input TaskFilter {
  title: ComparisonInput
  status: TaskStatus
  priority: TaskPriority
  dueDate: ComparisonInput
  assigneeId: UUID
  createdBy: UUID
  includeDeleted: Boolean
}

input CreateTaskInput {
  title: String!
  description: String
  taskTypeId: UUID
  status: TaskStatus
  priority: TaskPriority
  dueDate: DateTime
}

input UpdateTaskInput {
  id: UUID!
  title: String
  description: String
  taskTypeId: UUID
  status: TaskStatus
  priority: TaskPriority
  dueDate: DateTime
  updatedAt: DateTime!
}

type TaskAssignee {
  id: UUID!
  task: Task!
  user: User!
  assignedAt: DateTime!
  assignedBy: User!
}

type TaskAuditEntry {
  id: UUID!
  task: Task!
  changedBy: User!
  changeType: String!
