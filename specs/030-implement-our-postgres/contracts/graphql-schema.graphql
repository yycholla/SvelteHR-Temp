  totalCount: Int!
}

type LeaveRequestEdge {
  cursor: String!
  node: LeaveRequest!
}

input LeaveRequestFilter {
  employeeId: UUID
  leaveType: LeaveType
  status: LeaveStatus
  startDate: ComparisonInput
  endDate: ComparisonInput
}

input CreateLeaveRequestInput {
  employeeId: UUID!
  leaveType: LeaveType!
  startDate: Date!
  endDate: Date!
  reason: String
}

input UpdateLeaveRequestInput {
  id: UUID!
