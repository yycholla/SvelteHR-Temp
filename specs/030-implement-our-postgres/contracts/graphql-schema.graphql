# =============================================================================
# DOMAIN 9: SYSTEM ADMINISTRATION
# =============================================================================

enum RollbackStatus {
  PENDING
  APPROVED
  REJECTED
  COMPLETED
}

type RollbackRequest {
  id: UUID!
  requester: User!
  resourceType: String!
  resourceId: UUID!
  rollbackToTimestamp: DateTime!
  status: RollbackStatus!
  approver: User
  completedAt: DateTime
  createdAt: DateTime!
}

type BulkRollbackBatch {
  id: UUID!
  batchName: String!
  requester: User!
  totalItems: Int!
  completedItems: Int!
  status: String!
  startedAt: DateTime
  completedAt: DateTime
  createdAt: DateTime!
  items: [BulkRollbackItem!]!
}

type BulkRollbackItem {
  id: UUID!
  batch: BulkRollbackBatch!
  resourceType: String!
  resourceId: UUID!
  rollbackToTimestamp: DateTime!
  status: String!
  errorMessage: String
  completedAt: DateTime
}

enum ResourceRelationshipType {
  RELATED_TO
  DEPENDS_ON
  REFERENCES
}

type LinkedResource {
  id: UUID!
  sourceType: String!
  sourceId: UUID!
  targetType: String!
  targetId: UUID!
  relationshipType: ResourceRelationshipType!
  createdAt: DateTime!
}

type EmergencyContact {
  id: UUID!
  employee: User!
  contactName: String!
  relationship: String!
  phoneNumber: String!
  email: String
  isPrimary: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EncryptionKey {
  id: UUID!
  keyName: String!
  algorithm: String!
  createdAt: DateTime!
  rotatedAt: DateTime
  active: Boolean!
}

# =============================================================================
# ROOT QUERY TYPE
# =============================================================================

type Query {
  # Core HR Queries
  user(id: UUID!): User
  users(
    filter: UserFilter
    sort: UserSort
    first: Int
    after: String
    last: Int
    before: String
  ): UserConnection!

  department(id: UUID!): Department
  departments(
    filter: DepartmentFilter
    first: Int
    after: String
  ): DepartmentConnection!

  role(id: UUID!): Role
  roles(first: Int, after: String): [Role!]!

  # Events Queries
  event(id: UUID!): Event
  events(
    filter: EventFilter
    first: Int
    after: String
  ): EventConnection!

  eventAttendee(id: UUID!): EventAttendee
  eventAttendees(
    filter: EventAttendeeFilter
    first: Int
    after: String
  ): [EventAttendee!]!

  # Tasks Queries
  task(id: UUID!): Task
  tasks(
    filter: TaskFilter
    first: Int
    after: String
  ): TaskConnection!

  taskType(id: UUID!): TaskType
  taskTypes: [TaskType!]!

  # Documents Queries
  document(id: UUID!): Document
  documents(
    filter: DocumentFilter
    first: Int
    after: String
  ): DocumentConnection!

  documentCategory(id: UUID!): DocumentCategory
  documentCategories: [DocumentCategory!]!

  # Performance Queries
  performanceReview(id: UUID!): PerformanceReview
  performanceReviews(employeeId: UUID!, first: Int, after: String): [PerformanceReview!]!

  employeeGoal(id: UUID!): EmployeeGoal
  employeeGoals(employeeId: UUID!): [EmployeeGoal!]!

  # Leave Queries
  leaveRequest(id: UUID!): LeaveRequest
  leaveRequests(
    filter: LeaveRequestFilter
    first: Int
    after: String
  ): LeaveRequestConnection!

  timeOffBalance(employeeId: UUID!, leaveType: LeaveType!, year: Int!): TimeOffBalance
  timeOffBalances(employeeId: UUID!): [TimeOffBalance!]!

  # Notification Queries
  notification(id: UUID!): Notification
  notifications(
    filter: NotificationFilter
    first: Int
    after: String
  ): NotificationConnection!

  # Admin Queries
  activityLog(id: UUID!): ActivityLog
  activityLogs(userId: UUID, limit: Int): [ActivityLog!]!

  # Health Check
  health: String!
}

# =============================================================================
# ROOT MUTATION TYPE
# =============================================================================

type Mutation {
  # User Mutations
  createUser(input: CreateUserInput!): User!
  updateUser(input: UpdateUserInput!): User!
  deleteUser(id: UUID!): Boolean!

  # Department Mutations
  createDepartment(input: CreateDepartmentInput!): Department!
  updateDepartment(input: UpdateDepartmentInput!): Department!
  deleteDepartment(id: UUID!): Boolean!

  # Event Mutations
  createEvent(input: CreateEventInput!): Event!
  updateEvent(input: UpdateEventInput!): Event!
  deleteEvent(id: UUID!): Boolean!

  # Event Attendee Mutations
  createEventAttendee(input: CreateEventAttendeeInput!): EventAttendee!
  updateEventAttendee(input: UpdateEventAttendeeInput!): EventAttendee!
  deleteEventAttendee(id: UUID!): Boolean!

  # Task Mutations
  createTask(input: CreateTaskInput!): Task!
  updateTask(input: UpdateTaskInput!): Task!
  deleteTask(id: UUID!): Boolean!

  # Document Mutations
  createDocument(input: CreateDocumentInput!): Document!
  updateDocument(input: UpdateDocumentInput!): Document!
  deleteDocument(id: UUID!): Boolean!

  # Leave Request Mutations
  createLeaveRequest(input: CreateLeaveRequestInput!): LeaveRequest!
  updateLeaveRequest(input: UpdateLeaveRequestInput!): LeaveRequest!
  deleteLeaveRequest(id: UUID!): Boolean!

  # Notification Mutations
  markNotificationAsRead(id: UUID!): Notification!
  markAllNotificationsAsRead(userId: UUID!): Boolean!
}

# =============================================================================
# ROOT SUBSCRIPTION TYPE (Real-time Updates)
# =============================================================================

type Subscription {
  # Event subscriptions
  eventUpdated(eventId: UUID!): Event!
  eventCreated(userId: UUID!): Event!

  # Task subscriptions
  taskUpdated(taskId: UUID!): Task!
  taskAssigned(userId: UUID!): Task!

  # Notification subscriptions
  notificationReceived(userId: UUID!): Notification!

  # Leave request subscriptions
  leaveRequestStatusChanged(requestId: UUID!): LeaveRequest!
}

# =============================================================================
# ERROR HANDLING
# =============================================================================

"""
Standard error type for GraphQL operations
"""
type Error {
  message: String!
  code: String!
  field: String
}

"""
Result type for mutations that may fail
"""
type UserResult {
  user: User
  errors: [Error!]
}

# Note: This schema demonstrates the pattern. All 43 tables follow similar patterns.
# Contract tests will validate the complete implementation of this schema.
