  filePath: String!
  fileSize: Int!
  mimeType: String!
  uploader: User!
  versions: [DocumentVersion!]!
  assignments: [DocumentAssignment!]!
  accessLogs: [DocumentAccessLog!]!
  encryptedStorage: [EncryptedFileStorage!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DocumentConnection implements Connection {
  edges: [DocumentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type DocumentEdge {
  cursor: String!
  node: Document!
}

input DocumentFilter {
  title: ComparisonInput
  categoryId: UUID
  uploadedBy: UUID
  mimeType: ComparisonInput
  includeDeleted: Boolean
}

input CreateDocumentInput {
  title: String!
  description: String
  categoryId: UUID
  filePath: String!
  fileSize: Int!
  mimeType: String!
}

input UpdateDocumentInput {
  id: UUID!
  title: String
  description: String
  categoryId: UUID
  updatedAt: DateTime!
}

type DocumentVersion {
  id: UUID!
  document: Document!
