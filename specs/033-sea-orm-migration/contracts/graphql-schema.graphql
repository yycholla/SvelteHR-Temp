# GraphQL API Contracts: SeaORM Migration
# Generated from functional requirements and data model
# Date: 2025-10-14

type Query {
	# User queries
	users(filter: UserFilter, pagination: PaginationInput): UserConnection!
	user(id: ID!): User
	currentUser: User

	# Department queries
	departments(filter: DepartmentFilter, pagination: PaginationInput): DepartmentConnection!
	department(id: ID!): Department

	# Employee queries
	employees(filter: EmployeeFilter, pagination: PaginationInput): EmployeeConnection!
	employee(id: ID!): Employee

	# Task queries
	tasks(filter: TaskFilter, pagination: PaginationInput): TaskConnection!
	task(id: ID!): Task

	# Leave request queries
	leaveRequests(filter: LeaveRequestFilter, pagination: PaginationInput): LeaveRequestConnection!
	leaveRequest(id: ID!): LeaveRequest

	# Performance review queries
	performanceReviews(
		filter: PerformanceReviewFilter
		pagination: PaginationInput
	): PerformanceReviewConnection!
	performanceReview(id: ID!): PerformanceReview

	# Audit log queries (admin/HR only)
	auditLogs(filter: AuditLogFilter, pagination: PaginationInput): AuditLogConnection!

	# Notification queries
	notifications(filter: NotificationFilter, pagination: PaginationInput): NotificationConnection!
	unreadNotificationCount: Int!

	# Document queries
	documents(filter: DocumentFilter, pagination: PaginationInput): DocumentConnection!
	document(id: ID!): Document

	# Report queries
	reports(filter: ReportFilter, pagination: PaginationInput): ReportConnection!
	report(id: ID!): Report
}

type Mutation {
	# User mutations
	createUser(input: CreateUserInput!): User!
	updateUser(id: ID!, input: UpdateUserInput!): User!
	deleteUser(id: ID!): Boolean!

	# Department mutations
	createDepartment(input: CreateDepartmentInput!): Department!
	updateDepartment(id: ID!, input: UpdateDepartmentInput!): Department!
	deleteDepartment(id: ID!): Boolean!

	# Employee mutations
	createEmployee(input: CreateEmployeeInput!): Employee!
	updateEmployee(id: ID!, input: UpdateEmployeeInput!): Employee!

	# Task mutations
	createTask(input: CreateTaskInput!): Task!
	updateTask(id: ID!, input: UpdateTaskInput!): Task!
	deleteTask(id: ID!): Boolean!

	# Leave request mutations
	createLeaveRequest(input: CreateLeaveRequestInput!): LeaveRequest!
	updateLeaveRequest(id: ID!, input: UpdateLeaveRequestInput!): LeaveRequest!
	approveLeaveRequest(id: ID!): LeaveRequest!
	rejectLeaveRequest(id: ID!, reason: String): LeaveRequest!

	# Performance review mutations
	createPerformanceReview(input: CreatePerformanceReviewInput!): PerformanceReview!
	updatePerformanceReview(id: ID!, input: UpdatePerformanceReviewInput!): PerformanceReview!
	submitPerformanceReview(id: ID!): PerformanceReview!
	completePerformanceReview(id: ID!, rating: Int!, feedback: String): PerformanceReview!

	# Notification mutations
	markNotificationRead(id: ID!): Notification!
	markAllNotificationsRead: Boolean!

	# Document mutations
	uploadDocument(input: UploadDocumentInput!): Document!
	deleteDocument(id: ID!): Boolean!

	# Report mutations
	createReport(input: CreateReportInput!): Report!
	updateReport(id: ID!, input: UpdateReportInput!): Report!
	deleteReport(id: ID!): Boolean!
	runReport(id: ID!): ReportResult!
}

# Entity Types

type User {
	id: ID!
	email: String!
	fullName: String!
	role: UserRole!
	department: Department
	tasks: [Task!]!
	leaveRequests: [LeaveRequest!]!
	performanceReviews: [PerformanceReview!]!
	auditLogs: [AuditLog!]!
	createdAt: DateTime!
	updatedAt: DateTime!
	isActive: Boolean!
}

type Department {
	id: ID!
	name: String!
	description: String
	parent: Department
	children: [Department!]!
	manager: User
	users: [User!]!
	createdAt: DateTime!
	updatedAt: DateTime!
}

type Employee {
	id: ID!
	user: User!
	employeeId: String!
	hireDate: Date!
	terminationDate: Date
	jobTitle: String!
	skills: [Skill!]!
	certifications: [Certification!]!
	createdAt: DateTime!
	updatedAt: DateTime!
}

type Task {
	id: ID!
	title: String!
	description: String!
	status: TaskStatus!
	priority: Priority!
	assignee: User!
	createdBy: User!
	dueDate: DateTime
	createdAt: DateTime!
	updatedAt: DateTime!
}

type LeaveRequest {
	id: ID!
	user: User!
	leaveType: LeaveType!
	startDate: Date!
	endDate: Date!
	status: LeaveStatus!
	reason: String!
	approvedBy: User
	approvedAt: DateTime
	createdAt: DateTime!
	updatedAt: DateTime!
}

type PerformanceReview {
	id: ID!
	employee: User!
	reviewer: User!
	reviewPeriodStart: Date!
	reviewPeriodEnd: Date!
	status: ReviewStatus!
	overallRating: Int
	goals: [Goal!]!
	feedback: String!
	createdAt: DateTime!
	updatedAt: DateTime!
}

type AuditLog {
	id: ID!
	user: User
	action: String!
	entityType: String!
	entityId: ID!
	oldValues: JSON
	newValues: JSON
	ipAddress: String
	userAgent: String
	createdAt: DateTime!
}

type Notification {
	id: ID!
	user: User!
	type: NotificationType!
	title: String!
	message: String!
	isRead: Boolean!
	data: JSON
	createdAt: DateTime!
}

type Document {
	id: ID!
	user: User!
	filename: String!
	fileSize: Int!
	mimeType: String!
	category: DocumentCategory!
	isPublic: Boolean!
	createdAt: DateTime!
	updatedAt: DateTime!
}

type Report {
	id: ID!
	name: String!
	description: String!
	createdBy: User!
	isPublic: Boolean!
	lastRunAt: DateTime
	createdAt: DateTime!
	updatedAt: DateTime!
}

type ReportResult {
	report: Report!
	data: JSON!
	generatedAt: DateTime!
}

# Supporting Types

type Skill {
	name: String!
	level: String!
	yearsExperience: Int
}

type Certification {
	name: String!
	issuer: String!
	issueDate: Date!
	expiryDate: Date
	credentialId: String
}

type Goal {
	title: String!
	description: String!
	status: GoalStatus!
	dueDate: Date
}

# Enums

enum UserRole {
	ADMIN
	HR_MANAGER
	MANAGER
	EMPLOYEE
}

enum TaskStatus {
	PENDING
	IN_PROGRESS
	COMPLETED
	CANCELLED
}

enum Priority {
	LOW
	MEDIUM
	HIGH
}

enum LeaveType {
	VACATION
	SICK
	PERSONAL
	MATERNITY
}

enum LeaveStatus {
	PENDING
	APPROVED
	REJECTED
	CANCELLED
}

enum ReviewStatus {
	DRAFT
	SUBMITTED
	IN_REVIEW
	COMPLETED
}

enum NotificationType {
	TASK_ASSIGNED
	LEAVE_APPROVED
	REVIEW_DUE
	SYSTEM_ALERT
}

enum DocumentCategory {
	RESUME
	CONTRACT
	CERTIFICATION
	OTHER
}

enum GoalStatus {
	NOT_STARTED
	IN_PROGRESS
	COMPLETED
	CANCELLED
}

