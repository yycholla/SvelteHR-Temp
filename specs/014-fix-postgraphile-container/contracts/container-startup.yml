openapi: 3.0.0
info:
  title: PostgreSQL Container Initialization Contract
  version: 1.0.0
  description: Contract for PostgreSQL development container startup and initialization behavior

paths:
  /health:
    get:
      summary: Container health check endpoint
      description: Validates that PostgreSQL container is ready to accept connections
      responses:
        '200':
          description: Container healthy and database accessible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy]
                  database:
                    type: string
                    example: hr_system
                  initialization_time:
                    type: number
                    description: Time taken for full initialization in seconds
                    maximum: 30
        '503':
          description: Container not ready or initialization failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unhealthy]
                  error:
                    type: string
                    description: Specific error message for debugging

  /schema-validation:
    get:
      summary: Schema validation endpoint
      description: Validates that all required tables, roles, and permissions are properly initialized
      responses:
        '200':
          description: Schema validation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                    example: [hr_public, hr_private, hr_hidden]
                  tables_count:
                    type: integer
                    minimum: 16
                  roles:
                    type: array
                    items:
                      type: string
                    example: [hr_guest, hr_employee, hr_manager, hr_admin, hr_super_admin]
                  extensions:
                    type: array
                    items:
                      type: string
                    example: [uuid-ossp, pgcrypto]
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  validation_errors:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          type: string
                          enum: [schema, roles, tables, extensions, permissions]
                        error:
                          type: string
                        details:
                          type: string

components:
  schemas:
    ContainerConfig:
      type: object
      properties:
        database_name:
          type: string
          example: hr_system
        postgres_user:
          type: string
          example: postgres
        initialization_timeout:
          type: integer
          example: 30
          description: Maximum seconds allowed for initialization
        volume_name:
          type: string
          example: sveltehr_postgres_dev_data
        init_files_path:
          type: string
          example: /docker-entrypoint-initdb.d
      required:
        - database_name
        - postgres_user
        - initialization_timeout

    InitializationFiles:
      type: object
      properties:
        roles_file:
          type: string
          example: 01-roles.sql
          description: PostgreSQL roles and extensions setup
        schema_file:
          type: string
          example: 02-schema.sql
          description: Table definitions and constraints
        data_file:
          type: string
          example: 03-data.sql
          description: Seed data and default records
        indexes_file:
          type: string
          example: 04-indexes.sql
          description: Performance indexes and complex constraints
      required:
        - roles_file
        - schema_file
        - data_file
        - indexes_file