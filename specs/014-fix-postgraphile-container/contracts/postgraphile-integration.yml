openapi: 3.0.0
info:
  title: PostGraphile Integration Contract
  version: 1.0.0
  description: Contract for PostGraphile GraphQL interface integration with initialized PostgreSQL schema

paths:
  /graphql:
    post:
      summary: PostGraphile GraphQL endpoint
      description: GraphQL interface to HR database with role-based access control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: GraphQL query string
                variables:
                  type: object
                  description: GraphQL query variables
                operationName:
                  type: string
                  description: Optional operation name
      responses:
        '200':
          description: GraphQL query executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Query result data
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                        locations:
                          type: array
                          items:
                            type: object
                        path:
                          type: array
                          items:
                            type: string
        '400':
          description: Invalid GraphQL query or syntax error
        '403':
          description: Insufficient permissions for requested data

  /graphiql:
    get:
      summary: GraphiQL development interface
      description: Interactive GraphQL explorer for development
      responses:
        '200':
          description: GraphiQL interface loaded successfully
          content:
            text/html:
              schema:
                type: string

components:
  schemas:
    PostGraphileConfig:
      type: object
      properties:
        database_url:
          type: string
          format: uri
          example: postgresql://postgres:postgres123@postgres-dev:5432/hr_system
        schema:
          type: array
          items:
            type: string
          example: [hr_public]
          description: PostgreSQL schemas to expose
        jwt_secret:
          type: string
          description: JWT signing secret for authentication
        jwt_audiences:
          type: array
          items:
            type: string
          example: [postgraphile]
        role_claim_path:
          type: string
          example: role
          description: JWT claim path for database role
        default_role:
          type: string
          example: hr_guest
          description: Default role for unauthenticated requests
        owner_connection_string:
          type: string
          format: uri
          description: Connection string with elevated privileges
        cors_origins:
          type: array
          items:
            type: string
          example: ["http://localhost:5173", "http://localhost:3000"]
      required:
        - database_url
        - schema
        - jwt_secret
        - default_role

    RoleCapabilities:
      type: object
      properties:
        hr_guest:
          type: object
          properties:
            level:
              type: integer
              example: 0
            permissions:
              type: array
              items:
                type: string
              example: [public_read]
        hr_employee:
          type: object
          properties:
            level:
              type: integer
              example: 25
            permissions:
              type: array
              items:
                type: string
              example: [profile_read, profile_update, leave_create]
        hr_manager:
          type: object
          properties:
            level:
              type: integer
              example: 50
            permissions:
              type: array
              items:
                type: string
              example: [team_read, leave_approve, performance_review]
        hr_admin:
          type: object
          properties:
            level:
              type: integer
              example: 75
            permissions:
              type: array
              items:
                type: string
              example: [employee_manage, department_manage, reports_access]
        hr_super_admin:
          type: object
          properties:
            level:
              type: integer
              example: 100
            permissions:
              type: array
              items:
                type: string
              example: [system_admin, all_data_access]

    GraphQLQueries:
      type: object
      description: Expected GraphQL query capabilities after initialization
      properties:
        user_queries:
          type: array
          items:
            type: string
          example:
            - allUsers
            - userById
            - currentUser
        department_queries:
          type: array
          items:
            type: string
          example:
            - allDepartments
            - departmentById
        leave_queries:
          type: array
          items:
            type: string
          example:
            - allLeaveRequests
            - leaveRequestById
            - userLeaveRequests
        mutations:
          type: array
          items:
            type: string
          example:
            - createLeaveRequest
            - updateLeaveRequest
            - approveLeaveRequest