# Events Calendar System - GraphQL API Contract
# Version: 1.0.0
# Feature Branch: 025-events-flesh-out

"""
Event represents a calendar event with support for single and recurring occurrences
"""
type Event {
  id: UUID!
  title: String!
  description: String
  startTime: DateTime!
  endTime: DateTime!
  location: String
  visibility: EventVisibility!
  type: EventType!
  createdBy: Employee!
  rrule: String
  recurrenceId: UUID
  parentEvent: Event
  maxCapacity: Int
  waitlistEnabled: Boolean!
  imageUrl: String
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relationships
  attendees: [EventAttendee!]!
  waitlist: [WaitlistEntry!]!
  comments: [EventComment!]!
  history: [EventHistory!]!

  # Computed fields
  attendeeCount: Int!
  acceptedCount: Int!
  declinedCount: Int!
  tentativeCount: Int!
  pendingCount: Int!
  isFull: Boolean!
  currentUserRsvp: RsvpStatus
}

"""
EventAttendee represents the relationship between a user and an event with RSVP status
"""
type EventAttendee {
  id: UUID!
  event: Event!
  employee: Employee!
  rsvpStatus: RsvpStatus!
  isRequired: Boolean!
  rsvpScope: RsvpScope
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
WaitlistEntry represents a user's position in the event waitlist
"""
type WaitlistEntry {
  id: UUID!
  event: Event!
  employee: Employee!
  position: Int!
  createdAt: DateTime!
}

"""
EventComment represents a user comment on an event
"""
type EventComment {
  id: UUID!
  event: Event!
  author: Employee!
  content: String!
  mentions: [Employee!]!
  createdAt: DateTime!
  updatedAt: DateTime
}

"""
EventHistory represents an immutable audit trail entry for event changes
"""
type EventHistory {
  id: UUID!
  event: Event!
  changedBy: Employee!
  changeType: ChangeType!
  fieldName: String
  oldValue: JSON
  newValue: JSON
  changedAt: DateTime!
}

"""
EventNotification represents a user notification for event-related activities
"""
type EventNotification {
  id: UUID!
  user: Employee!
  event: Event!
  type: NotificationType!
  message: String!
  read: Boolean!
  createdAt: DateTime!
}

"""
NotificationPreferences represents user-configurable notification settings
"""
type NotificationPreferences {
  userId: UUID!
  eventInvites: Boolean!
  eventChanges: Boolean!
  eventReminders: Boolean!
  commentMentions: Boolean!
  waitlistUpdates: Boolean!
  reminderTimes: [Int!]!
}

# Enums
enum EventVisibility {
  PUBLIC
  PRIVATE
}

enum EventType {
  MEETING
  TRAINING
  SOCIAL
  CONFERENCE
  OTHER
}

enum RsvpStatus {
  PENDING
  ACCEPTED
  DECLINED
  TENTATIVE
}

enum RsvpScope {
  THIS_EVENT
  THIS_AND_FUTURE
  ALL_EVENTS
}

enum ChangeType {
  CREATED
  UPDATED
  DELETED
  OWNERSHIP_TRANSFER
  ATTENDEE_ADDED
  ATTENDEE_REMOVED
}

enum NotificationType {
  INVITE
  CHANGE
  CANCEL
  REMOVE
  COMMENT
  MENTION
  WAITLIST
  REMINDER
}

enum RRuleFrequency {
  DAILY
  WEEKLY
  MONTHLY
  YEARLY
}

# Input Types
input EventInput {
  title: String!
  description: String
  startTime: DateTime!
  endTime: DateTime!
  location: String
  visibility: EventVisibility!
  type: EventType!
  rrule: String
  maxCapacity: Int
  waitlistEnabled: Boolean
  attendeeIds: [UUID!]
}

input RecurringEventInput {
  title: String!
  description: String
  startTime: DateTime!
  endTime: DateTime!
  location: String
  visibility: EventVisibility!
  type: EventType!
  rrule: RecurrenceRuleInput!
  maxCapacity: Int
  waitlistEnabled: Boolean
  attendeeIds: [UUID!]
}

input RecurrenceRuleInput {
  frequency: RRuleFrequency!
  interval: Int!
  until: DateTime
  count: Int
  byWeekday: [Int!]
  byMonthDay: [Int!]
}

input NotificationPreferencesInput {
  eventInvites: Boolean
  eventChanges: Boolean
  eventReminders: Boolean
  commentMentions: Boolean
  waitlistUpdates: Boolean
  reminderTimes: [Int!]
}

# Queries
extend type Query {
  """
  Get a single event by ID. Returns null if not found or user lacks permission.
  """
  event(id: UUID!): Event

  """
  List events with optional filters. Respects user permissions (RLS).
  """
  events(
    start: DateTime
    end: DateTime
    visibility: EventVisibility
    type: EventType
    limit: Int = 50
    offset: Int = 0
  ): [Event!]!

  """
  Get current user's events with optional RSVP filter
  """
  myEvents(
    start: DateTime
    end: DateTime
    rsvpStatus: RsvpStatus
  ): [Event!]!

  """
  Expand recurring event into individual instances for a date range
  """
  recurringEventInstances(
    eventId: UUID!
    start: DateTime!
    end: DateTime!
  ): [Event!]!

  """
  Find events that conflict with the given time range for current user
  """
  conflictingEvents(
    startTime: DateTime!
    endTime: DateTime!
  ): [Event!]!

  """
  Get current user's notifications
  """
  myNotifications(
    unreadOnly: Boolean = false
    limit: Int = 50
  ): [EventNotification!]!

  """
  Get current user's notification preferences
  """
  notificationPreferences: NotificationPreferences!
}

# Mutations
extend type Mutation {
  # Event CRUD
  """
  Create a new single event. Returns the created event.
  """
  createEvent(input: EventInput!): Event!

  """
  Update an existing event. Only creator can update.
  """
  updateEvent(id: UUID!, input: EventInput!): Event!

  """
  Delete an event. Only creator can delete.
  """
  deleteEvent(id: UUID!): Boolean!

  # Recurring Events
  """
  Create a new recurring event series
  """
  createRecurringEvent(input: RecurringEventInput!): Event!

  """
  Update recurring event with scope control
  """
  updateRecurringEvent(
    id: UUID!
    scope: RecurrenceScope!
    input: EventInput!
  ): Event!

  """
  Delete recurring event with scope control
  """
  deleteRecurringEvent(
    id: UUID!
    scope: RecurrenceScope!
  ): Boolean!

  # RSVP
  """
  Update current user's RSVP status. Scope applies to recurring events.
  Throws error if event is full (must join waitlist).
  """
  updateRsvpStatus(
    eventId: UUID!
    status: RsvpStatus!
    scope: RecurrenceScope
  ): EventAttendee!

  # Attendee Management (private events only)
  """
  Add attendees to a private event. Only creator can add attendees.
  """
  addAttendees(
    eventId: UUID!
    employeeIds: [UUID!]!
  ): [EventAttendee!]!

  """
  Remove an attendee from a private event. Only creator can remove attendees.
  """
  removeAttendee(
    eventId: UUID!
    employeeId: UUID!
  ): Boolean!

  # Waitlist
  """
  Join the waitlist for a full event. Returns position in queue.
  """
  joinWaitlist(eventId: UUID!): WaitlistEntry!

  """
  Leave the waitlist for an event
  """
  leaveWaitlist(eventId: UUID!): Boolean!

  # Comments
  """
  Post a comment on an event. Mentions trigger notifications.
  """
  createEventComment(
    eventId: UUID!
    content: String!
    mentions: [UUID!]
  ): EventComment!

  """
  Update own comment. Only author can update.
  """
  updateEventComment(
    id: UUID!
    content: String!
  ): EventComment!

  """
  Delete own comment. Only author can delete.
  """
  deleteEventComment(id: UUID!): Boolean!

  # Notifications
  """
  Mark a notification as read
  """
  markNotificationRead(id: UUID!): Boolean!

  """
  Mark all notifications as read for current user
  """
  markAllNotificationsRead: Boolean!

  """
  Update notification preferences for current user
  """
  updateNotificationPreferences(
    prefs: NotificationPreferencesInput!
  ): NotificationPreferences!

  # Images
  """
  Upload an image for an event. Max 10 MB, JPEG/PNG/GIF/WebP.
  Returns optimized image URL.
  """
  uploadEventImage(
    eventId: UUID!
    image: Upload!
  ): String!

  """
  Delete the image for an event
  """
  deleteEventImage(eventId: UUID!): Boolean!
}

# Subscriptions
extend type Subscription {
  """
  Subscribe to real-time updates for a specific event
  """
  eventUpdated(eventId: UUID!): Event!

  """
  Subscribe to real-time notifications for current user
  """
  notificationReceived: EventNotification!

  """
  Subscribe to real-time RSVP updates for a specific event
  """
  attendeeUpdated(eventId: UUID!): EventAttendee!
}

# Scalar Types (assuming these are defined elsewhere in schema)
scalar UUID
scalar DateTime
scalar JSON
scalar Upload
