# GraphQL Contract: Events UI Integration
# Feature: 026-integrate-ui-components
# Date: 2025-10-08
#
# This contract defines GraphQL operations for integrating
# comments, history, and waitlist components into EventDetailsDialog.

# ============================================================================
# QUERIES
# ============================================================================

"""
Fetch comments for an event with pagination.
Pagination: 20 comments per page (from clarification).
"""
query EventComments($eventId: UUID!, $limit: Int = 20, $offset: Int = 0) {
  eventComments(
    filter: { eventId: { equalTo: $eventId } }
    first: $limit
    offset: $offset
    orderBy: CREATED_AT_DESC
  ) {
    nodes {
      id
      eventId
      employeeId
      content           # XSS-sanitized plain text
      mentions          # Array of @mentioned usernames
      createdAt
      updatedAt
      employeeByEmployeeId {
        id
        displayName
        avatarUrl
      }
    }
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
  }
}

"""
Fetch event change history with pagination.
Pagination: 25 entries per page (from clarification).
"""
query EventHistory($eventId: UUID!, $limit: Int = 25, $offset: Int = 0) {
  eventHistories(
    filter: { eventId: { equalTo: $eventId } }
    first: $limit
    offset: $offset
    orderBy: CREATED_AT_DESC
  ) {
    nodes {
      id
      eventId
      changedBy
      fieldName         # e.g., "title", "startTime", "maxCapacity"
      oldValue
      newValue
      changeType        # created | updated | deleted
      createdAt
      employeeByChangedBy {
        id
        displayName
      }
    }
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
  }
}

"""
Check if current user is on waitlist for an event.
Returns position (FIFO ordering) if on waitlist.
"""
query UserWaitlistStatus($eventId: UUID!, $userId: UUID!) {
  eventWaitlists(
    filter: {
      and: [
        { eventId: { equalTo: $eventId } }
        { employeeId: { equalTo: $userId } }
      ]
    }
  ) {
    nodes {
      id
      position          # FIFO position (1 = first in line)
      joinedAt
    }
  }
}

# ============================================================================
# MUTATIONS
# ============================================================================

"""
Create a new comment on an event.
Content is XSS-sanitized server-side (strips HTML/JavaScript).
@mentions are extracted from sanitized content.

Error Handling (FR-017a, FR-017b):
- Returns inline error message on failure
- User can retry without page refresh
"""
mutation CreateEventComment(
  $eventId: UUID!,
  $content: String!,
  $mentions: [String!]
) {
  createEventComment(input: {
    eventComment: {
      eventId: $eventId
      content: $content      # Server sanitizes: strips HTML/JS
      mentions: $mentions    # Extracted @usernames
    }
  }) {
    eventComment {
      id
      content
      mentions
      createdAt
      employeeByEmployeeId {
        id
        displayName
        avatarUrl
      }
    }
  }
}

"""
Update an existing comment (own comments only - FR-020).
Content is XSS-sanitized server-side.

Authorization:
- RBAC check: user must be comment author
- Returns error if user is not author
"""
mutation UpdateEventComment(
  $commentId: UUID!,
  $content: String!
) {
  updateEventCommentById(input: {
    id: $commentId
    eventCommentPatch: {
      content: $content      # Server sanitizes: strips HTML/JS
      updatedAt: "now()"
    }
  }) {
    eventComment {
      id
      content
      mentions
      updatedAt
      employeeByEmployeeId {
        id
        displayName
        avatarUrl
      }
    }
  }
}

"""
Delete a comment (own comments only - FR-020).

Authorization:
- RBAC check: user must be comment author
- Returns error if user is not author
"""
mutation DeleteEventComment($commentId: UUID!) {
  deleteEventCommentById(input: { id: $commentId }) {
    deletedEventCommentId
  }
}

"""
Join event waitlist when event is at capacity.

Preconditions (validated server-side):
- Event must have maxCapacity set
- Event must be full (acceptedCount >= maxCapacity)
- Event must have waitlistEnabled = true
- User must not already be on waitlist

Error Handling (FR-012a, FR-012b):
- Returns inline error message on failure
- User can retry without page refresh
"""
mutation JoinEventWaitlist($eventId: UUID!) {
  createEventWaitlist(input: {
    eventWaitlist: {
      eventId: $eventId
      # position calculated server-side: MAX(position) + 1 (FIFO)
    }
  }) {
    eventWaitlist {
      id
      position
      joinedAt
    }
  }
}

"""
Leave event waitlist.

Side Effect:
- Server reorders remaining waitlist positions (position = position - 1)
- Maintains FIFO ordering
"""
mutation LeaveEventWaitlist($eventId: UUID!, $userId: UUID!) {
  deleteEventWaitlist(input: {
    filter: {
      and: [
        { eventId: { equalTo: $eventId } }
        { employeeId: { equalTo: $userId } }
      ]
    }
  }) {
    deletedEventWaitlistId
  }
}

# ============================================================================
# TYPE DEFINITIONS (for reference)
# ============================================================================

"""
Event comment with XSS-sanitized content and @mention support.
"""
type EventComment {
  id: UUID!
  eventId: UUID!
  employeeId: UUID!
  content: String!              # Plain text, HTML/JS stripped
  mentions: [String!]!          # Array of @mentioned usernames
  createdAt: DateTime!
  updatedAt: DateTime!
  employeeByEmployeeId: Employee
}

"""
Event change history entry (read-only, immutable).
"""
type EventHistory {
  id: UUID!
  eventId: UUID!
  changedBy: UUID!
  fieldName: String!            # e.g., "title", "startTime"
  oldValue: String
  newValue: String
  changeType: ChangeType!       # created | updated | deleted
  createdAt: DateTime!
  employeeByChangedBy: Employee
}

"""
Event waitlist entry with FIFO position.
"""
type EventWaitlist {
  id: UUID!
  eventId: UUID!
  employeeId: UUID!
  position: Int!                # FIFO position (1-indexed)
  joinedAt: DateTime!
}

enum ChangeType {
  CREATED
  UPDATED
  DELETED
}

# ============================================================================
# VALIDATION CONTRACTS
# ============================================================================

# Comment Content Validation (FR-017c, FR-017d):
# - Input: 1-5000 characters (before sanitization)
# - Sanitization: Strip all HTML tags, script tags, event handlers
# - Preserve: Plain text + @mention patterns (@username)
# - Output: Sanitized plain text stored in database

# Pagination Limits (from clarifications):
# - Comments: $limit default 20, max 100
# - History: $limit default 25, max 100

# Timestamp Display (FR-021, FR-022):
# - Comments ≤48 hours old: Relative ("2 hours ago")
# - Comments >48 hours old: Absolute ("Jan 15, 2025 3:30 PM")
# - Uses date-fns library client-side

# Error Handling (FR-017a, FR-017b, FR-012a, FR-012b):
# - Inline error messages below failed action
# - No page refresh required for retry
# - Clear error state on retry

# Backward Compatibility (FR-028, FR-029, FR-030):
# - All queries return empty arrays for events without comments/history
# - UI gracefully handles missing data (no tabs shown if no data)
# - Existing EventDetailsDialog functionality unchanged
