openapi: 3.0.3
info:
  title: SvelteHR Authentication API
  version: 1.0.0
  description: Authentication endpoints for axum-login integration

servers:
  - url: http://localhost:4000
    description: Development server

paths:
  /auth/login:
    post:
      summary: User login
      description: Authenticate user with email and password, establish session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User email address
                password:
                  type: string
                  minLength: 8
                  description: User password
      responses:
        '200':
          description: Login successful, session established
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        enum: [employee, manager, hr_admin, system_admin]
                  session_expires:
                    type: string
                    format: date-time
          headers:
            Set-Cookie:
              schema:
                type: string
                description: HttpOnly session cookie
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Too many login attempts'
                  retry_after:
                    type: integer
                    description: Seconds to wait before retry
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Invalid email or password'
        '423':
          description: Account locked due to failed attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Account temporarily locked'
                  unlock_time:
                    type: string
                    format: date-time

  /auth/logout:
    post:
      summary: User logout
      description: Terminate current user session
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Logged out successfully'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Authentication required'

  /auth/me:
    get:
      summary: Get current user info
      description: Retrieve information about the currently authenticated user
      security:
        - sessionAuth: []
      responses:
        '200':
          description: User information retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        enum: [employee, manager, hr_admin, system_admin]
                      last_login:
                        type: string
                        format: date-time
        '401':
          description: Not authenticated

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie set by login endpoint

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error
