# =============================================================================
# SYSTEM ADMINISTRATION EXTENSIONS
# =============================================================================

enum RollbackStatus {
  PENDING
  APPROVED
  REJECTED
  COMPLETED
}

type RollbackRequest {
  id: UUID!
  requesterId: UUID!
  requester: User!
  resourceType: String!
  resourceId: UUID!
  rollbackToTimestamp: DateTime!
  status: RollbackStatus!
  approverId: UUID
  approver: User
  completedAt: DateTime
  createdAt: DateTime!
}

type BulkRollbackBatch {
  id: UUID!
  batchName: String!
  requesterId: UUID!
  requester: User!
  totalItems: Int!
  completedItems: Int!
  status: String!
  startedAt: DateTime
  completedAt: DateTime
  createdAt: DateTime!
  items: [BulkRollbackItem!]!
}

type BulkRollbackItem {
  id: UUID!
  batchId: UUID!
  batch: BulkRollbackBatch!
  resourceType: String!
  resourceId: UUID!
  rollbackToTimestamp: DateTime!
  status: String!
  errorMessage: String
  completedAt: DateTime
}

type ActivityLog {
  id: UUID!
  userId: UUID
  user: User
  actionType: String!
  resourceType: String
  resourceId: UUID
  details: JSON
  ipAddress: String
  userAgent: String
  createdAt: DateTime!
}

type HRReport {
  id: UUID!
  reportName: String!
  reportType: String!
  reportData: JSON!
  generatorId: UUID!
  generator: User!
  generatedAt: DateTime!
}

type CompensationBand {
  id: UUID!
  bandName: String!
  minSalary: Float!
  maxSalary: Float!
  currency: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PayrollRecord {
  id: UUID!
  employeeId: UUID!
  employee: User!
  payPeriodStart: Date!
  payPeriodEnd: Date!
  grossPay: Float!
  netPay: Float!
  deductions: JSON
  bonuses: JSON
  processedAt: DateTime!
  processorId: UUID!
  processor: User!
  createdAt: DateTime!
}

