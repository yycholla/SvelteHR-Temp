  keyName: String!
  algorithm: String!
  createdAt: DateTime!
  rotatedAt: DateTime
  active: Boolean!
}

# =============================================================================
# QUERY EXTENSIONS
# =============================================================================

extend type Query {
  # Employee Management
  employeeSkill(id: UUID!): EmployeeSkill
  employeeSkills(
    filter: EmployeeSkillFilter
    first: Int
    after: String
  ): EmployeeSkillConnection!

  employeeCertification(id: UUID!): EmployeeCertification
  employeeCertifications(
    filter: EmployeeCertificationFilter
    first: Int
    after: String
  ): EmployeeCertificationConnection!

  employeeVehicle(id: UUID!): EmployeeVehicle
  employeeVehicles(employeeId: UUID!): [EmployeeVehicle!]!

  emergencyContact(id: UUID!): EmergencyContact
  emergencyContacts(employeeId: UUID!): [EmergencyContact!]!

  employeeGoal(id: UUID!): EmployeeGoal
  employeeGoals(employeeId: UUID!): [EmployeeGoal!]!

  # Documents
  document(id: UUID!): Document
  documents(
    filter: DocumentFilter
    first: Int
    after: String
  ): DocumentConnection!

  documentCategory(id: UUID!): DocumentCategory
  documentCategories: [DocumentCategory!]!

  # Time Management
  timeOffPolicy(id: UUID!): TimeOffPolicy
  timeOffPolicies: [TimeOffPolicy!]!

  attendanceRecord(id: UUID!): AttendanceRecord
  attendanceRecords(employeeId: UUID!, startDate: Date!, endDate: Date!): [AttendanceRecord!]!

  # Analytics (Materialized Views)
  dashboardSummaries: DashboardSummary
  departmentMetrics(
    filter: DepartmentMetricFilter
    first: Int
    after: String
  ): DepartmentMetricConnection!
  goalStatistics(userId: UUID, quarter: String, year: Int): [GoalStatistic!]!
  reportAnalytics(departmentId: UUID, startMonth: Date!, endMonth: Date!): [ReportAnalytic!]!

  # System Administration
  rollbackRequest(id: UUID!): RollbackRequest
  rollbackRequests(status: RollbackStatus): [RollbackRequest!]!

  activityLog(id: UUID!): ActivityLog
  activityLogs(userId: UUID, limit: Int): [ActivityLog!]!

  # Event Extensions
  eventComment(id: UUID!): EventComment
  eventComments(eventId: UUID!): [EventComment!]!

  # Task Extensions
  taskType(id: UUID!): TaskType
  taskTypes: [TaskType!]!

  # Review Extensions
  reviewTemplate(id: UUID!): ReviewTemplate
  reviewTemplates: [ReviewTemplate!]!
}

# =============================================================================
# MUTATION EXTENSIONS
# =============================================================================

extend type Mutation {
  # Employee Management
  createEmployeeSkill(input: CreateEmployeeSkillInput!): EmployeeSkill!
  updateEmployeeSkill(input: UpdateEmployeeSkillInput!): EmployeeSkill!
  deleteEmployeeSkill(id: UUID!): Boolean!

  createEmployeeCertification(input: CreateEmployeeCertificationInput!): EmployeeCertification!
  deleteEmployeeCertification(id: UUID!): Boolean!

  createEmployeeVehicle(make: String!, model: String!, year: Int!, licensePlate: String!, employeeId: UUID!): EmployeeVehicle!
  deleteEmployeeVehicle(id: UUID!): Boolean!

  createEmergencyContact(employeeId: UUID!, contactName: String!, relationship: String!, phoneNumber: String!, isPrimary: Boolean!): EmergencyContact!
  deleteEmergencyContact(id: UUID!): Boolean!

  # Documents
  createDocument(title: String!, filePath: String!, fileSize: Int!, mimeType: String!, uploaderId: UUID!): Document!
  updateDocument(id: UUID!, title: String, description: String): Document!
  deleteDocument(id: UUID!): Boolean!

  # Analytics Refresh (Materialized Views)
  refreshDashboardSummaries: RefreshResult!
  refreshDepartmentMetrics: RefreshResult!
  refreshGoalStatistics: RefreshResult!
  refreshReportAnalytics: RefreshResult!
}

type RefreshResult {
  success: Boolean!
  message: String
  refreshedAt: DateTime!
}
