# GraphQL Schema Extensions for Complete Database Coverage
# Feature: 031-we-have-recently
# Date: 2025-10-11
#
# This schema extends the existing Rust GraphQL API to match PostGraphile's
# complete database coverage. It follows Relay cursor pagination spec and
# camelCase naming conventions.

# =============================================================================
# EMPLOYEE MANAGEMENT EXTENSIONS
# =============================================================================

enum ProficiencyLevel {
  BEGINNER
  INTERMEDIATE
  ADVANCED
  EXPERT
}

type EmployeeSkill {
  id: UUID!
  employeeId: UUID!
  employee: User!
  skillName: String!
  proficiencyLevel: ProficiencyLevel!
  yearsExperience: Float
  verified: Boolean!
  verifierId: UUID
  verifier: User
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EmployeeSkillConnection implements Connection {
  edges: [EmployeeSkillEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type EmployeeSkillEdge {
  cursor: String!
  node: EmployeeSkill!
}

input EmployeeSkillFilter {
  employeeId: UUID
  skillName: ComparisonInput
  proficiencyLevel: ProficiencyLevel
  verified: Boolean
}

input CreateEmployeeSkillInput {
  employeeId: UUID!
  skillName: String!
  proficiencyLevel: ProficiencyLevel!
  yearsExperience: Float
  verified: Boolean
}

input UpdateEmployeeSkillInput {
  id: UUID!
  skillName: String
  proficiencyLevel: ProficiencyLevel
  yearsExperience: Float
  verified: Boolean
  verifierId: UUID
  updatedAt: DateTime!
}

# EmployeeCertification
type EmployeeCertification {
  id: UUID!
  employeeId: UUID!
  employee: User!
  certificationName: String!
  issuingOrganization: String!
  issueDate: Date!
  expirationDate: Date
  certificationNumber: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EmployeeCertificationConnection implements Connection {
  edges: [EmployeeCertificationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type EmployeeCertificationEdge {
  cursor: String!
  node: EmployeeCertification!
}

input EmployeeCertificationFilter {
  employeeId: UUID
  certificationName: ComparisonInput
  expirationDate: ComparisonInput
}

input CreateEmployeeCertificationInput {
  employeeId: UUID!
  certificationName: String!
  issuingOrganization: String!
  issueDate: Date!
  expirationDate: Date
  certificationNumber: String
}

# EmployeeVehicle
type EmployeeVehicle {
  id: UUID!
  employeeId: UUID!
  employee: User!
  make: String!
  model: String!
  year: Int!
  licensePlate: String!
  color: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EmployeeVehicleConnection implements Connection {
  edges: [EmployeeVehicleEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type EmployeeVehicleEdge {
  cursor: String!
  node: EmployeeVehicle!
}

# EmergencyContact
type EmergencyContact {
  id: UUID!
  employeeId: UUID!
  employee: User!
  contactName: String!
  relationship: String!
  phoneNumber: String!
  email: String
  isPrimary: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# EmployeeGoal
enum GoalStatus {
  NOT_STARTED
  IN_PROGRESS
  COMPLETED
  CANCELLED
}

type EmployeeGoal {
  id: UUID!
  employeeId: UUID!
  employee: User!
  goalTitle: String!
  goalDescription: String
  targetDate: Date
  status: GoalStatus!
  progressPercentage: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# =============================================================================
# DOCUMENT MANAGEMENT EXTENSIONS
# =============================================================================

type Document {
  id: UUID!
  title: String!
  description: String
  categoryId: UUID
  category: DocumentCategory
  filePath: String!
  fileSize: Int!
  mimeType: String!
  uploaderId: UUID!
  uploader: User!
  versions: [DocumentVersion!]!
  assignments: [DocumentAssignment!]!
  accessLogs: [DocumentAccessLog!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DocumentConnection implements Connection {
  edges: [DocumentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type DocumentEdge {
  cursor: String!
  node: Document!
}

type DocumentVersion {
  id: UUID!
  documentId: UUID!
  document: Document!
  versionNumber: Int!
  filePath: String!
  fileSize: Int!
  uploaderId: UUID!
  uploader: User!
  changeSummary: String
  createdAt: DateTime!
}

type DocumentCategory {
  id: UUID!
  name: String!
  description: String
  parentCategoryId: UUID
  parentCategory: DocumentCategory
  childCategories: [DocumentCategory!]!
  documents: [Document!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum DocumentAccessLevel {
  READ
  WRITE
  ADMIN
}

type DocumentAssignment {
  id: UUID!
  documentId: UUID!
  document: Document!
  userId: UUID
  user: User
  departmentId: UUID
  department: Department
  accessLevel: DocumentAccessLevel!
  assignedAt: DateTime!
  assignedById: UUID!
  assignedBy: User!
}

enum DocumentAccessType {
  VIEW
  DOWNLOAD
  EDIT
  DELETE
}

type DocumentAccessLog {
  id: UUID!
  documentId: UUID!
  document: Document!
  userId: UUID!
  user: User!
  accessType: DocumentAccessType!
  accessedAt: DateTime!
  ipAddress: String
}

type EncryptedFileStorage {
  id: UUID!
  documentId: UUID!
  document: Document!
  encryptionKeyId: UUID!
  encryptionKey: EncryptionKey!
  createdAt: DateTime!
}

