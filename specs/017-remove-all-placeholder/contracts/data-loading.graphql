"""
Data Loading and Error Handling Schema
For managing data fetching with retry capability
"""

type Query {
  """Get dashboard data with proper error handling"""
  getDashboardData(
    userId: ID!
    includeAnalytics: Boolean = true
  ): DashboardDataResult!

  """Get employee list with pagination"""
  getEmployees(
    page: Int = 1
    limit: Int = 20
    filter: EmployeeFilter
  ): EmployeeListResult!

  """Get department analytics"""
  getDepartmentAnalytics(
    departmentId: ID
    dateRange: DateRangeInput
  ): AnalyticsResult!
}

"""Filter for employee queries"""
input EmployeeFilter {
  department: ID
  role: String
  status: EmployeeStatus
  search: String
}

"""Employee status enum"""
enum EmployeeStatus {
  ACTIVE
  INACTIVE
  ON_LEAVE
  TERMINATED
}

"""Date range for analytics"""
input DateRangeInput {
  start: DateTime!
  end: DateTime!
}

"""Dashboard data result with error handling"""
type DashboardDataResult {
  success: Boolean!
  data: DashboardData
  error: ErrorInfo
  retryable: Boolean!
}

"""Dashboard data structure"""
type DashboardData {
  summary: DashboardSummary!
  recentActivities: [Activity!]!
  upcomingEvents: [Event!]!
  metrics: [Metric!]!
  lastUpdated: DateTime!
}

"""Dashboard summary statistics"""
type DashboardSummary {
  totalEmployees: Int!
  activeEmployees: Int!
  departmentCount: Int!
  pendingRequests: Int!
  avgTenure: String!
}

"""Activity item"""
type Activity {
  id: ID!
  type: String!
  description: String!
  timestamp: DateTime!
  userId: ID!
  userName: String!
}

"""Event item"""
type Event {
  id: ID!
  title: String!
  date: DateTime!
  type: String!
  participants: Int!
}

"""Metric item"""
type Metric {
  name: String!
  value: Float!
  change: Float!
  trend: TrendDirection!
}

"""Trend direction enum"""
enum TrendDirection {
  UP
  DOWN
  STABLE
}

"""Employee list result with pagination"""
type EmployeeListResult {
  success: Boolean!
  data: EmployeeListData
  error: ErrorInfo
  retryable: Boolean!
}

"""Employee list data"""
type EmployeeListData {
  employees: [Employee!]!
  pagination: PaginationInfo!
  totalCount: Int!
}

"""Employee data"""
type Employee {
  id: ID!
  firstName: String!
  lastName: String!
  email: String!
  role: String!
  department: Department!
  status: EmployeeStatus!
  hireDate: DateTime!
  phoneNumber: String
  lastActive: DateTime
}

"""Department data"""
type Department {
  id: ID!
  name: String!
  code: String!
  managerName: String
}

"""Pagination information"""
type PaginationInfo {
  currentPage: Int!
  totalPages: Int!
  pageSize: Int!
  hasNext: Boolean!
  hasPrevious: Boolean!
}

"""Analytics result"""
type AnalyticsResult {
  success: Boolean!
  data: AnalyticsData
  error: ErrorInfo
  retryable: Boolean!
  emptyReason: EmptyDataReason
}

"""Analytics data"""
type AnalyticsData {
  departmentDistribution: [DepartmentStat!]!
  performanceMetrics: [PerformanceStat!]!
  leaveStatistics: [LeaveStat!]!
  growthTrends: [GrowthStat!]!
  calculatedAt: DateTime!
}

"""Department statistic"""
type DepartmentStat {
  department: String!
  count: Int!
  percentage: Float!
}

"""Performance statistic"""
type PerformanceStat {
  category: String!
  avgRating: Float!
  count: Int!
}

"""Leave statistic"""
type LeaveStat {
  leaveType: String!
  count: Int!
  avgDuration: Float!
}

"""Growth statistic"""
type GrowthStat {
  period: String!
  headcount: Int!
  growth: Float!
}

"""Error information"""
type ErrorInfo {
  code: String!
  message: String!
  details: String
  timestamp: DateTime!
}

"""Reason for empty data"""
enum EmptyDataReason {
  NO_DATA
  INSUFFICIENT_DATA
  FILTER_NO_RESULTS
  PERMISSION_DENIED
}