# HR Management GraphQL Schema
# Feature: 003-graphql-we-need
# Generated from data model for contract testing

scalar DateTime
scalar Date
scalar Time
scalar Decimal
scalar JSON
scalar UUID

# Enums
enum EmploymentStatus {
  ACTIVE
  INACTIVE
  TERMINATED
}

enum PayrollStatus {
  DRAFT
  PROCESSED
  PAID
}

enum TimeEntryStatus {
  PENDING
  APPROVED
  REJECTED
}

enum ReviewStatus {
  DRAFT
  PENDING
  COMPLETED
}

enum LeaveType {
  VACATION
  SICK
  PERSONAL
  MEDICAL
}

enum LeaveStatus {
  PENDING
  APPROVED
  DENIED
  CANCELLED
}

enum DocumentCategory {
  CONTRACT
  HANDBOOK
  FORM
  CERTIFICATE
}

# Core Types
type Employee {
  id: UUID!
  firstName: String!
  lastName: String!
  email: String!
  employeeId: String
  isActive: Boolean!
  hireDate: Date!
  terminationDate: Date
  jobTitle: String
  phoneNumber: String
  address: JSON
  
  # Computed fields
  fullName: String!
  yearsOfService: Int!
  
  # Relationships
  department: Department
  manager: Employee
  directReports: [Employee!]!
  roles: [Role!]!
  payrollRecords(
    limit: Int = 20
    offset: Int = 0
    orderBy: PayrollOrderBy = CREATED_DESC
  ): PayrollConnection!
  timeEntries(
    startDate: Date
    endDate: Date
    limit: Int = 50
    offset: Int = 0
  ): TimeEntryConnection!
  performanceReviews(
    limit: Int = 10
    offset: Int = 0
  ): PerformanceReviewConnection!
  leaveRequests(
    status: LeaveStatus
    limit: Int = 20
    offset: Int = 0
  ): LeaveRequestConnection!
  documents(
    category: DocumentCategory
    limit: Int = 20
    offset: Int = 0
  ): DocumentConnection!
}

type Department {
  id: UUID!
  name: String!
  description: String
  budgetCode: String
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  
  # Relationships
  parent: Department
  children: [Department!]!
  employees(
    isActive: Boolean = true
    limit: Int = 50
    offset: Int = 0
  ): EmployeeConnection!
  manager: Employee
  
  # Computed fields
  employeeCount: Int!
  totalBudget: Decimal
}

type Role {
  id: UUID!
  name: String!
  description: String
  level: Int!
  isActive: Boolean!
  permissions: [String!]!
  
  # Relationships
  employees: [Employee!]!
  parent: Role
  children: [Role!]!
  
  # Computed fields
  employeeCount: Int!
}

type PayrollRecord {
  id: UUID!
  payPeriodStart: Date!
  payPeriodEnd: Date!
  grossPay: Decimal!
  netPay: Decimal!
  taxes: JSON!
  deductions: JSON
  bonuses: JSON
  status: PayrollStatus!
  processedAt: DateTime
  
  # Relationships
  employee: Employee!
  
  # Computed fields
  totalDeductions: Decimal!
  effectiveTaxRate: Decimal!
}

type TimeEntry {
  id: UUID!
  date: Date!
  startTime: Time!
  endTime: Time
  breakMinutes: Int!
  hoursWorked: Decimal!
  overtime: Boolean!
  status: TimeEntryStatus!
  notes: String
  
  # Relationships
  employee: Employee!
  approver: Employee
  
  # Computed fields
  regularHours: Decimal!
  overtimeHours: Decimal!
}

type PerformanceReview {
  id: UUID!
  reviewPeriodStart: Date!
  reviewPeriodEnd: Date!
  overallRating: Int!
  goals: JSON!
  feedback: String!
  status: ReviewStatus!
  completedAt: DateTime
  
  # Relationships
  employee: Employee!
  reviewer: Employee!
}

type LeaveRequest {
  id: UUID!
  leaveType: LeaveType!
  startDate: Date!
  endDate: Date!
  totalDays: Int!
  reason: String
  status: LeaveStatus!
  appliedAt: DateTime!
  respondedAt: DateTime
  
  # Relationships
  employee: Employee!
  approver: Employee
  
  # Computed fields
  isOverdue: Boolean!
  daysRemaining: Int
}

type Document {
  id: UUID!
  fileName: String!
  fileSize: Int!
  mimeType: String!
  storageKey: String!
  category: DocumentCategory!
  isConfidential: Boolean!
  uploadedAt: DateTime!
  expiresAt: DateTime
  
  # Relationships
  employee: Employee
  uploadedBy: Employee!
  
  # Computed fields
  isExpired: Boolean!
  downloadUrl: String!
}

type AuditLog {
  id: UUID!
  action: String!
  entityType: String!
  entityId: UUID!
  oldValues: JSON
  newValues: JSON
  timestamp: DateTime!
  ipAddress: String
  userAgent: String
  
  # Relationships
  user: Employee!
}

# Connection types for pagination
type EmployeeConnection {
  nodes: [Employee!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type DepartmentConnection {
  nodes: [Department!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type PayrollConnection {
  nodes: [PayrollRecord!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type TimeEntryConnection {
  nodes: [TimeEntry!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type PerformanceReviewConnection {
  nodes: [PerformanceReview!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type LeaveRequestConnection {
  nodes: [LeaveRequest!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type DocumentConnection {
  nodes: [Document!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

# Order by enums
enum EmployeeOrderBy {
  CREATED_ASC
  CREATED_DESC
  NAME_ASC
  NAME_DESC
  HIRE_DATE_ASC
  HIRE_DATE_DESC
}

enum PayrollOrderBy {
  CREATED_ASC
  CREATED_DESC
  PAY_PERIOD_ASC
  PAY_PERIOD_DESC
}

# Input types for mutations
input EmployeeInput {
  firstName: String!
  lastName: String!
  email: String!
  employeeId: String
  hireDate: Date!
  jobTitle: String
  phoneNumber: String
  address: JSON
  departmentId: UUID
  managerId: UUID
  roleIds: [UUID!]
}

input EmployeeUpdateInput {
  firstName: String
  lastName: String
  email: String
  employeeId: String
  jobTitle: String
  phoneNumber: String
  address: JSON
  departmentId: UUID
  managerId: UUID
  roleIds: [UUID!]
  isActive: Boolean
}

input DepartmentInput {
  name: String!
  description: String
  budgetCode: String
  parentId: UUID
  managerId: UUID
}

input TimeEntryInput {
  date: Date!
  startTime: Time!
  endTime: Time
  breakMinutes: Int = 0
  notes: String
}

input LeaveRequestInput {
  leaveType: LeaveType!
  startDate: Date!
  endDate: Date!
  reason: String
}

input DocumentUploadInput {
  fileName: String!
  fileSize: Int!
  mimeType: String!
  category: DocumentCategory!
  isConfidential: Boolean = false
  employeeId: UUID
}

# Query root
type Query {
  # Employee queries
  employee(id: UUID!): Employee
  employees(
    search: String
    departmentId: UUID
    isActive: Boolean = true
    orderBy: EmployeeOrderBy = CREATED_DESC
    limit: Int = 20
    offset: Int = 0
  ): EmployeeConnection!
  
  # Department queries
  department(id: UUID!): Department
  departments(
    search: String
    isActive: Boolean = true
    limit: Int = 20
    offset: Int = 0
  ): DepartmentConnection!
  
  # Role queries
  role(id: UUID!): Role
  roles(
    isActive: Boolean = true
    limit: Int = 20
    offset: Int = 0
  ): [Role!]!
  
  # Time tracking queries
  timeEntries(
    employeeId: UUID
    startDate: Date
    endDate: Date
    status: TimeEntryStatus
    limit: Int = 50
    offset: Int = 0
  ): TimeEntryConnection!
  
  # Leave queries
  leaveRequests(
    employeeId: UUID
    status: LeaveStatus
    startDate: Date
    endDate: Date
    limit: Int = 20
    offset: Int = 0
  ): LeaveRequestConnection!
  
  # Document queries
  documents(
    employeeId: UUID
    category: DocumentCategory
    isConfidential: Boolean
    limit: Int = 20
    offset: Int = 0
  ): DocumentConnection!
  
  # Analytics queries
  departmentStats(departmentId: UUID!): DepartmentStats!
  employeeStats(employeeId: UUID!): EmployeeStats!
  
  # Current user context
  me: Employee!
}

# Mutation root
type Mutation {
  # Employee mutations
  createEmployee(input: EmployeeInput!): Employee!
  updateEmployee(id: UUID!, input: EmployeeUpdateInput!): Employee!
  deactivateEmployee(id: UUID!): Employee!
  
  # Department mutations
  createDepartment(input: DepartmentInput!): Department!
  updateDepartment(id: UUID!, input: DepartmentInput!): Department!
  
  # Time tracking mutations
  createTimeEntry(input: TimeEntryInput!): TimeEntry!
  updateTimeEntry(id: UUID!, input: TimeEntryInput!): TimeEntry!
  approveTimeEntry(id: UUID!): TimeEntry!
  rejectTimeEntry(id: UUID!, reason: String!): TimeEntry!
  
  # Leave mutations
  createLeaveRequest(input: LeaveRequestInput!): LeaveRequest!
  approveLeaveRequest(id: UUID!): LeaveRequest!
  denyLeaveRequest(id: UUID!, reason: String!): LeaveRequest!
  cancelLeaveRequest(id: UUID!): LeaveRequest!
  
  # Document mutations
  uploadDocument(input: DocumentUploadInput!, file: Upload!): Document!
  deleteDocument(id: UUID!): Boolean!
}

# Subscription root
type Subscription {
  # Real-time employee updates
  employeeUpdated(employeeId: UUID): Employee!
  
  # Department changes
  departmentUpdated(departmentId: UUID): Department!
  
  # Leave request notifications
  leaveRequestUpdated(employeeId: UUID): LeaveRequest!
  
  # Time entry approvals
  timeEntryUpdated(employeeId: UUID): TimeEntry!
  
  # General activity feed
  activityFeed: AuditLog!
}

# Analytics types
type DepartmentStats {
  totalEmployees: Int!
  activeEmployees: Int!
  averageYearsOfService: Decimal!
  totalPayrollCost: Decimal!
  pendingLeaveRequests: Int!
  averagePerformanceRating: Decimal!
}

type EmployeeStats {
  totalTimeEntries: Int!
  totalHoursWorked: Decimal!
  totalOvertimeHours: Decimal!
  pendingLeaveRequests: Int!
  approvedLeaveDays: Int!
  lastPerformanceRating: Int
}

# File upload scalar
scalar Upload