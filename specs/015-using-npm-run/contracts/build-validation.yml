openapi: 3.0.3
info:
  title: Svelte 5 Build Validation API
  description: Contract for validating Svelte 5 compatibility fixes
  version: 1.0.0

paths:
  /build/validate:
    post:
      summary: Validate build after applying fixes
      description: Run build process and validate zero warnings requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                batch_id:
                  type: string
                  description: Unique identifier for the fix batch
                  example: 'store-fixes-batch-001'
                fix_type:
                  type: string
                  enum:
                    ['store_subscription', 'component_deprecation', 'event_handler', 'syntax_fix']
                  description: Type of fixes applied in this batch
                files_modified:
                  type: array
                  items:
                    type: string
                  description: List of file paths that were modified
                  example: ['src/lib/components/ui/toast-container.svelte']
              required:
                - batch_id
                - fix_type
                - files_modified
      responses:
        '200':
          description: Build validation successful - zero warnings achieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  warning_count:
                    type: integer
                    example: 0
                  error_count:
                    type: integer
                    example: 0
                  build_time:
                    type: string
                    example: '12.34s'
                  batch_id:
                    type: string
                    example: 'store-fixes-batch-001'
        '400':
          description: Build validation failed - warnings or errors present
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  warning_count:
                    type: integer
                    example: 3
                  error_count:
                    type: integer
                    example: 0
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/BuildWarning'
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/BuildError'

  /runtime/validate:
    post:
      summary: Validate runtime functionality after fixes
      description: Test that pages load without JavaScript errors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                batch_id:
                  type: string
                  description: Batch identifier being tested
                pages_to_test:
                  type: array
                  items:
                    type: string
                  description: List of page routes to test
                  example: ['/dashboard', '/employees', '/settings']
                test_timeout:
                  type: integer
                  description: Timeout in seconds for each page test
                  example: 30
              required:
                - batch_id
                - pages_to_test
      responses:
        '200':
          description: Runtime validation successful - no JavaScript errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  pages_tested:
                    type: integer
                    example: 3
                  total_errors:
                    type: integer
                    example: 0
                  test_results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PageTestResult'
        '400':
          description: Runtime validation failed - JavaScript errors detected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  pages_tested:
                    type: integer
                    example: 3
                  total_errors:
                    type: integer
                    example: 2
                  failed_pages:
                    type: array
                    items:
                      $ref: '#/components/schemas/PageTestResult'

components:
  schemas:
    BuildWarning:
      type: object
      properties:
        file:
          type: string
          example: 'src/lib/components/ui/toast-container.svelte'
        line:
          type: integer
          example: 9
        column:
          type: integer
          example: 12
        message:
          type: string
          example: 'Component uses deprecated event handler syntax'
        severity:
          type: string
          enum: ['warning', 'error']
        category:
          type: string
          enum: ['deprecation', 'compatibility', 'syntax']

    BuildError:
      type: object
      properties:
        file:
          type: string
          example: 'src/lib/components/ui/toast-container.svelte'
        line:
          type: integer
          example: 9
        message:
          type: string
          example: 'Type error: Cannot access property of undefined'
        error_code:
          type: string
          example: 'TS2339'

    PageTestResult:
      type: object
      properties:
        page_route:
          type: string
          example: '/dashboard'
        success:
          type: boolean
          example: true
        load_time:
          type: number
          example: 1.234
        javascript_errors:
          type: array
          items:
            $ref: '#/components/schemas/JavaScriptError'
        console_warnings:
          type: array
          items:
            type: string

    JavaScriptError:
      type: object
      properties:
        message:
          type: string
          example: 'errorStore is not a store with a subscribe method'
        source:
          type: string
          example: 'toast-container.svelte:9:12'
        stack:
          type: string
          example: 'TypeError: errorStore is not a store...'
