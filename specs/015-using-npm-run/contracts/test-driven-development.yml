openapi: 3.0.3
info:
  title: Test-First Development Contract
  description: Contract for validating RED-GREEN-REFACTOR cycle compliance
  version: 1.0.0

paths:
  /tdd/red-phase:
    post:
      summary: Create failing test (RED phase)
      description: Constitutional requirement - write failing test before any implementation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                test_suite:
                  type: string
                  enum:
                    ['store_subscription', 'state_reference', 'event_handler', 'component_syntax']
                target_file:
                  type: string
                  example: '/home/chanway/Projects/SvelteHR/src/lib/components/ui/toast-container.svelte'
                issue_description:
                  type: string
                  example: 'errorStore subscription uses $errorStore.errors instead of errorStore.errors'
                expected_behavior:
                  type: string
                  example: 'Component should subscribe to errorStore.errors and display toast notifications'
              required:
                - test_suite
                - target_file
                - issue_description
                - expected_behavior
      responses:
        '200':
          description: Failing test successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  test_status:
                    type: string
                    enum: ['failing']
                  test_file:
                    type: string
                    example: 'src/lib/components/ui/toast-container.test.ts'
                  test_framework:
                    type: string
                    enum: ['vitest', 'playwright']
                  failure_reason:
                    type: string
                    example: "TypeError: Cannot read property 'subscribe' of undefined"
                  ready_for_green_phase:
                    type: boolean
                    example: true
        '400':
          description: Test is not failing - TDD violation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Test must fail in RED phase before implementation'
                  current_status:
                    type: string
                    example: 'passing'
                  required_action:
                    type: string
                    example: 'Ensure test captures the actual Svelte 5 compatibility issue'

  /tdd/green-phase:
    post:
      summary: Implement minimal fix (GREEN phase)
      description: Make failing test pass with minimal implementation using MCP tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                test_id:
                  type: string
                  example: 'store-subscription-test-001'
                implementation_approach:
                  type: string
                  example: 'Replace $errorStore.errors with errorStore.errors using mcp__serena__replace_symbol_body'
                mcp_tools_required:
                  type: array
                  items:
                    type: string
                  example:
                    [
                      'think_about_task_adherence',
                      'replace_symbol_body',
                      'find_referencing_symbols'
                    ]
              required:
                - test_id
                - implementation_approach
                - mcp_tools_required
      responses:
        '200':
          description: Test now passing - GREEN phase successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  test_status:
                    type: string
                    enum: ['passing']
                  implementation_complete:
                    type: boolean
                    example: true
                  mcp_compliance:
                    type: boolean
                    example: true
                  ready_for_refactor:
                    type: boolean
                    example: true
                  all_tests_passing:
                    type: boolean
                    example: true
        '400':
          description: Test still failing or implementation incomplete
          content:
            application/json:
              schema:
                type: object
                properties:
                  test_status:
                    type: string
                    example: 'failing'
                  error_message:
                    type: string
                    example: 'Implementation did not resolve the compatibility issue'
                  required_action:
                    type: string
                    example: 'Review implementation with MCP tools and adjust approach'

  /tdd/refactor-phase:
    post:
      summary: Improve code quality (REFACTOR phase)
      description: Enhance implementation while keeping tests passing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                test_id:
                  type: string
                refactor_type:
                  type: string
                  enum:
                    ['code_quality', 'performance', 'maintainability', 'constitutional_compliance']
                current_test_status:
                  type: string
                  enum: ['passing']
                refactor_description:
                  type: string
                  example: 'Improve error handling and add TypeScript types'
              required:
                - test_id
                - refactor_type
                - current_test_status
      responses:
        '200':
          description: Refactoring successful - tests still passing
          content:
            application/json:
              schema:
                type: object
                properties:
                  refactor_complete:
                    type: boolean
                    example: true
                  tests_still_passing:
                    type: boolean
                    example: true
                  code_quality_improved:
                    type: boolean
                    example: true
                  ready_for_next_cycle:
                    type: boolean
                    example: true
        '400':
          description: Refactoring broke tests - must revert
          content:
            application/json:
              schema:
                type: object
                properties:
                  tests_broken:
                    type: boolean
                    example: true
                  required_action:
                    type: string
                    example: 'Revert changes and ensure tests pass before refactoring'

  /tdd/cycle-validation:
    get:
      summary: Validate complete TDD cycle
      description: Ensure full RED-GREEN-REFACTOR cycle was followed
      parameters:
        - name: task_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: TDD cycle validation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  cycle_complete:
                    type: boolean
                    example: true
                  red_phase_complete:
                    type: boolean
                    example: true
                  green_phase_complete:
                    type: boolean
                    example: true
                  refactor_phase_complete:
                    type: boolean
                    example: true
                  constitutional_compliance:
                    type: boolean
                    example: true
                  test_coverage:
                    type: number
                    example: 95.5
        '400':
          description: TDD cycle incomplete or invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  cycle_violations:
                    type: array
                    items:
                      $ref: '#/components/schemas/TDDViolation'

components:
  schemas:
    TDDCycle:
      type: object
      properties:
        cycle_id:
          type: string
          example: 'svelte5-fix-cycle-001'
        red_phase:
          $ref: '#/components/schemas/RedPhase'
        green_phase:
          $ref: '#/components/schemas/GreenPhase'
        refactor_phase:
          $ref: '#/components/schemas/RefactorPhase'
        constitutional_compliance:
          type: boolean
          example: true

    RedPhase:
      type: object
      properties:
        test_written:
          type: boolean
          example: true
        test_failing:
          type: boolean
          example: true
        failure_reason:
          type: string
          example: 'Component uses deprecated Svelte 4 syntax'
        test_file:
          type: string
          example: 'src/lib/components/ui/toast-container.test.ts'

    GreenPhase:
      type: object
      properties:
        implementation_complete:
          type: boolean
          example: true
        test_passing:
          type: boolean
          example: true
        mcp_tools_used:
          type: array
          items:
            type: string
          example: ['replace_symbol_body', 'find_referencing_symbols']
        minimal_implementation:
          type: boolean
          example: true

    RefactorPhase:
      type: object
      properties:
        refactoring_complete:
          type: boolean
          example: true
        tests_still_passing:
          type: boolean
          example: true
        code_quality_improved:
          type: boolean
          example: true
        improvements_made:
          type: array
          items:
            type: string
          example: ['Added TypeScript types', 'Improved error handling']

    TDDViolation:
      type: object
      properties:
        violation_type:
          type: string
          enum:
            [
              'no_failing_test',
              'implementation_before_test',
              'refactor_broke_tests',
              'skipped_phase'
            ]
        description:
          type: string
          example: 'Implementation started without failing test'
        phase:
          type: string
          enum: ['red', 'green', 'refactor']
        severity:
          type: string
          enum: ['critical', 'high', 'medium']
        required_remedy:
          type: string
          example: 'Write failing test before any implementation'
