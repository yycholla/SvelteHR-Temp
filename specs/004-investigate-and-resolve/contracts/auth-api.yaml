openapi: 3.0.3
info:
  title: SvelteHR Authorization API
  description: Secure authentication and authorization API for SvelteHR system
  version: 1.0.0
  contact:
    name: SvelteHR Team

servers:
  - url: http://localhost:5173/api
    description: Development server
  - url: https://api.svelteHR.com
    description: Production server

paths:
  /auth/login:
    post:
      summary: Authenticate user with credentials
      description: Validates user credentials and returns JWT tokens via httpOnly cookies
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: 'admin@postgraphile-hr.com'
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: 'AdminPass123!'
                rememberMe:
                  type: boolean
                  default: false
                  description: Extend refresh token lifetime to 30 days
      responses:
        '200':
          description: Authentication successful
          headers:
            Set-Cookie:
              description: JWT access token (httpOnly)
              schema:
                type: string
                example: 'jwt-token=eyJ...; HttpOnly; Secure; SameSite=Strict'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
                  expiresIn:
                    type: integer
                    description: Token expiration in seconds
                    example: 900
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh authentication token
      description: Validates refresh token and issues new access token
      operationId: refreshToken
      tags:
        - Authentication
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Token refresh successful
          headers:
            Set-Cookie:
              description: New JWT access token (httpOnly)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
                  isValid:
                    type: boolean
                    example: true
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Logout user
      description: Revokes user session and clears authentication cookies
      operationId: logoutUser
      tags:
        - Authentication
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logout successful
          headers:
            Set-Cookie:
              description: Clear authentication cookies
              schema:
                type: string
                example: 'jwt-token=; expires=Thu, 01 Jan 1970 00:00:00 GMT'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Logged out successfully'

  /auth/me:
    get:
      summary: Get current user information
      description: Returns authenticated user profile and permissions
      operationId: getCurrentUser
      tags:
        - Authentication
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/change-password:
    post:
      summary: Change user password
      description: Updates user password with proper validation
      operationId: changePassword
      tags:
        - Authentication
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: Must contain uppercase, lowercase, number, and special character
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Password updated successfully'
        '400':
          description: Invalid password format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: '44defe38-ac2a-4956-b341-f840d05ef2d3'
        email:
          type: string
          format: email
          example: 'admin@postgraphile-hr.com'
        displayName:
          type: string
          example: 'System Administrator'
        onboardingStatus:
          type: string
          enum: ['Pending', 'Active', 'Completed']
          example: 'Active'
        isActive:
          type: boolean
          example: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        permissions:
          type: array
          items:
            type: string
          example: ['system:configure', 'users:manage', 'reports:view']

    UserRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          enum: ['admin', 'hr', 'manager', 'employee']
          example: 'admin'
        description:
          type: string
          example: 'System administrator with full access'
        level:
          type: integer
          minimum: 1
          maximum: 100
          example: 100
        isActive:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: 'Invalid email or password'
        code:
          type: string
          example: 'AUTH_INVALID_CREDENTIALS'
        details:
          type: object
          additionalProperties: true

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt-token
      description: HTTP-only JWT token stored in secure cookie

security:
  - cookieAuth: []

tags:
  - name: Authentication
    description: User authentication and session management
