# PostGraphile Authorization Schema
# Generated from data model requirements

"""JWT token type for PostGraphile authentication"""
type JwtToken {
  """PostgreSQL role to assume"""
  role: String!

  """Token expiration timestamp"""
  exp: Int!

  """User identifier"""
  userId: UUID!

  """User role level for authorization"""
  roleLevel: Int!

  """User role name"""
  roleName: String!

  """User permissions array"""
  permissions: [String!]!

  """User email for auditing"""
  email: String!
}

"""User account with authentication credentials"""
type User {
  id: UUID!
  email: String!
  displayName: String
  isActive: Boolean!
  onboardingStatus: String!
  lastLogin: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!

  """User's role assignments"""
  userRoleAssignments(condition: UserRoleAssignmentCondition): [UserRoleAssignment!]!

  """User's active authentication sessions"""
  authSessions(condition: AuthSessionCondition): [AuthSession!]!
}

"""User role definition with permission level"""
type UserRole {
  id: UUID!
  name: String!
  description: String
  level: Int!
  permissions: JSON!
  isSystemRole: Boolean!
  createdAt: DateTime!

  """Users assigned to this role"""
  userRoleAssignments(condition: UserRoleAssignmentCondition): [UserRoleAssignment!]!
}

"""Assignment of role to user with temporal validity"""
type UserRoleAssignment {
  id: UUID!
  userId: UUID!
  roleId: UUID!
  assignedBy: UUID!
  isActive: Boolean!
  validFrom: DateTime!
  validUntil: DateTime
  createdAt: DateTime!

  """Associated user"""
  user: User!

  """Associated role"""
  userRole: UserRole!

  """User who assigned this role"""
  assignedByUser: User!
}

"""Active user authentication session"""
type AuthSession {
  id: UUID!
  userId: UUID!
  tokenHash: String!
  expiresAt: DateTime!
  createdAt: DateTime!
  lastAccessed: DateTime
  ipAddress: String
  userAgent: String
  isRevoked: Boolean!

  """Associated user"""
  user: User!
}

"""Authentication mutations"""
type Mutation {
  """Authenticate user with email and password"""
  authenticate(input: AuthenticateInput!): AuthenticatePayload

  """Refresh JWT token"""
  refreshJwtToken(input: RefreshJwtTokenInput!): RefreshJwtTokenPayload

  """Change user password"""
  changePassword(input: ChangePasswordInput!): ChangePasswordPayload

  """Revoke user session"""
  revokeSession(input: RevokeSessionInput!): RevokeSessionPayload

  """Assign role to user (admin only)"""
  assignUserRole(input: AssignUserRoleInput!): AssignUserRolePayload

  """Revoke user role (admin only)"""
  revokeUserRole(input: RevokeUserRoleInput!): RevokeUserRolePayload
}

"""Authentication queries"""
type Query {
  """Get current authenticated user"""
  currentUser: User

  """Get current user's permissions"""
  currentUserPermissions: [String!]!

  """Check if current user has specific permission"""
  hasPermission(permission: String!): Boolean!

  """Get current user's role level"""
  currentUserRoleLevel: Int

  """Validate JWT token (admin only)"""
  validateJwtToken(token: String!): JwtTokenValidation
}

# Input Types

input AuthenticateInput {
  email: String!
  password: String!
  rememberMe: Boolean = false
}

input RefreshJwtTokenInput {
  refreshToken: String!
}

input ChangePasswordInput {
  currentPassword: String!
  newPassword: String!
}

input RevokeSessionInput {
  sessionId: UUID!
}

input AssignUserRoleInput {
  userId: UUID!
  roleId: UUID!
  validUntil: DateTime
}

input RevokeUserRoleInput {
  assignmentId: UUID!
}

# Payload Types

type AuthenticatePayload {
  jwtToken: JwtToken
  user: User
  clientMutationId: String
}

type RefreshJwtTokenPayload {
  jwtToken: JwtToken
  user: User
  clientMutationId: String
}

type ChangePasswordPayload {
  success: Boolean!
  user: User
  clientMutationId: String
}

type RevokeSessionPayload {
  success: Boolean!
  clientMutationId: String
}

type AssignUserRolePayload {
  userRoleAssignment: UserRoleAssignment
  clientMutationId: String
}

type RevokeUserRolePayload {
  success: Boolean!
  clientMutationId: String
}

type JwtTokenValidation {
  isValid: Boolean!
  user: User
  expiresAt: DateTime
  permissions: [String!]!
}

# Condition Types for Filtering

input UserCondition {
  id: UUID
  email: String
  isActive: Boolean
  onboardingStatus: String
}

input UserRoleCondition {
  id: UUID
  name: String
  level: Int
  isSystemRole: Boolean
}

input UserRoleAssignmentCondition {
  id: UUID
  userId: UUID
  roleId: UUID
  isActive: Boolean
}

input AuthSessionCondition {
  id: UUID
  userId: UUID
  isRevoked: Boolean
}

# Scalar Types

scalar UUID
scalar DateTime
scalar JSON

# Authorization Functions (PostgreSQL functions exposed via PostGraphile)

"""
SQL Functions available in GraphQL:

-- Get current authenticated user ID
current_user_id(): UUID

-- Get current user's role level
current_user_role_level(): Int

-- Check if user has permission
has_permission(permission: String!): Boolean

-- Get user's effective permissions
get_user_permissions(user_id: UUID!): [String!]

-- Validate JWT token
validate_jwt_token(token: String!): JwtTokenValidation

-- Generate password hash
generate_password_hash(password: String!): String

-- Verify password
verify_password(password: String!, hash: String!): Boolean
"""