openapi: 3.0.3
info:
  title: Auth Test Orchestrator CLI API
  description: Command-line interface for managing authentication test execution loops
  version: 1.0.0

paths:
  /cli/run:
    post:
      summary: Execute authentication test loop
      description: |
        Runs authentication test scenarios in a loop until all issues are resolved
        or maximum iterations reached
      operationId: runTestLoop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                suiteId:
                  type: string
                  format: uuid
                  description: Test suite identifier to execute
                loop:
                  type: boolean
                  default: true
                  description: Whether to run in continuous loop mode
                maxIterations:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 10
                  description: Maximum number of iterations before stopping
                browsers:
                  type: array
                  items:
                    type: string
                    enum: [chromium, firefox, webkit]
                  default: [chromium]
                  description: Browsers to test against
                parallel:
                  type: boolean
                  default: true
                  description: Whether to run tests in parallel
                stopOnFirstFailure:
                  type: boolean
                  default: false
                  description: Stop execution on first test failure
                format:
                  type: string
                  enum: [json, text, html]
                  default: json
                  description: Output format for results
              required:
                - suiteId
      responses:
        '200':
          description: Test execution completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestExecutionResult'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Test suite not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal execution error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cli/status:
    get:
      summary: Get execution status
      description: Returns current status of running test executions
      operationId: getExecutionStatus
      parameters:
        - name: executionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Specific execution to check (if omitted, returns all active)
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, text]
            default: json
      responses:
        '200':
          description: Status information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionStatus'

  /cli/stop:
    post:
      summary: Stop running execution
      description: Gracefully stops a running test execution
      operationId: stopExecution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                executionId:
                  type: string
                  format: uuid
                  description: Execution to stop
                force:
                  type: boolean
                  default: false
                  description: Force immediate stop without cleanup
              required:
                - executionId
      responses:
        '200':
          description: Execution stopped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopResult'
        '404':
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    TestExecutionResult:
      type: object
      properties:
        executionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed, failed, stopped]
        totalIterations:
          type: integer
          minimum: 0
        totalTests:
          type: integer
          minimum: 0
        passedTests:
          type: integer
          minimum: 0
        failedTests:
          type: integer
          minimum: 0
        skippedTests:
          type: integer
          minimum: 0
        duration:
          type: integer
          description: Total execution time in milliseconds
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        iterations:
          type: array
          items:
            $ref: '#/components/schemas/IterationResult'
        summary:
          $ref: '#/components/schemas/ExecutionSummary'
      required:
        - executionId
        - status
        - totalIterations
        - totalTests
        - passedTests
        - failedTests
        - duration
        - startTime
        - iterations

    IterationResult:
      type: object
      properties:
        iterationNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [passed, failed, partial]
        testsExecuted:
          type: integer
          minimum: 0
        testsPassed:
          type: integer
          minimum: 0
        testsFailed:
          type: integer
          minimum: 0
        duration:
          type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        failureCount:
          type: integer
          minimum: 0
        newIssuesFound:
          type: integer
          minimum: 0
      required:
        - iterationNumber
        - status
        - testsExecuted
        - duration
        - startTime

    ExecutionStatus:
      type: object
      properties:
        activeExecutions:
          type: array
          items:
            type: object
            properties:
              executionId:
                type: string
                format: uuid
              status:
                type: string
                enum: [running, stopping]
              currentIteration:
                type: integer
                minimum: 1
              maxIterations:
                type: integer
                minimum: 1
              startTime:
                type: string
                format: date-time
              estimatedCompletion:
                type: string
                format: date-time
              testsCompleted:
                type: integer
                minimum: 0
              totalTests:
                type: integer
                minimum: 0
        queuedExecutions:
          type: integer
          minimum: 0
        systemResources:
          type: object
          properties:
            memoryUsage:
              type: number
              description: Memory usage percentage
            cpuUsage:
              type: number
              description: CPU usage percentage
            activeBrowsers:
              type: integer
              minimum: 0

    ExecutionSummary:
      type: object
      properties:
        overallHealth:
          type: string
          enum: [healthy, degraded, critical]
        authenticationIssuesResolved:
          type: boolean
        criticalIssuesRemaining:
          type: integer
          minimum: 0
        improvementTrend:
          type: string
          enum: [improving, stable, degrading]
        recommendedActions:
          type: array
          items:
            type: string
        performanceMetrics:
          type: object
          properties:
            averageLoginTime:
              type: number
              description: Average login duration in milliseconds
            successRate:
              type: number
              minimum: 0
              maximum: 100
              description: Overall success rate percentage
            stabilityScore:
              type: number
              minimum: 0
              maximum: 100
              description: Test stability score

    StopResult:
      type: object
      properties:
        executionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [stopped, stopping, already_stopped]
        message:
          type: string
        partialResults:
          $ref: '#/components/schemas/TestExecutionResult'
      required:
        - executionId
        - status
        - message

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
      required:
        - code
        - message