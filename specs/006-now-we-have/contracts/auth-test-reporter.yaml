openapi: 3.0.3
info:
  title: Auth Test Reporter CLI API
  description: Command-line interface for generating authentication test reports and dashboards
  version: 1.0.0

paths:
  /cli/generate:
    post:
      summary: Generate test report
      description: |
        Generates comprehensive reports from test execution results with various
        output formats and customizable templates
      operationId: generateReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                executionIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Specific executions to include (if omitted, includes recent results)
                timeRange:
                  type: object
                  properties:
                    startTime:
                      type: string
                      format: date-time
                    endTime:
                      type: string
                      format: date-time
                  description: Time range for report data
                template:
                  type: string
                  enum: [summary, detailed, executive, technical, trending]
                  default: summary
                  description: Report template to use
                format:
                  type: string
                  enum: [html, json, pdf, csv]
                  default: html
                  description: Output format for the report
                includeScreenshots:
                  type: boolean
                  default: false
                  description: Include failure screenshots in report
                includeMetrics:
                  type: boolean
                  default: true
                  description: Include performance metrics
                includeTrends:
                  type: boolean
                  default: true
                  description: Include trend analysis
                includeRecommendations:
                  type: boolean
                  default: true
                  description: Include actionable recommendations
                outputPath:
                  type: string
                  description: File path for report output (if omitted, returns content directly)
                customTitle:
                  type: string
                  description: Custom title for the report
                recipientEmails:
                  type: array
                  items:
                    type: string
                    format: email
                  description: Email addresses to send report to (optional)
      responses:
        '200':
          description: Report generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
        '400':
          description: Invalid report parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No test data found for report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cli/dashboard:
    post:
      summary: Generate real-time dashboard
      description: Creates a live dashboard showing current authentication system health
      operationId: generateDashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshInterval:
                  type: integer
                  minimum: 5
                  maximum: 300
                  default: 30
                  description: Dashboard refresh interval in seconds
                widgets:
                  type: array
                  items:
                    type: string
                    enum: [health, trends, issues, performance, recent_runs]
                  default: [health, trends, issues, performance]
                  description: Dashboard widgets to include
                theme:
                  type: string
                  enum: [light, dark, auto]
                  default: auto
                  description: Dashboard theme
                port:
                  type: integer
                  minimum: 1024
                  maximum: 65535
                  default: 8080
                  description: Port for dashboard server
                authentication:
                  type: boolean
                  default: false
                  description: Enable basic authentication for dashboard
                outputPath:
                  type: string
                  description: Path to save dashboard files (if omitted, serves directly)
      responses:
        '200':
          description: Dashboard generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResult'
        '400':
          description: Invalid dashboard parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cli/health:
    get:
      summary: Get current system health
      description: Returns current authentication system health summary
      operationId: getHealthSummary
      parameters:
        - name: includeHistory
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include historical health data
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d, 30d]
            default: 24h
          description: Timeframe for health analysis
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, text]
            default: json
      responses:
        '200':
          description: Health summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSummary'

  /cli/templates:
    get:
      summary: List available report templates
      description: Returns list of available report templates with descriptions
      operationId: listTemplates
      responses:
        '200':
          description: Templates listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'

components:
  schemas:
    ReportResult:
      type: object
      properties:
        reportId:
          type: string
          format: uuid
        generationTime:
          type: string
          format: date-time
        template:
          type: string
        format:
          type: string
        outputPath:
          type: string
          description: Path to generated report file
        content:
          type: string
          description: Report content (when outputPath not specified)
        metadata:
          type: object
          properties:
            title:
              type: string
            generatedBy:
              type: string
            dataRange:
              type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
            totalExecutions:
              type: integer
              minimum: 0
            totalTests:
              type: integer
              minimum: 0
            reportSize:
              type: integer
              description: Report size in bytes
        emailStatus:
          type: object
          properties:
            sent:
              type: boolean
            recipients:
              type: array
              items:
                type: string
                format: email
            sentAt:
              type: string
              format: date-time
      required:
        - reportId
        - generationTime
        - template
        - format
        - metadata

    DashboardResult:
      type: object
      properties:
        dashboardId:
          type: string
          format: uuid
        creationTime:
          type: string
          format: date-time
        url:
          type: string
          format: uri
          description: URL to access the dashboard
        port:
          type: integer
        theme:
          type: string
        widgets:
          type: array
          items:
            type: string
        refreshInterval:
          type: integer
        status:
          type: string
          enum: [starting, running, stopped, error]
        outputPath:
          type: string
          description: Path to dashboard files (if saved)
        authentication:
          type: object
          properties:
            enabled:
              type: boolean
            username:
              type: string
            password:
              type: string
      required:
        - dashboardId
        - creationTime
        - port
        - theme
        - widgets
        - refreshInterval
        - status

    HealthSummary:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        overallHealth:
          type: string
          enum: [healthy, degraded, critical, unknown]
        healthScore:
          type: number
          minimum: 0
          maximum: 100
          description: Overall health score (0-100)
        components:
          type: object
          properties:
            authentication:
              $ref: '#/components/schemas/ComponentHealth'
            sessionManagement:
              $ref: '#/components/schemas/ComponentHealth'
            userRoles:
              $ref: '#/components/schemas/ComponentHealth'
            performance:
              $ref: '#/components/schemas/ComponentHealth'
        recentMetrics:
          type: object
          properties:
            successRate:
              type: number
              minimum: 0
              maximum: 100
            averageLoginTime:
              type: number
              description: Average login time in milliseconds
            totalTests:
              type: integer
              minimum: 0
            failureCount:
              type: integer
              minimum: 0
            lastTestTime:
              type: string
              format: date-time
        activeIssues:
          type: array
          items:
            type: object
            properties:
              issueId:
                type: string
                format: uuid
              severity:
                type: string
                enum: [low, medium, high, critical]
              title:
                type: string
              status:
                type: string
                enum: [open, investigating, resolved]
        trends:
          type: array
          items:
            type: object
            properties:
              metric:
                type: string
              direction:
                type: string
                enum: [improving, stable, degrading]
              change:
                type: number
                description: Percentage change
        recommendations:
          type: array
          items:
            type: object
            properties:
              priority:
                type: string
                enum: [low, medium, high, critical]
              title:
                type: string
              description:
                type: string
        history:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              healthScore:
                type: number
              status:
                type: string
      required:
        - timestamp
        - overallHealth
        - healthScore
        - components
        - recentMetrics

    ComponentHealth:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, critical, unknown]
        score:
          type: number
          minimum: 0
          maximum: 100
        lastChecked:
          type: string
          format: date-time
        issues:
          type: array
          items:
            type: string
        metrics:
          type: object
          additionalProperties:
            type: number
      required:
        - status
        - score
        - lastChecked

    TemplateList:
      type: object
      properties:
        templates:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              supportedFormats:
                type: array
                items:
                  type: string
              features:
                type: array
                items:
                  type: string
              preview:
                type: string
                description: URL to template preview
        totalCount:
          type: integer
          minimum: 0
      required:
        - templates
        - totalCount

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
      required:
        - code
        - message