# =============================================================================
# ADMIN LEAVE REQUEST OPERATIONS (FR-013)
# =============================================================================

# Query: Get all leave requests (unrestricted access)
query GetAllLeaveRequests(
  $first: Int = 20
  $offset: Int = 0
  $filter: LeaveRequestFilter
) {
  leaveRequests(
    first: $first
    offset: $offset
    filter: $filter
    orderBy: ["CREATED_AT_DESC"]
  ) {
    nodes {
      id
      userId
      departmentId
      startDate
      endDate
      leaveType
      status
      reason
      reviewerId
      reviewNotes
      reviewedAt
      createdAt
      updatedAt
      userByUserId {
        id
        email
        displayName
        role
      }
      departmentByDepartmentId {
        id
        name
        managerId
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
    totalCount
  }
}

# Query: Get organization-wide leave statistics
query GetOrganizationLeaveStatistics($startDate: Date, $endDate: Date) {
  leaveStatistics(startDate: $startDate, endDate: $endDate) {
    pendingCount
    approvedCount
    rejectedCount
    totalDaysRequested
    averageRequestDays
    approvalRate
  }
}

