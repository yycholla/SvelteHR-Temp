# Query: Get organization-wide report analytics
query GetOrganizationReportAnalytics {
  reportAnalytics {
    summary {
      totalReports
      activeReports
      scheduledReports
      generatedToday
      generatedThisWeek
      generatedThisMonth
      mostPopularType
      avgRunTime
    }
    typeBreakdown {
      reportType
      count
      percentage
    }
    categoryBreakdown {
      category
      count
      percentage
    }
    departmentUsage {
      departmentId
      departmentName
      reportsGenerated
    }
    runHistory {
      date
      count
    }
    popularReports {
      reportId
      title
      runCount
    }
    performanceMetrics {
      fastestReport
      slowestReport
      avgExecutionTime
      totalExecutionTime
      successRate
      errorRate
    }
  }
}

