# =============================================================================
# ADMIN AUDIT LOG OPERATIONS (FR-020)
# =============================================================================

# Query: Get audit logs with filtering
query GetAuditLogs(
  $first: Int = 100
  $offset: Int = 0
  $userId: UUID
  $action: String
  $resource: String
  $startDate: DateTime
  $endDate: DateTime
  $departmentId: UUID
) {
  auditLogs(
    first: $first
    offset: $offset
    userId: $userId
    action: $action
    resource: $resource
    startDate: $startDate
    endDate: $endDate
  ) {
    id
    userId
    action
    resource
    resourceId
    departmentId
    ipAddress
    userAgent
    metadata
    timestamp
    userByUserId {
      id
      email
      displayName
      role
    }
    departmentByDepartmentId {
      id
      name
    }
  }
}

# =============================================================================
# ADMIN SYSTEM SETTINGS OPERATIONS (FR-019)
# =============================================================================

# Query: Get all system settings
query GetSystemSettings($category: String) {
  systemSettings(category: $category) {
    id
    key
    value
    category
    description
    isPublic
    updatedBy
    createdAt
    updatedAt
    userByUpdatedBy {
      id
      email
      displayName
    }
  }
}

# Mutation: Update system setting (admin action)
mutation UpdateSystemSetting($key: String!, $value: String!) {
  updateSystemSetting(key: $key, value: $value) {
    id
    key
    value
    updatedBy
    updatedAt
  }
}

# =============================================================================
# ADMIN ANALYTICS DASHBOARD OPERATIONS (FR-021)
# =============================================================================

# Query: Get organization-wide analytics
query GetOrganizationAnalytics {
  # This is a composite query that fetches multiple analytics in a single request
  leaveStats: leaveStatistics {
    pendingCount
    approvedCount
    rejectedCount
    approvalRate
  }

  performanceStats: performanceStatistics {
    totalReviews
    completedReviews
    completionRate
    averageRatings {
      overall
    }
  }

  goalStats: goalStatistics {
    totalGoals
    activeGoals
    completedGoals
    completionRate
  }

  reportStats: reportAnalytics {
    summary {
      totalReports
      activeReports
      generatedThisMonth
    }
  }
}

