}

# Query: Get report analytics for manager's department
query GetReportAnalytics($departmentId: UUID) {
  reportAnalytics(departmentId: $departmentId) {
    summary {
      totalReports
      activeReports
      scheduledReports
      generatedToday
      generatedThisWeek
      generatedThisMonth
      mostPopularType
      avgRunTime
    }
    typeBreakdown {
      reportType
      count
      percentage
    }
    categoryBreakdown {
      category
      count
      percentage
    }
    departmentUsage {
      departmentId
      departmentName
      reportsGenerated
    }
    runHistory {
      date
      count
    }
    popularReports {
      reportId
      title
      runCount
    }
    performanceMetrics {
      fastestReport
      slowestReport
      avgExecutionTime
      totalExecutionTime
      successRate
      errorRate
    }
  }
}

# Mutation: Create report (manager action)
mutation CreateReport($input: CreateReportInput!) {
  createReport(input: $input) {
    report {
      id
