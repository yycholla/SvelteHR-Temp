      status
      filters
      updatedAt
    }
  }
}

# Mutation: Delete report (manager action)
mutation DeleteReport($id: UUID!) {
  deleteReport(id: $id) {
    deletedReportId
  }
}

# =============================================================================
# DEPARTMENT CONTEXT QUERY (FR-008)
# =============================================================================

# Query: Get manager's department for context
query GetManagerDepartment($userId: UUID!) {
  userById(id: $userId) {
    id
    role
    departmentId
    departmentByDepartmentId {
      id
      name
      description
      managerId
      isActive
    }
  }
}

# =============================================================================
# DEPARTMENT CHANGE SUBSCRIPTION (FR-029)
# =============================================================================

# Subscription: Detect department transfer for auto-refresh
subscription OnDepartmentChange($userId: UUID!) {
  onDepartmentChange(userId: $userId) {
    id
    departmentId
    departmentByDepartmentId {
      id
      name
      managerId
    }
  }
}
