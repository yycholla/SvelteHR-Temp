# Manager-Scoped GraphQL Operations
# Feature: 016-repair-management-pages
# Purpose: Department-scoped CRUD operations for managers

# =============================================================================
# MANAGER LEAVE REQUEST OPERATIONS (FR-001, FR-002)
# =============================================================================

# Query: Get pending leave requests for manager's department
query GetPendingLeaveRequests(
  $managerId: UUID!
  $first: Int = 20
  $offset: Int = 0
  $filter: LeaveRequestFilter
) {
  leaveRequests(
    first: $first
    offset: $offset
    filter: $filter
    orderBy: ["CREATED_AT_DESC"]
  ) {
    nodes {
      id
      userId
      departmentId
      startDate
      endDate
      leaveType
      status
      reason
      createdAt
      userByUserId {
        id
        email
        displayName
      }
      departmentByDepartmentId {
        id
        name
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
    totalCount
  }
}

# Query: Get leave statistics for manager's department
query GetLeaveStatistics($departmentId: UUID, $startDate: Date, $endDate: Date) {
  leaveStatistics(
    departmentId: $departmentId
    startDate: $startDate
    endDate: $endDate
  ) {
    pendingCount
    approvedCount
    rejectedCount
    totalDaysRequested
    averageRequestDays
    approvalRate
  }
}

# Mutation: Approve leave request (manager action)
mutation ApproveLeaveRequest($id: UUID!, $reviewerId: UUID!, $reviewNotes: String) {
  updateLeaveRequest(
    input: {
      id: $id
      status: "approved"
      reviewerId: $reviewerId
      reviewNotes: $reviewNotes
    }
  ) {
    leaveRequest {
      id
      status
      reviewerId
      reviewNotes
      reviewedAt
    }
  }
}

# Mutation: Reject leave request (manager action)
mutation RejectLeaveRequest($id: UUID!, $reviewerId: UUID!, $reviewNotes: String!) {
  updateLeaveRequest(
    input: {
      id: $id
      status: "rejected"
      reviewerId: $reviewerId
      reviewNotes: $reviewNotes
    }
  ) {
    leaveRequest {
      id
      status
      reviewerId
      reviewNotes
      reviewedAt
    }
  }
}

# =============================================================================
# MANAGER PERFORMANCE REVIEW OPERATIONS (FR-003)
# =============================================================================

# Query: Get performance reviews for manager's department
query GetPerformanceReviews(
  $managerId: UUID!
  $first: Int = 20
  $offset: Int = 0
  $filter: PerformanceReviewFilter
) {
  performanceReviews(
    first: $first
    offset: $offset
    filter: $filter
    orderBy: ["CREATED_AT_DESC"]
  ) {
    nodes {
      id
      revieweeId
      reviewerId
      departmentId
      reviewPeriod
      status
      overallRating
      goalsAchievement
      collaboration
      communication
      leadership
      strengths
      areasForImprovement
      comments
      createdAt
      updatedAt
      completedAt
      userByRevieweeId {
        id
        email
        displayName
      }
      userByReviewerId {
        id
        email
        displayName
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
    totalCount
  }
}

# Query: Get performance statistics for manager's department
query GetPerformanceStatistics($departmentId: UUID, $period: String) {
  performanceStatistics(departmentId: $departmentId, period: $period) {
    totalReviews
    completedReviews
    overdueReviews
    completionRate
    averageRatings {
      overall
      goalsAchievement
      collaboration
      communication
      leadership
    }
    ratingDistribution {
      rating
      count
      percentage
    }
    trends {
      improvementAreas
      strongAreas
    }
  }
}

# Mutation: Create performance review (manager action)
mutation CreatePerformanceReview($input: CreatePerformanceReviewInput!) {
  createPerformanceReview(input: $input) {
    performanceReview {
      id
      revieweeId
      reviewerId
      departmentId
      reviewPeriod
      status
      createdAt
    }
  }
}

# Mutation: Update performance review (manager action)
mutation UpdatePerformanceReview($input: UpdatePerformanceReviewInput!) {
  updatePerformanceReview(input: $input) {
    performanceReview {
      id
      status
      overallRating
      goalsAchievement
      collaboration
      communication
      leadership
      strengths
      areasForImprovement
      comments
      updatedAt
    }
  }
}

# Mutation: Delete performance review (manager action)
mutation DeletePerformanceReview($id: UUID!) {
  deletePerformanceReview(id: $id) {
    deletedPerformanceReviewId
  }
}

