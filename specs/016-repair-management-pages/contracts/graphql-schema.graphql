# =============================================================================
# ROOT QUERY TYPE
# =============================================================================

type Query {
  # User & Department queries
  userById(id: UUID!): User
  departmentById(id: UUID!): Department
  currentUser: User

  # Manager-scoped queries (department filtering via RLS)
  leaveRequests(
    first: Int
    offset: Int
    filter: LeaveRequestFilter
    orderBy: [String!]
  ): LeaveRequestConnection!

  performanceReviews(
    first: Int
    offset: Int
    filter: PerformanceReviewFilter
    orderBy: [String!]
  ): PerformanceReviewConnection!

  goals(
    first: Int
    offset: Int
    filter: GoalFilter
    orderBy: [String!]
  ): GoalConnection!

  tasks(
    first: Int
    offset: Int
    filter: TaskFilter
    orderBy: [String!]
  ): TaskConnection!

  reports(
    first: Int
    offset: Int
    filter: ReportFilter
    orderBy: [String!]
  ): ReportConnection!

  # Statistics / Analytics (department-scoped for managers)
  leaveStatistics(departmentId: UUID, startDate: Date, endDate: Date): LeaveStatistics!
  performanceStatistics(departmentId: UUID, period: String): PerformanceStatistics!
  goalStatistics(departmentId: UUID, year: Int, quarter: String): GoalStatistics!
  reportAnalytics(departmentId: UUID): ReportAnalytics!

  # Admin-only queries
  auditLogs(
    first: Int
    offset: Int
    userId: UUID
    action: String
    resource: String
    startDate: DateTime
    endDate: DateTime
  ): [AuditLog!]!

  systemSettings(category: String): [SystemSetting!]!
}

# =============================================================================
# ROOT MUTATION TYPE
# =============================================================================

type Mutation {
  # Leave Request mutations
  createLeaveRequest(input: CreateLeaveRequestInput!): CreateLeaveRequestPayload!
  updateLeaveRequest(input: UpdateLeaveRequestInput!): UpdateLeaveRequestPayload!
  deleteLeaveRequest(id: UUID!): DeleteLeaveRequestPayload!

  # Performance Review mutations
  createPerformanceReview(input: CreatePerformanceReviewInput!): CreatePerformanceReviewPayload!
  updatePerformanceReview(input: UpdatePerformanceReviewInput!): UpdatePerformanceReviewPayload!
  deletePerformanceReview(id: UUID!): DeletePerformanceReviewPayload!

  # Goal mutations
  createGoal(input: CreateGoalInput!): CreateGoalPayload!
  updateGoal(input: UpdateGoalInput!): UpdateGoalPayload!
  deleteGoal(id: UUID!): DeleteGoalPayload!

  # Task mutations
  createTask(input: CreateTaskInput!): CreateTaskPayload!
  updateTask(input: UpdateTaskInput!): UpdateTaskPayload!
  deleteTask(id: UUID!): DeleteTaskPayload!

  # Report mutations
  createReport(input: CreateReportInput!): CreateReportPayload!
  updateReport(input: UpdateReportInput!): UpdateReportPayload!
  deleteReport(id: UUID!): DeleteReportPayload!

  # Admin-only mutations
  updateSystemSetting(key: String!, value: String!): SystemSetting!
}

# =============================================================================
# ROOT SUBSCRIPTION TYPE
# =============================================================================

type Subscription {
  # Department change detection for FR-029
  onDepartmentChange(userId: UUID!): User!

  # Real-time updates for management pages
  onLeaveRequestUpdate(departmentId: UUID!): LeaveRequest!
  onPerformanceReviewUpdate(departmentId: UUID!): PerformanceReview!
  onGoalUpdate(departmentId: UUID!): Goal!
  onTaskUpdate(departmentId: UUID!): Task!
}

# =============================================================================
# SCALAR TYPES
# =============================================================================

scalar UUID
scalar DateTime
scalar Date
scalar JSON
