  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relationships
  departmentByDepartmentId: Department
  leaveRequestsByUserId: [LeaveRequest!]!
  performanceReviewsByRevieweeId: [PerformanceReview!]!
  goalsByUserId: [Goal!]!
  tasksByAssigneeId: [Task!]!
}

type Department {
  id: UUID!
  name: String!
  description: String
  managerId: UUID
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relationships
  userByManagerId: User
  usersByDepartmentId: [User!]!
  leaveRequestsByDepartmentId: [LeaveRequest!]!
  performanceReviewsByDepartmentId: [PerformanceReview!]!
  goalsByDepartmentId: [Goal!]!
  tasksByDepartmentId: [Task!]!
  reportsByDepartmentId: [Report!]!
}

