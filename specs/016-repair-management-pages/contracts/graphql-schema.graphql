# Extended PostGraphile GraphQL Schema
# Feature: 016-repair-management-pages
# Purpose: Define GraphQL types and operations for manager CRUD and admin access

# =============================================================================
# BASE TYPES (Auto-generated by PostGraphile from database schema)
