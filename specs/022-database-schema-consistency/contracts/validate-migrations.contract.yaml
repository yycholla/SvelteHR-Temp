openapi: 3.1.0
info:
  title: Migration Validation CLI
  version: 1.0.0
  description: CLI tool for validating migration file integrity and ordering

paths:
  /cli/validate-migrations:
    post:
      summary: Validate migration files for correctness and consistency
      description: |
        Validates migration files for proper naming, sequential ordering, checksum
        integrity, SQL syntax, and rollback file correspondence. Detects common
        migration issues before they cause deployment problems.

        This command satisfies FR-004, FR-010, FR-011, FR-013, FR-014.

      operationId: validateMigrations

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                migrationsPath:
                  type: string
                  default: "./migrations"
                  description: Directory containing migration files
                databaseUrl:
                  type: string
                  format: uri
                  description: Optional database connection to check applied migrations
                  example: "postgresql://user:pass@localhost:5432/hr_db"
                checkSyntax:
                  type: boolean
                  default: true
                  description: Validate SQL syntax by parsing migration files
                checkRollbacks:
                  type: boolean
                  default: true
                  description: Verify rollback files exist and are properly paired
                checkChecksums:
                  type: boolean
                  default: true
                  description: Verify checksums match for applied migrations
                strict:
                  type: boolean
                  default: false
                  description: Fail on warnings in addition to errors

      responses:
        '200':
          description: Validation completed successfully (all checks passed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
              examples:
                allPassed:
                  summary: All validations passed
                  value:
                    valid: true
                    migrationsChecked: 25
                    checksPerformed:
                      - "Naming pattern validation"
                      - "Sequential ordering validation"
                      - "SQL syntax validation"
                      - "Rollback file validation"
                      - "Checksum integrity validation"
                    errors: []
                    warnings: []
                    executionTimeMs: 1200
                withWarnings:
                  summary: Passed with non-critical warnings
                  value:
                    valid: true
                    migrationsChecked: 25
                    errors: []
                    warnings:
                      - code: "MISSING_ROLLBACK"
                        migration: "20251001_010_drop_legacy_table.sql"
                        message: "No rollback file found (irreversible migration should document reason)"
                        severity: "warning"
                      - code: "LARGE_MIGRATION"
                        migration: "20251002_015_add_bulk_data.sql"
                        message: "Migration file exceeds 10MB (consider splitting)"
                        severity: "warning"
                    executionTimeMs: 1500

        '400':
          description: Validation failed (errors found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
              examples:
                namingError:
                  summary: Invalid migration naming
                  value:
                    valid: false
                    migrationsChecked: 25
                    errors:
                      - code: "INVALID_NAMING"
                        migration: "add_users_table.sql"
                        message: "Migration filename does not match pattern YYYYMMDD_NNN_description.sql"
                        severity: "error"
                        expectedPattern: "^\\d{8}_\\d{3}_[a-z0-9_]+\\.sql$"
                orderingError:
                  summary: Sequential ordering violation
                  value:
                    valid: false
                    migrationsChecked: 25
                    errors:
                      - code: "DUPLICATE_SEQUENCE"
                        migration: "20251003_005_add_column.sql"
                        message: "Sequence number 005 already used by 20251003_005_create_table.sql"
                        severity: "error"
                        conflictingMigration: "20251003_005_create_table.sql"
                      - code: "SEQUENCE_GAP"
                        migration: "20251003_010_modify_constraint.sql"
                        message: "Sequence gap detected: previous was 005, expected 006-009 before 010"
                        severity: "error"
                checksumError:
                  summary: Checksum mismatch for applied migration
                  value:
                    valid: false
                    migrationsChecked: 25
                    errors:
                      - code: "CHECKSUM_MISMATCH"
                        migration: "20251001_003_create_departments.sql"
                        message: "File checksum does not match database record (file modified after application)"
                        severity: "error"
                        expectedChecksum: "a3f5b8c9d2e1f4a7b6c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0"
                        actualChecksum: "b4e6c9d3f2a5b8c7d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1"
                syntaxError:
                  summary: SQL syntax error detected
                  value:
                    valid: false
                    migrationsChecked: 25
                    errors:
                      - code: "SQL_SYNTAX_ERROR"
                        migration: "20251002_008_add_indexes.sql"
                        message: "SQL syntax error at line 15: missing semicolon"
                        severity: "error"
                        line: 15
                        column: 42
                        sqlSnippet: "CREATE INDEX idx_users_email ON users(email)"

        '500':
          description: Validation process failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "VALIDATION_PROCESS_FAILED"
                message: "Unable to read migrations directory: permission denied"

components:
  schemas:
    ValidationResult:
      type: object
      required:
        - valid
        - migrationsChecked
        - errors
        - warnings
      properties:
        valid:
          type: boolean
          description: Overall validation result
        migrationsChecked:
          type: integer
          minimum: 0
          description: Number of migration files checked
        checksPerformed:
          type: array
          items:
            type: string
          description: List of validation checks executed
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
          description: Critical errors that must be fixed
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
          description: Non-critical issues that should be reviewed
        executionTimeMs:
          type: integer
          minimum: 0
          description: Validation execution time
        summary:
          $ref: '#/components/schemas/ValidationSummary'

    ValidationIssue:
      type: object
      required:
        - code
        - message
        - severity
      properties:
        code:
          type: string
          enum:
            - INVALID_NAMING
            - DUPLICATE_SEQUENCE
            - SEQUENCE_GAP
            - CHECKSUM_MISMATCH
            - SQL_SYNTAX_ERROR
            - MISSING_ROLLBACK
            - ROLLBACK_MISMATCH
            - MIGRATION_MODIFIED
            - LARGE_MIGRATION
            - UNSAFE_OPERATION
            - MISSING_METADATA
          description: Machine-readable error code
        migration:
          type: string
          description: Migration filename with issue
        message:
          type: string
          description: Human-readable error message
        severity:
          type: string
          enum: [error, warning]
        line:
          type: integer
          description: Line number for syntax errors
        column:
          type: integer
          description: Column number for syntax errors
        sqlSnippet:
          type: string
          description: Relevant SQL snippet showing the issue
        expectedPattern:
          type: string
          description: Expected pattern for naming violations
        conflictingMigration:
          type: string
          description: Other migration involved in conflict
        expectedChecksum:
          type: string
          description: Expected checksum from database
        actualChecksum:
          type: string
          description: Actual checksum from file
        recommendation:
          type: string
          description: Suggested fix for the issue

    ValidationSummary:
      type: object
      properties:
        totalErrors:
          type: integer
          minimum: 0
        totalWarnings:
          type: integer
          minimum: 0
        appliedMigrations:
          type: integer
          minimum: 0
          description: Number of migrations applied to database (if database provided)
        pendingMigrations:
          type: integer
          minimum: 0
          description: Number of migrations not yet applied
        modifiedMigrations:
          type: integer
          minimum: 0
          description: Number of applied migrations with checksum mismatches
        missingRollbacks:
          type: integer
          minimum: 0
          description: Number of migrations without rollback files

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

  validationChecks:
    description: |
      Validation checks performed:

      1. **Naming Pattern Validation** (FR-004):
         - Pattern: ^\\d{8}_\\d{3}_[a-z0-9_]+\\.sql$
         - Date must be valid (YYYYMMDD format)
         - Sequence must be 001-999
         - Description must be lowercase with underscores

      2. **Sequential Ordering Validation** (FR-004, FR-014):
         - No duplicate sequence numbers within same date
         - Warn on sequence gaps > 5
         - Migrations sorted lexicographically

      3. **Checksum Integrity Validation** (FR-010, FR-011):
         - Calculate SHA-256 for each migration file
         - Compare against database schema_migrations table
         - Error if applied migration has different checksum

      4. **SQL Syntax Validation** (FR-012):
         - Parse SQL using PostgreSQL parser
         - Check for common errors (missing semicolons, invalid keywords)
         - Validate BEGIN/COMMIT transaction blocks
         - Check for idempotency patterns (IF NOT EXISTS)

      5. **Rollback File Validation** (FR-013):
         - Check for corresponding .rollback.sql file
         - Warn if rollback missing (should document why)
         - Validate rollback references correct forward migration
         - Check rollback SQL syntax

      6. **Metadata Validation**:
         - Check for migration header comments
         - Validate metadata format (Created, Source, Affected)
         - Warn if source is not documented

  exitCodes:
    description: |
      CLI exit codes:
      - 0: Valid (all checks passed, warnings allowed unless strict mode)
      - 1: Invalid (errors found, must be fixed)
      - 2: Validation process failed (unable to read files, database error)
