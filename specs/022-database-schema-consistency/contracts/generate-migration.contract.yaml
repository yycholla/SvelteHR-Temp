openapi: 3.1.0
info:
  title: Migration Generation CLI
  version: 1.0.0
  description: CLI tool for generating remediation migration files from schema differences

paths:
  /cli/generate-migration:
    post:
      summary: Generate remediation migration file from schema drift
      description: |
        Analyzes a SchemaDiff report and generates SQL migration files to remediate
        the differences. Creates both forward and rollback migration files with
        appropriate metadata. Always requires manual review before application.

        This command satisfies FR-023, FR-024, FR-024a, FR-025, FR-026.

      operationId: generateMigration

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - diffSource
              properties:
                diffSource:
                  oneOf:
                    - type: object
                      description: Inline SchemaDiff object
                      $ref: '#/components/schemas/SchemaDiff'
                    - type: string
                      description: Path to SchemaDiff JSON file
                      example: "./verification-reports/2025-10-03-staging-diff.json"
                migrationsPath:
                  type: string
                  default: "./migrations"
                  description: Directory to write migration files
                remediationSubdir:
                  type: string
                  default: "remediation"
                  description: Subdirectory within migrations for auto-generated files
                generateRollback:
                  type: boolean
                  default: true
                  description: Generate corresponding rollback migration
                dryRun:
                  type: boolean
                  default: false
                  description: Preview migration without writing files
                environment:
                  type: string
                  enum: [development, staging, production]
                  description: Target environment (affects safety checks per FR-026)

      responses:
        '200':
          description: Migration generated successfully (or dry run completed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationGenerationResult'
              examples:
                singleMigration:
                  summary: Single migration generated
                  value:
                    migrationsGenerated: 1
                    files:
                      - filename: "20251003_001_add_missing_bulk_rollback_batches_table.sql"
                        filePath: "./migrations/remediation/20251003_001_add_missing_bulk_rollback_batches_table.sql"
                        reason: "missing_table"
                        affectedObjects: ["bulk_rollback_batches"]
                        requiresReview: true
                        rollbackFile: "./migrations/remediation/20251003_001_add_missing_bulk_rollback_batches_table.rollback.sql"
                        sqlPreview: "BEGIN;\n\nCREATE TABLE IF NOT EXISTS hr_public.bulk_rollback_batches (\n  id SERIAL PRIMARY KEY,\n  ..."
                    warnings:
                      - "Generated migration requires manual review before application (FR-024a)"
                    manualSteps: []
                multipleMigrations:
                  summary: Multiple migrations for complex drift
                  value:
                    migrationsGenerated: 3
                    files:
                      - filename: "20251003_002_add_missing_columns_events.sql"
                        reason: "missing_column"
                        affectedObjects: ["events.requested_at", "events.approved_by"]
                      - filename: "20251003_003_remove_extra_index_users_email_temp.sql"
                        reason: "extra_index"
                        affectedObjects: ["idx_users_email_temp"]
                      - filename: "20251003_004_fix_type_mismatch_employees_salary.sql"
                        reason: "type_mismatch"
                        affectedObjects: ["employees.salary"]
                    warnings:
                      - "Production environment detected - migrations generated but not applied (FR-026)"
                      - "Type change in employees.salary may require data migration"
                dryRun:
                  summary: Dry run preview
                  value:
                    migrationsGenerated: 1
                    dryRun: true
                    files:
                      - filename: "20251003_005_add_missing_constraint_users_email_unique.sql"
                        sqlPreview: "BEGIN;\n\nALTER TABLE hr_public.users\n  ADD CONSTRAINT users_email_key UNIQUE (email);\n\nCOMMIT;"
                        requiresReview: true

        '400':
          description: Invalid request or unsafe migration detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noDifferences:
                  summary: No differences to remediate
                  value:
                    error: "NO_DIFFERENCES"
                    message: "SchemaDiff contains no differences to remediate"
                invalidDiff:
                  summary: Invalid diff format
                  value:
                    error: "INVALID_DIFF_FORMAT"
                    message: "Failed to parse SchemaDiff: missing required field 'tableDiffs'"
                unsafeMigration:
                  summary: Migration requires manual intervention
                  value:
                    error: "UNSAFE_MIGRATION"
                    message: "Cannot auto-generate migration for data deletion (DROP TABLE)"
                    details:
                      reason: "Data loss detected"
                      affectedTables: ["legacy_employees"]
                      recommendation: "Manually create migration after backing up data"

        '500':
          description: Migration generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "GENERATION_FAILED"
                message: "Failed to generate migration file: unable to write to ./migrations/remediation/"
                details:
                  cause: "Permission denied"

components:
  schemas:
    SchemaDiff:
      type: object
      required:
        - sourceSchema
        - targetSchema
        - comparedAt
        - hasDifferences
        - tableDiffs
        - summary
      properties:
        sourceSchema:
          type: string
        targetSchema:
          type: string
        comparedAt:
          type: string
          format: date-time
        hasDifferences:
          type: boolean
        tableDiffs:
          type: array
          items:
            $ref: '#/components/schemas/TableDiff'
        summary:
          $ref: '#/components/schemas/DiffSummary'

    TableDiff:
      type: object
      required:
        - tableName
        - diffType
      properties:
        tableName:
          type: string
        diffType:
          type: string
          enum: [missing, extra, modified]
        columnDiffs:
          type: array
          items:
            $ref: '#/components/schemas/ColumnDiff'
        constraintDiffs:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintDiff'
        indexDiffs:
          type: array
          items:
            $ref: '#/components/schemas/IndexDiff'

    ColumnDiff:
      type: object
      required:
        - columnName
        - diffType
      properties:
        columnName:
          type: string
        diffType:
          type: string
          enum: [missing, extra, type_mismatch, nullability_mismatch, default_mismatch]
        sourceValue:
          description: Value in source schema
        targetValue:
          description: Value in target schema

    ConstraintDiff:
      type: object
      required:
        - constraintName
        - constraintType
        - diffType
      properties:
        constraintName:
          type: string
        constraintType:
          type: string
          enum: [primary_key, foreign_key, unique, check]
        diffType:
          type: string
          enum: [missing, extra, definition_mismatch]
        sourceDefinition:
          type: string
        targetDefinition:
          type: string

    IndexDiff:
      type: object
      required:
        - indexName
        - diffType
      properties:
        indexName:
          type: string
        diffType:
          type: string
          enum: [missing, extra, definition_mismatch]
        sourceDefinition:
          type: string
        targetDefinition:
          type: string

    DiffSummary:
      type: object
      required:
        - totalDifferences
      properties:
        missingTables:
          type: integer
          minimum: 0
        extraTables:
          type: integer
          minimum: 0
        modifiedTables:
          type: integer
          minimum: 0
        missingColumns:
          type: integer
          minimum: 0
        extraColumns:
          type: integer
          minimum: 0
        modifiedColumns:
          type: integer
          minimum: 0
        missingIndexes:
          type: integer
          minimum: 0
        extraIndexes:
          type: integer
          minimum: 0
        totalDifferences:
          type: integer
          minimum: 0

    MigrationGenerationResult:
      type: object
      required:
        - migrationsGenerated
        - files
      properties:
        migrationsGenerated:
          type: integer
          minimum: 0
          description: Number of migration files generated
        files:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedMigration'
        warnings:
          type: array
          items:
            type: string
          description: Warnings about generated migrations
        manualSteps:
          type: array
          items:
            type: string
          description: Manual actions required before or after applying migrations
        dryRun:
          type: boolean
          description: Whether this was a dry run (no files written)

    GeneratedMigration:
      type: object
      required:
        - filename
        - reason
        - affectedObjects
        - requiresReview
      properties:
        filename:
          type: string
          pattern: '^\d{8}_\d{3}_[a-z0-9_]+\.sql$'
          description: Generated migration filename
          example: "20251003_001_add_missing_users_table.sql"
        filePath:
          type: string
          description: Full path to generated migration file
        reason:
          type: string
          enum:
            - missing_table
            - extra_table
            - missing_column
            - extra_column
            - type_mismatch
            - missing_constraint
            - extra_constraint
            - missing_index
            - extra_index
        affectedObjects:
          type: array
          minItems: 1
          items:
            type: string
          description: Tables/columns/constraints being modified
          example: ["users", "users.email"]
        requiresReview:
          type: boolean
          description: Always true per FR-024a
        rollbackFile:
          type: string
          nullable: true
          description: Path to corresponding rollback migration (if generated)
        sqlPreview:
          type: string
          description: Preview of generated SQL (first 500 characters or full if < 500)
        metadata:
          type: object
          properties:
            generatedAt:
              type: string
              format: date-time
            source:
              type: string
              enum: [auto-generated]
            isReversible:
              type: boolean
            rollbackReason:
              type: string
              nullable: true
              description: If not reversible, why?

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

  migrationFileFormat:
    description: |
      Generated migration file format:

      -- Migration: [AUTO-GENERATED] Add missing bulk_rollback_batches table
      -- Created: 2025-10-03T10:30:00Z
      -- Source: Schema drift detection (verify-schema)
      -- Affected: bulk_rollback_batches
      -- Reason: missing_table
      -- Requires Review: YES (manual verification required per FR-024a)

      BEGIN;

      -- Add missing table: bulk_rollback_batches
      CREATE TABLE IF NOT EXISTS hr_public.bulk_rollback_batches (
        id SERIAL PRIMARY KEY,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        created_by INTEGER NOT NULL REFERENCES hr_public.users(id),
        status TEXT NOT NULL CHECK (status IN ('pending', 'in_progress', 'completed', 'failed')),
        total_activities INTEGER NOT NULL DEFAULT 0,
        processed_activities INTEGER NOT NULL DEFAULT 0
      );

      -- Add indexes
      CREATE INDEX IF NOT EXISTS idx_bulk_rollback_batches_status ON hr_public.bulk_rollback_batches(status);
      CREATE INDEX IF NOT EXISTS idx_bulk_rollback_batches_created_at ON hr_public.bulk_rollback_batches(created_at);

      COMMIT;

  rollbackFileFormat:
    description: |
      Generated rollback migration file format:

      -- Rollback Migration: [AUTO-GENERATED] Revert addition of bulk_rollback_batches table
      -- Created: 2025-10-03T10:30:00Z
      -- Forward Migration: 20251003_001_add_missing_bulk_rollback_batches_table.sql
      -- WARNING: This will delete all data in bulk_rollback_batches table

      BEGIN;

      -- Remove table: bulk_rollback_batches
      DROP TABLE IF EXISTS hr_public.bulk_rollback_batches CASCADE;

      COMMIT;

  exitCodes:
    description: |
      CLI exit codes:
      - 0: Success (migration files generated)
      - 1: Validation error (invalid diff, no differences, unsafe migration)
      - 2: Generation failed (filesystem error, template error)
