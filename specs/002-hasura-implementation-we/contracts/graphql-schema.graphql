}

# Job Information
type job_information {
  id: uuid!
  employee_id: uuid!
  department_id: uuid
  job_title: String
  hire_date: date
  employment_type: String
  work_location: String
  work_schedule: String
  manager_id: uuid
  termination_date: date
  is_remote: Boolean!
  created_at: timestamptz!
  updated_at: timestamptz!
  
  # Relationships
  employee: users!
  department: departments
  manager: users
}

# Compensation (Sensitive Data)
type compensation {
  id: uuid!
  employee_id: uuid!
  pay_type: pay_type_enum
