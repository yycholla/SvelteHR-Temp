# GraphQL Schema Contract for Hasura HR System
# Auto-generated from PostgreSQL schema with Hasura GraphQL Engine

# Core Scalars
scalar uuid
scalar timestamptz
scalar numeric
scalar date

# Enums
enum onboarding_status_enum {
  PreHire
  Onboarding
  Active
  Terminated
}

enum pay_type_enum {
  Hourly
  Salary
  Commission
  Contractor
}

enum bank_account_type_enum {
  Checking
  Savings
}

# User Entity (Central Hub)
type users {
  id: uuid!
  email: String!
  display_name: String!
  onboarding_status: onboarding_status_enum!
  job_title: String
  is_active: Boolean!
  created_at: timestamptz!
  updated_at: timestamptz!
  
  # Relationships
  job_information: job_information
  contact_information: contact_information
  personal_information: personal_information
  compensation: compensation
  user_role_assignments(where: user_role_assignments_bool_exp, order_by: [user_role_assignments_order_by!], limit: Int, offset: Int): [user_role_assignments!]!
  auth_sessions(where: auth_sessions_bool_exp, order_by: [auth_sessions_order_by!], limit: Int, offset: Int): [auth_sessions!]!
  managed_departments(where: departments_bool_exp, order_by: [departments_order_by!], limit: Int, offset: Int): [departments!]!
}

# Department Entity
type departments {
  id: uuid!
  name: String!
  description: String
  budget: numeric
  is_active: Boolean!
  parent_department_id: uuid
  manager_id: uuid
  created_at: timestamptz!
  updated_at: timestamptz!
  
  # Relationships
  parent_department: departments
  manager: users
  subdepartments(where: departments_bool_exp, order_by: [departments_order_by!], limit: Int, offset: Int): [departments!]!
  job_informations(where: job_information_bool_exp, order_by: [job_information_order_by!], limit: Int, offset: Int): [job_information!]!
  
  # Computed fields (from PostgreSQL views)
  employee_count: Int
  active_employee_count: Int
  subdepartment_count: Int
  budget_per_employee: numeric
}

# Role Entity
type user_roles {
  id: uuid!
  name: String!
  level: Int!
  description: String
  created_at: timestamptz!
  
  # Relationships
  user_role_assignments(where: user_role_assignments_bool_exp, order_by: [user_role_assignments_order_by!], limit: Int, offset: Int): [user_role_assignments!]!
}

# Role Assignment Junction
type user_role_assignments {
  id: uuid!
