openapi: 3.0.3
info:
  title: SvelteHR Authentication API (GelDB Integration)
  description: API contracts for frontend authentication endpoints that integrate with GelDB built-in auth
  version: 2.0.0
  contact:
    name: SvelteHR Team
    email: team@sveltehr.com

servers:
  - url: http://localhost:5173/api
    description: Development server
  - url: https://app.sveltehr.com/api
    description: Production server

paths:
  /auth/verify:
    get:
      summary: Verify current authentication session
      description: Validates current session and returns user information with RBAC data
      operationId: verifySession
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Valid session - returns user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/permissions:
    get:
      summary: Get current user's permissions
      description: Returns current user's roles and effective permissions from RBAC system
      operationId: getUserPermissions
      security:
        - sessionAuth: []
      responses:
        '200':
          description: User permissions data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPermissions'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: auth-session
      description: Frontend session cookie (not GelDB token directly)

  schemas:
    AuthUser:
      type: object
      required:
        - id
        - identity_id
        - email
        - full_name
        - roles
        - is_active
      properties:
        id:
          type: string
          format: uuid
          description: RBAC::User ID
        identity_id:
          type: string
          format: uuid
          description: GelDB ext::auth::Identity ID
        email:
          type: string
          format: email
          description: User email address (synced from GelDB)
        full_name:
          type: string
          description: User display name
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
          description: User's RBAC roles
        department:
          type: string
          description: User's department
        job_title:
          type: string
          description: User's job title
        is_active:
          type: boolean
          description: Account status
        last_login:
          type: string
          format: date-time
          description: Last successful authentication

    UserRole:
      type: object
      required:
        - name
        - level
      properties:
        name:
          type: string
          description: Role name
          example: "HR_Manager"
        level:
          type: number
          description: Role hierarchy level (higher = more permissions)
          example: 75
        display_name:
          type: string
          description: Human-readable role name
          example: "HR Manager"

    UserPermissions:
      type: object
      required:
        - user_id
        - roles
        - permissions
      properties:
        user_id:
          type: string
          format: uuid
          description: RBAC::User ID
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
          description: User's roles with hierarchy
        permissions:
          type: array
          items:
            type: string
          description: Effective permissions (resource:action format)
          example: ["employees:read", "employees:update", "reports:create"]

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code for programmatic handling
        details:
          type: object
          description: Additional error context

# Documentation Notes:
# 
# GelDB Built-in Auth Handles:
# - /login redirects (via GelDB auth extension UI)
# - /callback processing (OAuth flow with auth codes)
# - /logout (GelDB session termination)
# - PKCE challenge/verifier generation
# - Magic Link email sending and validation
# - JWT token generation and signing
# 
# Our Frontend Provides:
# - Session management (this API)
# - RBAC integration (via backend)
# - User experience and routing
# - Identity synchronization coordination