openapi: 3.0.3
info:
  title: RBAC Authorization API
  description: Role-based access control API for protected resources
  version: 1.0.0
  contact:
    name: SvelteHR Team
    email: team@sveltehr.com

servers:
  - url: http://localhost:5173/api
    description: Development server
  - url: https://app.sveltehr.com/api
    description: Production server

paths:
  /users/{userId}/permissions:
    get:
      summary: Get user permissions
      description: Retrieve detailed permissions for a specific user
      operationId: getUserPermissionsByUserId
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPermissions'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /permissions/check:
    post:
      summary: Check specific permission
      description: Validate if current user has specific permission
      operationId: checkPermission
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionCheckRequest'
      responses:
        '200':
          description: Permission check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCheckResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /roles:
    get:
      summary: List all roles
      description: Get list of available roles in the system
      operationId: listRoles
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '403':
          description: Insufficient permissions (Admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}/roles:
    get:
      summary: Get user roles
      description: Get roles assigned to a specific user
      operationId: getUserRoles
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update user roles
      description: Assign/remove roles for a user (Admin only)
      operationId: updateUserRoles
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolesRequest'
      responses:
        '200':
          description: Roles updated successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '403':
          description: Insufficient permissions (Admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pages/{pageId}/access:
    get:
      summary: Check page access
      description: Verify if current user can access specific page/route
      operationId: checkPageAccess
      parameters:
        - name: pageId
          in: path
          required: true
          schema:
            type: string
          description: Page identifier (e.g., "employees", "admin", "reports")
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Access check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAccessResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gel-auth-token

  schemas:
    UserPermissions:
      type: object
      required:
        - user_id
        - roles
        - permissions
        - effective_permissions
      properties:
        user_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
          description: Direct permissions
        effective_permissions:
          type: array
          items:
            type: string
          description: All permissions including inherited from roles

    Role:
      type: object
      required:
        - id
        - name
        - level
        - permissions
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          enum: [Admin, HR_Manager, Manager, Employee]
        display_name:
          type: string
          description: Human-readable role name
        level:
          type: integer
          minimum: 1
          maximum: 100
          description: Role hierarchy level (higher = more permissions)
        permissions:
          type: array
          items:
            type: string
          description: Permissions granted by this role
        description:
          type: string
          description: Role description

    PermissionCheckRequest:
      type: object
      required:
        - permission
      properties:
        permission:
          type: string
          description: Permission to check
          example: "employees:read"
        resource_id:
          type: string
          format: uuid
          description: Optional specific resource ID
        context:
          type: object
          description: Additional context for permission check

    PermissionCheckResponse:
      type: object
      required:
        - allowed
        - permission
      properties:
        allowed:
          type: boolean
          description: Whether permission is granted
        permission:
          type: string
          description: The permission that was checked
        reason:
          type: string
          description: Reason for denial (if not allowed)
        required_roles:
          type: array
          items:
            type: string
          description: Roles that would grant this permission

    UpdateRolesRequest:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            type: string
          description: Role names to assign
          example: ["Employee", "Manager"]
        reason:
          type: string
          description: Reason for role change (audit trail)

    PageAccessResponse:
      type: object
      required:
        - allowed
        - page_id
      properties:
        allowed:
          type: boolean
          description: Whether page access is granted
        page_id:
          type: string
          description: Page identifier
        required_permissions:
          type: array
          items:
            type: string
          description: Permissions required for this page
        redirect_url:
          type: string
          description: URL to redirect if access denied
        message:
          type: string
          description: User-friendly access message

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error context
        timestamp:
          type: string
          format: date-time

security:
  - cookieAuth: []