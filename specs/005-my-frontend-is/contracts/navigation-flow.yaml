openapi: 3.0.3
info:
  title: SvelteHR Navigation Flow Contract
  description: Client-side navigation patterns and redirect behavior contracts
  version: 0.0.1

servers:
  - url: http://localhost:5175
    description: SvelteKit development server

paths:
  /:
    get:
      summary: Root page - should redirect based on auth state
      description: |
        Root page that redirects authenticated users to appropriate dashboard
        and unauthenticated users to login page. MUST NOT create redirect loops.
      responses:
        '302':
          description: Redirect to appropriate page
          headers:
            Location:
              schema:
                type: string
                enum:
                  - '/login'
                  - '/admin'
                  - '/dashboard'
              description: Redirect destination based on auth state and role
        '200':
          description: Loading state (temporary)
          content:
            text/html:
              schema:
                type: string
                description: Loading spinner while determining redirect

  /login:
    get:
      summary: Login page - should redirect if already authenticated
      description: |
        Login page that redirects already authenticated users to their dashboard.
        Should handle redirect query parameter for post-login navigation.
      parameters:
        - name: redirect
          in: query
          description: Path to redirect to after successful login
          schema:
            type: string
            example: '/admin'
      responses:
        '302':
          description: Redirect if already authenticated
          headers:
            Location:
              schema:
                type: string
              description: Redirect to dashboard based on user role
        '200':
          description: Show login form
          content:
            text/html:
              schema:
                type: string
                description: Login form HTML

    post:
      summary: Process login form submission
      description: |
        Handle login form submission, authenticate user, and redirect to appropriate dashboard.
        MUST NOT create redirect loops on successful authentication.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '302':
          description: Successful login - redirect to dashboard
          headers:
            Location:
              schema:
                type: string
                enum:
                  - '/admin'
                  - '/dashboard'
              description: Role-based redirect destination
        '400':
          description: Invalid credentials - stay on login page
          content:
            text/html:
              schema:
                type: string
                description: Login form with error message

  /admin:
    get:
      summary: Admin dashboard - requires admin role
      description: |
        Admin dashboard accessible only to users with admin role (level 100).
        Should redirect non-admin users to appropriate page without loops.
      responses:
        '200':
          description: Admin dashboard for authenticated admin users
          content:
            text/html:
              schema:
                type: string
                description: Admin dashboard HTML
        '302':
          description: Redirect if not authenticated or not admin
          headers:
            Location:
              schema:
                type: string
                enum:
                  - '/login?redirect=%2Fadmin'
                  - '/dashboard'
              description: Redirect to login or regular dashboard
        '403':
          description: Forbidden - user lacks admin permissions
          content:
            text/html:
              schema:
                type: string
                description: Access denied page

  /dashboard:
    get:
      summary: Regular dashboard - requires authentication
      description: |
        Regular dashboard for authenticated non-admin users.
        Should redirect unauthenticated users to login without loops.
      responses:
        '200':
          description: Dashboard for authenticated users
          content:
            text/html:
              schema:
                type: string
                description: Dashboard HTML
        '302':
          description: Redirect if not authenticated
          headers:
            Location:
              schema:
                type: string
                enum:
                  - '/login'
              description: Redirect to login page

components:
  schemas:
    RedirectBehavior:
      type: object
      description: Expected redirect behavior to prevent loops
      properties:
        maxRedirects:
          type: integer
          maximum: 3
          description: Maximum consecutive redirects allowed
        redirectDelay:
          type: integer
          minimum: 100
          description: Minimum milliseconds between redirects
        sessionFlags:
          type: array
          items:
            type: string
          description: Session storage flags to prevent duplicate redirects
          example:
            - 'hr_login_redirected'
            - 'hr_root_redirected'

    AuthenticationStates:
      type: string
      enum:
        - 'INITIALIZING'
        - 'AUTHENTICATED'
        - 'UNAUTHENTICATED'
        - 'LOADING'
        - 'ERROR'
      description: Possible authentication states that affect navigation

    NavigationContract:
      type: object
      description: Contract for navigation behavior
      properties:
        authState:
          $ref: '#/components/schemas/AuthenticationStates'
        userRole:
          type: string
          enum: ['admin', 'hr_admin', 'manager', 'employee']
        currentPath:
          type: string
          description: Current page path
        expectedRedirect:
          type: string
          nullable: true
          description: Expected redirect destination (null if no redirect)
        redirectReason:
          type: string
          enum:
            - 'not_authenticated'
            - 'insufficient_permissions'
            - 'already_authenticated'
            - 'role_based_routing'
          description: Reason for redirect

    RedirectLoopPrevention:
      type: object
      description: Mechanisms to prevent redirect loops
      properties:
        protectedRoutes:
          type: array
          items:
            type: string
          description: Routes that require authentication
          example: ['/admin', '/dashboard', '/profile']
        unprotectedRoutes:
          type: array
          items:
            type: string
          description: Routes that don't require authentication
          example: ['/', '/login', '/auth/callback']
        roleBasedRoutes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Routes accessible by specific roles
          example:
            admin: ['/admin', '/dashboard', '/users']
            employee: ['/dashboard', '/profile']