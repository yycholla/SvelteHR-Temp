openapi: 3.0.3
info:
  title: SvelteHR Authentication API
  description: Authentication endpoints for fixing redirect loop issues
  version: 0.0.1

servers:
  - url: http://localhost:4000
    description: PostGraphile GraphQL endpoint

paths:
  /graphql:
    post:
      summary: GraphQL endpoint for authentication operations
      description: |
        Main GraphQL endpoint that handles authentication mutations and queries.
        Used for login, token validation, and user data retrieval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: GraphQL query or mutation
                variables:
                  type: object
                  description: GraphQL variables
              examples:
                login:
                  summary: User login mutation
                  value:
                    query: |
                      mutation Login($email: String!, $password: String!) {
                        authenticate(input: {email: $email, password: $password}) {
                          jwtToken
                          user {
                            id
                            email
                            displayName
                            role
                            roleLevel
                            isActive
                          }
                        }
                      }
                    variables:
                      email: 'admin@postgraphile-hr.com'
                      password: 'admin123'

                getCurrentUser:
                  summary: Get current user query
                  value:
                    query: |
                      query GetCurrentUser {
                        currentUser {
                          id
                          email
                          displayName
                          role
                          roleLevel
                          isActive
                          roleAssignments {
                            nodes {
                              role
                              level
                              permissions
                            }
                          }
                        }
                      }

                validateToken:
                  summary: Validate JWT token
                  value:
                    query: |
                      query ValidateToken {
                        currentUser {
                          id
                          email
                          isActive
                        }
                      }

      responses:
        '200':
          description: Successful GraphQL response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: GraphQL response data
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                        locations:
                          type: array
                        path:
                          type: array
                examples:
                  loginSuccess:
                    summary: Successful login response
                    value:
                      data:
                        authenticate:
                          jwtToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                          user:
                            id: '8f845bcd-e9b9-4eff-9d72-562962435248'
                            email: 'admin@postgraphile-hr.com'
                            displayName: 'admin'
                            role: 'hr_admin'
                            roleLevel: 100
                            isActive: true

                  loginFailure:
                    summary: Failed login response
                    value:
                      errors:
                        - message: 'Invalid credentials'
                          locations: [{ 'line': 2, 'column': 3 }]
                          path: ['authenticate']

                  userQuery:
                    summary: Current user query response
                    value:
                      data:
                        currentUser:
                          id: '8f845bcd-e9b9-4eff-9d72-562962435248'
                          email: 'admin@postgraphile-hr.com'
                          displayName: 'admin'
                          role: 'hr_admin'
                          roleLevel: 100
                          isActive: true
                          roleAssignments:
                            nodes:
                              - role: 'hr_admin'
                                level: 100
                                permissions: ['system:configure', 'view_users', 'manage_users']

                  tokenExpired:
                    summary: Expired token response
                    value:
                      errors:
                        - message: 'JWT token expired'
                          locations: [{ 'line': 1, 'column': 1 }]
                          path: ['currentUser']

        '400':
          description: Bad request (malformed GraphQL)
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string

        '401':
          description: Unauthorized (invalid or missing JWT)
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string

      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from authentication mutation.
        Include in Authorization header as "Bearer <token>".

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
        email:
          type: string
          format: email
          description: User email address
        displayName:
          type: string
          description: User display name
        role:
          type: string
          enum: [hr_admin, manager, employee]
          description: Primary user role
        roleLevel:
          type: integer
          minimum: 20
          maximum: 100
          description: Numeric permission level
        isActive:
          type: boolean
          description: Whether user account is active

    JWTToken:
      type: string
      description: |
        JWT token with claims:
        - user_id: User UUID
        - role: User role string
        - aud: "postgraphile"
        - exp: Expiration timestamp
        - iat: Issued at timestamp

    AuthenticationResult:
      type: object
      properties:
        jwtToken:
          $ref: '#/components/schemas/JWTToken'
        user:
          $ref: '#/components/schemas/User'

    RoleAssignment:
      type: object
      properties:
        role:
          type: string
          description: Role name
        level:
          type: integer
          description: Permission level
        permissions:
          type: array
          items:
            type: string
          description: Specific permissions for this role
